        audio.playbackRate = state.speed;
        downloadEp.href = encodeURI(ep.audioFile);
        dockEpLabel.textContent = `${ep.epNum} (${ep.code}) · ${ep.titleZh}`;
        seekSlider.max = String(ep.duration);
        seekSlider.value = '0';
        curTimeEl.textContent = '00:00';
        durTimeEl.textContent = fmtTime(ep.duration);

        if (autoPlay) {
          audio.play().catch(() => {});
        } else {
          playBtn.textContent = '▶ 开始听课';
        }
      }

      function seekAndPlay(targetSec) {
        if (audio.readyState >= 1) {
          audio.currentTime = targetSec;
          audio.play().catch(() => {});
        } else {
          audio.addEventListener('loadedmetadata', function onMeta() {
            audio.removeEventListener('loadedmetadata', onMeta);
            audio.currentTime = targetSec;
            audio.play().catch(() => {});
          });
          audio.load();
        }
      }

      function syncClassroomHighlight(t) {
        const ep = episodes[state.currentEpIdx];
        if (!ep) return;

        let foundIdx = -1;
        for (let i = 0; i < ep.turns.length; i++) {
          const turn = ep.turns[i];
          const nextStart = (i + 1 < ep.turns.length) ? ep.turns[i + 1].start : ep.duration + 1;
          if (t >= turn.start - 0.08 && t < nextStart) {
            foundIdx = i;
            break;
          }
        }

        if (foundIdx !== -1 && foundIdx !== activeTurnIdx) {
          activeTurnIdx = foundIdx;
          transcriptList.querySelectorAll('.turn-bubble').forEach((el, i) => {
            el.classList.toggle('active-turn', i === foundIdx);
          });
          const activeTurnEl = document.getElementById(`turn-${foundIdx}`);
          if (activeTurnEl && state.autoScroll) {
            activeTurnEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }

          const targetBoardId = ep.turns[foundIdx].boardId;
          if (targetBoardId && targetBoardId !== activeBoardId) {
            const prevBoard = activeBoardId;
            activeBoardId = targetBoardId;
            boardsContainer.querySelectorAll('.board-card').forEach(card => {
              card.classList.toggle('is-active-board', card.getAttribute('data-board-id') === targetBoardId);
            });
            if (prevBoard !== null && state.autoScroll) {
              const cardEl = document.getElementById(`card-${targetBoardId}`);
              if (cardEl) {
                const y = cardEl.getBoundingClientRect().top + window.scrollY - 82;
                window.scrollTo({ top: y, behavior: 'smooth' });
              }
            }
          }
        }
      }

      audio.addEventListener('timeupdate', () => {
        const t = audio.currentTime;
        if (!isDraggingSlider) {
          seekSlider.value = String(t);
        }
        curTimeEl.textContent = fmtTime(t);
        syncClassroomHighlight(t);
      });

      audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && isFinite(audio.duration)) {
          seekSlider.max = String(audio.duration);
          durTimeEl.textContent = fmtTime(audio.duration);
        }
        audio.playbackRate = state.speed;
      });

      audio.addEventListener('play', () => {
        playBtn.textContent = '⏸ 暂停';
      });

      audio.addEventListener('pause', () => {
        playBtn.textContent = '▶ 继续听课';
      });

      audio.addEventListener('ended', () => {
        const ep = episodes[state.currentEpIdx];
        state.doneEps[ep.id] = true;
        saveState();
        renderEpisodeStrip();
        if (state.autoPlayNext && state.currentEpIdx + 1 < episodes.length) {
          loadEpisode(state.currentEpIdx + 1, true);
        } else {
          playBtn.textContent = '↺ 重听本讲';
        }
      });

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().catch(() => {});
        } else {
          audio.pause();
        }
      });

      document.getElementById('rew-btn').addEventListener('click', () => {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      });

      document.getElementById('fwd-btn').addEventListener('click', () => {
        audio.currentTime = Math.min(audio.duration || 9999, audio.currentTime + 10);
      });

      document.getElementById('prev-ep-btn').addEventListener('click', () => {
        if (state.currentEpIdx > 0) loadEpisode(state.currentEpIdx - 1, !audio.paused);
      });

      document.getElementById('next-ep-btn').addEventListener('click', () => {
        if (state.currentEpIdx + 1 < episodes.length) loadEpisode(state.currentEpIdx + 1, !audio.paused);
      });

      seekSlider.addEventListener('input', () => {
        isDraggingSlider = true;
        curTimeEl.textContent = fmtTime(parseFloat(seekSlider.value));
      });

      seekSlider.addEventListener('change', () => {
        audio.currentTime = parseFloat(seekSlider.value);
        isDraggingSlider = false;
      });

      speedSelect.addEventListener('change', () => {
        state.speed = parseFloat(speedSelect.value);
        audio.playbackRate = state.speed;
        saveState();
      });

      autoScrollBtn.addEventListener('click', () => {
        state.autoScroll = !state.autoScroll;
        autoScrollBtn.classList.toggle('on', state.autoScroll);
        autoScrollBtn.textContent = state.autoScroll ? '🎯 自动跟随：开' : '🎯 自动跟随：关';
      });

      autoplayBtn.addEventListener('click', () => {
        state.autoPlayNext = !state.autoPlayNext;
        autoplayBtn.textContent = state.autoPlayNext ? '🔁 连播：开' : '🔁 连播：关';
      });

      document.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        if (e.code === 'Space') {
          e.preventDefault();
          playBtn.click();
        } else if (e.code === 'ArrowLeft') {
          audio.currentTime = Math.max(0, audio.currentTime - 5);
        } else if (e.code === 'ArrowRight') {
          audio.currentTime = Math.min(audio.duration || 9999, audio.currentTime + 5);
        }
      });

      loadEpisode(state.currentEpIdx, false);
    })();
  </script>
</body>
</html>
