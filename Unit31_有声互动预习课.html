<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Unit31有声预习" />
  <title>Unit 31 各官能团的典型反应 · 有声互动预习课 | Mastering Chemistry</title>
  <style>
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-sec: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-soft: #f0f9ff;

      --teal: #0d9488;
      --teal-soft: #f0fdfa;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --emerald: #059669;
      --emerald-soft: #ecfdf5;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 108px;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-sec);
      transition: all 0.15s;
      cursor: pointer;
    }

    .pill-link:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .pill-link.primary-pill {
      background: var(--primary-soft);
      border-color: #c7d2fe;
      color: var(--primary-dark);
    }

    .pill-link.active-unit-pill {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      cursor: default;
      font-weight: 700;
    }

    .ep-strip-wrap {
      max-width: 1440px;
      margin: 14px auto 0;
      padding: 0 18px;
    }

    .ep-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(185px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .ep-tab {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      position: relative;
    }

    .ep-tab:hover {
      border-color: #a5b4fc;
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .ep-tab.active {
      border-color: var(--primary);
      background: linear-gradient(180deg, var(--primary-soft) 0%, #ffffff 100%);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.14);
    }

    .ep-tab-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
    }

    .ep-done-dot {
      font-size: 11px;
      color: var(--emerald);
      background: var(--emerald-soft);
      padding: 1px 6px;
      border-radius: 99px;
      font-weight: 700;
    }

    .ep-tab-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ep-tab-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .classroom-grid {
      max-width: 1440px;
      margin: 14px auto 24px;
      padding: 0 18px;
      display: grid;
      grid-template-columns: minmax(0, 1.34fr) minmax(360px, 1fr);
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 1060px) {
      .classroom-grid { grid-template-columns: 1fr; }
      .ep-strip { grid-template-columns: repeat(6, 220px); }
    }

    .blackboard-pane {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ep-hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
    }

    .ep-hero-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .ep-hero-title {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }

    .ep-hero-en {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .ep-goal-box {
      background: var(--bg-subtle);
      border-left: 3.5px solid var(--primary);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 13.5px;
      color: var(--text-sec);
      margin-bottom: 10px;
    }

    .term-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .term-chip {
      font-size: 12px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 3px 10px;
      color: #1e293b;
    }

    .term-chip b {
      color: var(--primary-dark);
      font-weight: 700;
    }

    .board-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
      position: relative;
    }

    .board-card.is-active-board {
      border-color: var(--primary);
      box-shadow: 0 10px 28px rgba(79, 70, 229, 0.14);
      background: #ffffff;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .board-tag-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .board-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
    }

    .board-card.is-active-board .board-tag {
      background: var(--primary);
      color: #ffffff;
    }

    .live-pill {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--emerald);
      background: var(--emerald-soft);
      border: 1px solid #a7f3d0;
      padding: 2px 8px;
      border-radius: 999px;
      animation: pulseGlow 1.8s infinite;
    }

    .board-card.is-active-board .live-pill {
      display: inline-flex;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.68; }
    }

    .board-jump-btn {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .board-jump-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .board-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }

    .board-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 720px) {
      .board-grid-2 { grid-template-columns: 1fr; }
    }

    .b-box {
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }

    .b-amber   { background: #fffbeb; border-color: #fde68a; }
    .b-blue    { background: #eff6ff; border-color: #bfdbfe; }
    .b-rose    { background: #fff1f2; border-color: #fecdd3; }
    .b-teal    { background: #f0fdfa; border-color: #99f6e4; }
    .b-emerald { background: #ecfdf5; border-color: #a7f3d0; }

    .b-box-title {
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .b-eq {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 8px;
      padding: 8px 11px;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 7px;
      overflow-x: auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .b-points {
      margin: 6px 0 0;
      padding-left: 18px;
      font-size: 13px;
      color: var(--text-sec);
    }

    .b-points li { margin-bottom: 4px; }

    .b-quote {
      background: linear-gradient(90deg, var(--primary-soft), #f8fafc);
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 10px;
    }

    .b-quote-en {
      font-size: 13.3px;
      color: #1e3a8a;
      margin-bottom: 5px;
      line-height: 1.6;
    }

    .b-quote-zh {
      font-size: 13px;
      color: #0f172a;
    }

    .b-scheme {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 10px;
      padding: 11px 14px;
      overflow-x: auto;
      margin-bottom: 8px;
    }

    .b-scheme pre {
      margin: 0;
      font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
      font-size: 12.5px;
      line-height: 1.54;
      color: #e2e8f0;
    }

    .b-mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.8px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .b-mini-table th {
      background: #f1f5f9;
      color: #0f172a;
      font-weight: 700;
      text-align: left;
      padding: 8px 10px;
      border: 1px solid var(--border);
    }

    .b-mini-table td {
      padding: 8px 10px;
      border: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-sec);
    }

    .b-note {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12.8px;
      color: #92400e;
    }

    .b-tip-text {
      margin: 0;
      font-size: 13px;
      color: var(--text-sec);
    }

    .board-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    code {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 0.92em;
      background: rgba(15, 23, 42, 0.06);
      padding: 1px 5px;
      border-radius: 4px;
      color: #be123c;
    }

    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
    }

    .quiz-head {
      font-size: 15.5px;
      font-weight: 800;
      margin: 0 0 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .q-item {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
    }

    .q-item:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }

    .q-stem {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .q-opts {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .q-opt-btn {
      text-align: left;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      font-size: 13.5px;
      color: var(--text-sec);
      cursor: pointer;
      transition: all 0.15s;
    }

    .q-opt-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .q-opt-btn.correct {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #065f46;
      font-weight: 700;
    }

    .q-opt-btn.wrong {
      background: var(--rose-soft);
      border-color: var(--rose);
      color: #9f1239;
    }

    .q-exp {
      display: none;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      font-size: 13px;
      color: #166534;
    }

    /* Right Pane: Single-Teacher Structured Lecture Stream */
    .transcript-pane {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 72px;
      max-height: calc(100vh - 184px);
    }

    @media (max-width: 1060px) {
      .transcript-pane {
        position: static;
        max-height: none;
      }
    }

    .transcript-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .transcript-title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-main);
    }

    .auto-scroll-btn {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-sec);
      cursor: pointer;
    }

    .auto-scroll-btn.on {
      background: var(--primary-soft);
      border-color: #a5b4fc;
      color: var(--primary-dark);
    }

    .transcript-list {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .turn-bubble {
      border-radius: 12px;
      padding: 11px 13px;
      border: 1.5px solid #e2e8f0;
      border-left-width: 4px;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }

    .turn-bubble.role-concept { border-left-color: #4f46e5; }
    .turn-bubble.role-example { border-left-color: #0d9488; background: #f8fdfa; }
    .turn-bubble.role-trap    { border-left-color: #e11d48; background: #fff9fa; }
    .turn-bubble.role-summary { border-left-color: #059669; background: #f6fef9; }

    .turn-bubble:hover {
      border-color: #a5b4fc;
      transform: translateX(1px);
    }

    .turn-bubble.active-turn {
      background: var(--primary-soft);
      border-color: var(--primary);
      border-left-width: 4.5px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.14);
    }

    .turn-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .speaker-name {
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--primary-dark);
    }

    .role-trap .speaker-name { color: #be123c; }
    .role-example .speaker-name { color: #0f766e; }
    .role-summary .speaker-name { color: #047857; }

    .turn-time {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .turn-text {
      font-size: 14px;
      line-height: 1.64;
      color: var(--text-main);
    }

    /* Sticky Bottom Audio Dock */
    .audio-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 120;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      color: #f8fafc;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px 12px;
      box-shadow: 0 -8px 28px rgba(15, 23, 42, 0.25);
    }

    .dock-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-lbl {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 12px;
      color: #cbd5e1;
      min-width: 44px;
    }

    .scrubber-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    #seek-slider {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
      height: 6px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ctrl-left, .ctrl-center, .ctrl-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .now-playing-label {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      max-width: 360px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .play-main-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 999px;
      padding: 7px 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(129, 140, 248, 0.4);
    }

    .play-main-btn:hover {
      background: #7dd3fc;
    }

    .speed-select {
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .speed-select option {
      color: #0f172a;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">
      <div class="brand-badge">U31</div>
      <div>
        <div class="brand-title">Unit 31 各官能团的典型反应 · 双语有声互动预习课</div>
        <div class="brand-sub">HKDSE 精工版《Mastering Chemistry》Book 3B · 陈老师沉稳主讲 + 动态声画同步黑板</div>
      </div>
    </div>

共价键的 <code>substitution reaction</code> <strong>极慢（very slow at r.t.）</strong>；<strong><code>heating</code> speeds up the rate of reaction</strong>。</p>\n                  </div>\n                  <div class=\"b-box b-teal\">\n                    <div class=\"b-box-title\">② [1M] 为什么必须 <code>Under reflux</code>（回流）？</div>\n                    <p class=\"b-tip-text\">短链 <code>haloalkanes</code> 沸点低、<strong>易挥发（<code>volatile</code>）</strong>；竖装水冷凝管可将蒸气冷凝流回烧瓶（<strong>condenses vapour back to prevent loss of volatile reactants / products</strong>）。</p>\n                  </div>\n                </div>\n                ", "start": 0.25, "end": 70.638}, {"id": "b2_2", "tag": "板书 2 · 验卤三步曲 (31.4B)", "title": "检验 Haloalkane 所含卤素种类的必考三步曲（漏写稀硝酸直接 0 分！）", "html": "\n                <div class=\"b-scheme\">\n<pre>Step 1 (断键释离子) : R—X + NaOH(aq) ──(heat under reflux)──▶ R—OH + X⁻(aq)   (随后冷却 cool the mixture)\n                           │\n                           ▼  ★ 生死采分步！严禁直接滴 AgNO₃(aq)，亦严禁用 HCl / H₂SO₄！\nStep 2 (酸化清残碱) : 加入过量稀硝酸 Acidify with EXCESS dilute nitric acid, HNO₃(aq)！\n                      (彻底中和剩余 OH⁻：H⁺ + OH⁻ ⟶ H₂O，防止 OH⁻ 与 Ag⁺ 生成棕黑色 Ag₂O(s) 沉淀遮盖颜色！)\n                           │\n                           ▼\nStep 3 (银盐看色号) : 加入 aqueous silver nitrate, AgNO₃(aq) ──▶ Ag⁺(aq) + X⁻(aq) ⟶ AgX(s)↓</pre>\n                </div>\n                <div class=\"b-note\">🎨 <strong>HKEAA 沉淀标准英文色号</strong>：<code>Cl⁻ ➔ AgCl(s)</code> <strong><code>white precipitate</code></strong> ｜ <code>Br⁻ ➔ AgBr(s)</code> <strong><code>creamy</code> (or <code>pale yellow</code>) <code>precipitate</code></strong> ｜ <code>I⁻ ➔ AgI(s)</code> <strong><code>yellow precipitate</code></strong>！</div>\n                ", "start": 71.258, "end": 148.166}, {"id": "b2_3", "tag": "板书 3 · 速率与键焓 (31.4B)", "title": "水解速率 R—I > R—Br > R—Cl 与 C—X Bond Enthalpy 决定机制", "html": "\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>卤代烷类别</th>\n                      <th>温水浴（含 <code>ethanol + AgNO₃(aq)</code>）出沉淀快慢</th>\n                      <th>微观决定因素：<code>C—X Bond Enthalpy</code>（键焓）</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong><code>Iodoalkane (R—I)</code></strong></td>\n                      <td><strong>最快（Fastest）</strong>：最先出现 <code>yellow ppt (AgI)</code></td>\n                      <td>碘原子半径最大，<code>C—I</code> 键最长、<strong><code>lowest bond enthalpy</code>（键焓最弱），最易断裂</strong>！</td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>Bromoalkane (R—Br)</code></strong></td>\n                      <td><strong>居中（Moderate）</strong>：次先出现 <code>creamy ppt (AgBr)</code></td>\n                      <td><code>C—Br</code> <code>bond enthalpy</code> 介于 <code>C—Cl</code> 与 <code>C—I</code> 之间。</td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>Chloroalkane (R—Cl)</code></strong></td>\n                      <td><strong>最慢（Slowest）</strong>：最晚出现 <code>white ppt (AgCl)</code></td>\n                      <td><code>C—Cl</code> 键最短、<strong><code>highest bond enthalpy</code>（键焓最强），最难扯断</strong>！</td>\n                    </tr>\n                  </tbody>\n                </table>\n                <div class=\"b-note\" style=\"margin-top:8px;\">🚨 <strong>两大零分归因雷区</strong>：① <code>Bond enthalpy</code> 打败了 <code>bond polarity</code>，<strong>严禁</strong>因 <code>Cl</code> 电负性最大就错判 <code>R—Cl</code> 最快；② <strong>严禁</strong>扯只决定沸点的 <em>van der Waals' forces</em>！（注：实验加 <code>ethanol</code> 作助溶剂使油水互溶公平竞赛。）</div>\n                ", "start": 148.786, "end": 225.318}], "turns": [{"speaker": "teacher", "role": "concept", "stepTag": "🎯 烃氧跳板 · 碱性水解与离子方程式消 Na⁺", "boardId": "b2_1", "displayHtml": "欢迎来到第 2 讲！<code>Haloalkanes (R—X)</code> 是从烃通往含氧家族的跳板。看<strong>第 1 张板书</strong>顶部：与 <strong><code>NaOH(aq)</code></strong> 进行 <strong><code>heating under reflux</code></strong>，<code>OH⁻</code> 顶替卤素生成 <code>alcohol</code> 与游离 <code>X⁻(aq)</code>，既属 <strong><code>substitution reaction</code></strong>，亦称 <strong><code>alkaline hydrolysis</code></strong>。写 <strong><code>ionic equation</code></strong> 时必消去旁观离子 <code>Na⁺</code>！", "start": 0.25, "end": 34.936}, {"speaker": "teacher", "role": "example", "stepTag": "📝 满分模板 · 拆词法拿满 Heat under Reflux 两分", "boardId": "b2_1", "displayHtml": "再看第 1 张板书下方必考 2 分题：<em>为何卤代烷与 <code>NaOH(aq)</code> 必须 <code>heat under reflux</code>？</em>用拆词法各拿 1 分：① 拆 <strong><code>heat</code></strong>——卤代烷与水 <code>immiscible</code> 且室温反应极慢，加热能<strong>加快反应速率（speeds up rate）</strong>；② 拆 <strong><code>under reflux</code></strong>——短链卤代烷沸点低、易挥发（<code>volatile</code>），竖装冷凝管将蒸气冷凝流回烧瓶防损失！", "start": 35.276, "end": 70.638}, {"speaker": "teacher", "role": "trap", "stepTag": "⚠️ 验卤铁律 · 为何加 AgNO₃ 前必加过量稀硝酸？", "boardId": "b2_2", "displayHtml": "切到<strong>第 2 张板书</strong>看检验卤代烷所含卤素的<strong>必考三步曲</strong>！纯 <code>R—X</code> 是共价分子，直接滴 <code>AgNO₃(aq)</code> 无沉淀。故 <strong>Step 1</strong> 先与 <code>NaOH(aq)</code> 回流断键并冷却；<strong>Step 2 生死采分步：必加 <code>excess dilute nitric acid, HNO₃(aq)</code> 酸化中和残余 <code>OH⁻</code></strong>，防止生成棕黑色 <code>Ag₂O(s)</code> 遮盖颜色——严禁用稀盐酸或稀硫酸替代！", "start": 71.258, "end": 113.06}, {"speaker": "teacher", "role": "concept", "stepTag": "🎨 三色沉淀 · 白、乳黄、黄色卤化银精准色号", "boardId": "b2_2", "displayHtml": "用 <code>excess dilute HNO₃(aq)</code> 清场后，<strong>Step 3</strong> 滴加 <strong><code>AgNO₃(aq)</code></strong>，背准考评局三个标准英文色号：<code>chloroalkane</code> 释放 <code>Cl⁻</code> 得 <code>AgCl</code> <strong><code>white precipitate</code></strong>；<code>bromoalkane</code> 释放 <code>Br⁻</code> 得 <code>AgBr</code> <strong><code>creamy</code>（或 <code>pale yellow</code>）<code>precipitate</code></strong>；<code>iodoalkane</code> 释放 <code>I⁻</code> 得 <code>AgI</code> <strong><code>yellow precipitate</code></strong>！漏写稀硝酸直接 0 分！", "start": 113.4, "end": 148.166}, {"speaker": "teacher", "role": "concept", "stepTag": "⏱️ 速率实测 · 乙醇助溶温水浴比拼出沉淀先后", "boardId": "b2_3", "displayHtml": "进入<strong>第 3 张板书</strong>比拼水解快慢！将链长相同的氯、溴、碘代丁烷分别溶入含 <strong><code>ethanol</code></strong> 与 <strong><code>AgNO₃(aq)</code></strong> 的混合液置于温水浴计时（<code>ethanol</code> 作共同溶剂使油水互溶）。实验结果：<strong>黄色 <code>AgI</code> 最先出沉淀，乳黄 <code>AgBr</code> 第二，白色 <code>AgCl</code> 最慢</strong>——即水解速率规律为 <strong><code>R—I &gt; R—Br &gt; R—Cl</code></strong>！", "start": 148.786, "end": 184.708}, {"speaker": "teacher", "role": "trap", "stepTag": "🚨 归因防坑 · Bond Enthalpy 碾压极性与范德华力", "boardId": "b2_3", "displayHtml": "为何电负性最小的碘代烷最快？盯紧第 3 张板书：水解瓶颈是扯断 <code>C—X</code> 键，由 <strong><code>bond enthalpy</code>（键焓）</strong>决定！碘半径最大，<code>C—I</code> 键最长、<strong><code>lowest bond enthalpy</code>（键焓最弱）</strong>，最易断裂！严禁按 <code>bond polarity</code> 反猜 <code>R—Cl</code> 最快，更严禁扯只管沸点的 <em>van der Waals' forces</em>！", "start": 185.048, "end": 225.318}], "quickChecks": [{"q": "1-Bromopropane 与 NaOH(aq) 回流加热（heated under reflux）并冷却后，应如何检验释放出的 Br⁻(aq)？", "options": ["A. 直接滴加 AgNO₃(aq)，观察白色沉淀", "B. 先加过量稀 HCl(aq) 酸化，再滴加 AgNO₃(aq)，观察乳黄色沉淀", "C. 先加过量稀 HNO₃(aq) 酸化，再滴加 AgNO₃(aq)，观察乳黄色沉淀（creamy precipitate）", "D. 先加浓 H₂SO₄ 酸化，再滴加 Br₂ 水溶液"], "ans": 2, "exp": "冷却后的碱性水解液含大量残余 OH⁻，直接滴加 AgNO₃(aq) 会生成棕黑色 Ag₂O 沉淀干扰；且不能用自带 Cl⁻ 的稀 HCl。必须先加 excess dilute HNO₃(aq) 中和 OH⁻，再加 AgNO₃(aq)，生成乳黄色（creamy / pale yellow）AgBr 沉淀。"}, {"q": "在相同条件下，1-iodobutane 的水解速率快于 1-chlorobutane，其正确微观原因是什么？", "options": ["A. 1-iodobutane 分子间 van der Waals' forces 更强", "B. C—I 键的键焓（bond enthalpy）低于 C—Cl 键，C—I 键更容易断裂", "C. 碘原子的电负性（electronegativity）高于氯原子，C—I 键极性更强", "D. 1-iodobutane 在水中的溶解度远大于 1-chlorobutane"], "ans": 1, "exp": "卤代烷水解需打断 C—X 共价键。碘原子半径大于氯原子，使 C—I 键键长更长、bond enthalpy（键焓）更低（键更弱），在水解过程中更易断裂，故 R—I 水解最快。"}], "duration": 225.77, "audioFile": "audio/02_31.4_卤代烷碱性水解与卤素离子检验.mp3", "fullStart": 220.72, "fullEnd": 446.49}, {"id": "ep3", "epNum": "第 3 讲", "code": "31.5 (上)", "fileSlug": "03_31.5A_醇与钠反应_卤代试剂与脱水成烯", "titleZh": "醇（Alcohols）与钠反应、氯代双雄 PCl₅ / SOCl₂ 分工与催化脱水陷阱", "titleEn": "Reactions of Alcohols with Sodium, Halogenating Reagents (HX, PX₃, PCl₅, SOCl₂) & Dehydration", "goal": "掌握无水醇与 Na 沉底放氢生成 sodium alkoxide、室温浓盐酸快检 3° 醇，厘清固体 PCl₅(s) 冒 steamy fumes 定性检 —OH 与 SOCl₂ 纯化合成的黄金分工，攻克仲醇脱水拆顺反出 3 种烯烃的压轴计数大坑。", "keyTerms": [{"en": "sodium alkoxide (RO⁻Na⁺)", "zh": "醇钠（无水醇 + Na）"}, {"en": "phosphorus pentachloride (PCl₅)", "zh": "五氯化磷（室温检无水 —OH）"}, {"en": "steamy fumes / white misty fumes", "zh": "白雾（HCl 遇水汽，禁写 smoke!）"}, {"en": "thionyl chloride (SOCl₂)", "zh": "氯化亚砜（副产物全气体易提纯）"}, {"en": "dehydration", "zh": "脱水反应（Al₂O₃ 或浓硫酸 180 °C）"}, {"en": "cis-trans isomers", "zh": "顺反异构体（butan-2-ol 出 3 烯）"}], "boards": [{"id": "b3_1", "tag": "板书 1 · 醇加钠与 HX/PX₃ (31.5A–B)", "title": "无水 Alcohols 与 Na(s) 沉底放氢 + 室温浓 HCl 快检 3° 醇及 PX₃ 计量", "html": "\n                <div class=\"b-box b-blue\" style=\"margin-bottom:10px;\">\n                  <div class=\"b-box-title\">① 无水 Alcohol + Sodium（室温平稳反应，系数必配 <code>2 : 2 ⟶ 2 : 1</code>！）</div>\n                  <div class=\"b-eq\">2 CH<sub>3</sub>CH<sub>2</sub>OH(l) + 2 Na(s) &nbsp;─────▶&nbsp; 2 CH<sub>3</sub>CH<sub>2</sub>O<sup>−</sup>Na<sup>+</sup>(alc) &nbsp;(<strong>sodium ethoxide</strong>) + H<sub>2</sub>(g)</div>\n                  <p class=\"b-tip-text\">现象：钠密度大于乙醇，<strong><code>sodium sinks to the bottom</code></strong>，平稳冒出 <strong><code>colourless gas bubbles</code></strong>（⚠️ 待测液必须 <strong><code>dry / anhydrous</code></strong>，否则水亦与钠放氢！）。</p>\n                </div>\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>卤代试剂与条件</th>\n                      <th>教材标准方程式与 DSE 实战秘笈</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong><code>Conc. HCl(aq)</code>，室温摇晃</strong></td>\n                      <td><code>(CH₃)₃COH(l) + HCl(aq) ⟶ (CH₃)₃CCl(l) + H₂O(l)</code><br>★ <strong>快检 <code>3° alcohol</code></strong>：几分钟内迅速变浑浊分层（<strong><code>turns cloudy rapidly</code></strong>）；<code>1° alcohol</code> 室温无变化！</td>\n                    </tr>\n                    <tr>\n                      <td><strong>原位制 <code>HBr / HI</code></strong></td>\n                      <td>制 <code>RBr</code> 用 <strong><code>NaBr + conc. H₂SO₄</code></strong> 回流；制 <code>RI</code> 必改用 <strong><code>red P + I₂</code></strong>（严禁用 <code>NaI + conc. H₂SO₄</code>，浓硫酸会将 <code>I⁻</code> 氧化为 <code>I₂</code>！）。</td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>PCl₃</code>，回流加热</strong></td>\n                      <td><code><strong>3</strong> R—OH + PCl₃ ⟶ <strong>3</strong> R—Cl + H₃PO₃</code>（<code>phosphorous acid</code>，盯紧 <strong><code>3 : 1</code></strong> 摩尔比！）。</td>\n                    </tr>\n                  </tbody>\n                </table>\n                ", "start": 0.25, "end": 72.516}, {"id": "b3_2", "tag": "板书 2 · 氯代双雄分工 (31.5B)", "title": "PCl₅(s) 室温白雾定性抓人 vs SOCl₂(l) 双气体副产物高纯合成", "html": "\n                <div class=\"board-grid-2\">\n                  <div class=\"b-box b-rose\">\n                    <div class=\"b-box-title\">③ 固体 <code>PCl₅(s)</code> —— 室温检无水 <code>—OH</code> 王牌测试！</div>\n                    <div class=\"b-eq\">ROH(l) + PCl<sub>5</sub>(s) &nbsp;──(r.t.)──▶&nbsp; RCl(l) + <strong>POCl<sub>3</sub>(l)</strong> + HCl(g)↑</div>\n                    <ul class=\"b-points\">\n                      <li><strong>满分现象词</strong>：立即冒白雾 <strong><code>steamy fumes</code></strong> 或 <strong><code>white misty fumes</code></strong>！</li>\n                      <li><strong>❌ 零分禁词</strong>：严禁写 <em>white smoke</em>（烟 = 固体微粒，直接 0 分！）。</li>\n                      <li><strong>前提与局限</strong>：液体须 <strong><code>dry / anhydrous</code></strong>（水亦产白雾）；副产物 <code>POCl₃(l)</code> 为液体，混溶难分离。</li>\n                    </ul>\n                  </div>\n                  <div class=\"b-box b-emerald\">\n                    <div class=\"b-box-title\">④ 液态 <code>SOCl₂(l)</code> —— 有机合成高纯度 <code>R—Cl</code> 首选！</div>\n                    <div class=\"b-eq\">ROH(l) + SOCl<sub>2</sub>(l) &nbsp;─────▶&nbsp; RCl(l) + <strong>SO<sub>2</sub>(g)↑</strong> + <strong>HCl(g)↑</strong></div>\n                    <ul class=\"b-points\">\n                      <li>英文名：<code>thionyl chloride</code>（或 <code>sulphur dichloride oxide</code>）。</li>\n                      <li><strong>★ 2M 合成满分答案</strong>：两个无机副产物 <strong><code>SO₂(g)</code> 与 <code>HCl(g)</code> 全是气体（both are gases）</strong>，自动逸出体系（escape from the mixture），极易得到高纯度 <code>R—Cl</code>！（须在 <code>fume cupboard</code> 操作）。</li>\n                    </ul>\n                  </div>\n                </div>\n                ", "start": 73.136, "end": 147.774}, {"id": "b3_3", "tag": "板书 3 · 催化脱水成烯 (31.5C)", "title": "Dehydration 两套标准条件与 Butan-2-ol“一醇出三烯”顺反计数杀手题", "html": "\n                <div class=\"b-quote\">\n                  <div class=\"b-quote-en\"><strong>Dehydration（脱水 / Elimination reaction）两套教材满分条件</strong>：① Heat with <strong><code>excess conc. H₂SO₄ at 180 °C</code></strong>；或 ② Pass alcohol vapour over <strong><code>heated Al₂O₃</code></strong>（或 <code>heated porous pot</code>，排水集气停火前<strong>必先撤导气管防倒吸 <code>sucking back</code></strong>！）。</div>\n                </div>\n                <div class=\"b-scheme\">\n<pre>【★ DSE 压轴计数大坑：Butan-2-ol 脱水生成几种 Alkenes？答案是 3 种（绝不是 2 种）！】\n                         ├── 脱 C-1 的 H ──▶ CH₂=CHCH₂CH₃       ① but-1-ene（末端 =CH₂ 无顺反）\n   CH₃—CH(OH)—CH₂—CH₃ ───┤\n      (butan-2-ol)       └── 脱 C-3 的 H ──▶ CH₃—CH=CH—CH₃  ──┬─▶ ② cis-but-2-ene   （双键两碳各连不同基团，\n                                            (内部双键必拆顺反!)└─▶ ③ trans-but-2-ene   合计 1 + 2 = 3 种！）</pre>\n                </div>\n                <div class=\"b-note\">⚠️ <strong>绝对不能脱水成烯的两类醇</strong>：① <code>methanol (CH₃OH)</code>（仅 1 颗碳）；② <code>2,2-dimethylpropan-1-ol, (CH₃)₃C—CH₂OH</code>（相邻 <code>C-2</code> 连满三个甲基，<strong>相邻碳上 <code>0</code> 颗 H</strong>！）。</div>\n                ", "start": 148.394, "end": 227.592}], "turns": [{"speaker": "teacher", "role": "concept", "stepTag": "🎯 中央枢纽 · 无水醇加金属钠沉底冒泡", "boardId": "b3_1", "displayHtml": "欢迎来到第 3 讲，进入中央枢纽 <strong><code>alcohols (R—OH)</code></strong>！看<strong>第 1 张板书</strong>顶部：将 <code>Na(s)</code> 投入无水 <code>ethanol</code>，因乙醇密度小于钠，<strong><code>sodium sinks to the bottom</code></strong>，平稳冒出 <strong><code>colourless gas bubbles (H₂)</code></strong> 并生成 <strong><code>sodium ethoxide (CH₃CH₂O⁻Na⁺)</code></strong>，系数必配 <code>2:2 ⟶ 2:1</code>，且样品须 <strong><code>dry / anhydrous</code></strong>！", "start": 0.25, "end": 36.366}, {"speaker": "teacher", "role": "example", "stepTag": "🧪 卤代前锋 · 室温浓盐酸快检叔醇与 PCl₃ 计量", "boardId": "b3_1", "displayHtml": "再看表格前两类卤代试剂：① 室温摇晃 <strong><code>conc. HCl(aq)</code></strong> 可快检 <code>3° alcohol</code>（<code>methylpropan-2-ol</code> 几分钟内迅速 <strong><code>turns cloudy rapidly</code></strong> 分层，<code>1° alcohol</code> 无变化）；制 <code>RBr</code> 用 <code>NaBr + conc. H₂SO₄</code>，制 <code>RI</code> 必换 <strong><code>red P + I₂</code></strong>（防浓硫酸氧化 <code>I⁻</code>）；② 用 <strong><code>PCl₃</code></strong> 盯紧 <strong><code>3 : 1</code></strong> 计量比生成 <code>H₃PO₃</code>！", "start": 36.706, "end": 72.516}, {"speaker": "teacher", "role": "trap", "stepTag": "🚨 氯代双雄 ① · 固体 PCl₅ 冒白雾禁写 White Smoke", "boardId": "b3_2", "displayHtml": "切到<strong>第 2 张板书</strong>左框看定性王牌 <strong><code>PCl₅(s)</code></strong>！往<strong>无水（<code>anhydrous</code>）</strong>未知液挑入固体 <code>PCl₅</code>，室温生成 <code>RCl + POCl₃(l) + HCl(g)</code>，立即涌出白雾。死记 HKEAA 现象词：必写 <strong><code>steamy fumes</code></strong> 或 <strong><code>white misty fumes</code></strong>，<strong>严禁写 <em>white smoke</em>（固体微粒，直接 0 分！）</strong>，须在 <code>fume cupboard</code> 操作！", "start": 73.136, "end": 109.332}, {"speaker": "teacher", "role": "concept", "stepTag": "🏆 氯代双雄 ② · SOCl₂ 双气体逸出高纯合成优势", "boardId": "b3_2", "displayHtml": "再看右框 2 分合成必答题：<em>制备纯液态 <code>chloroalkane</code> 为何首选 <strong><code>thionyl chloride (SOCl₂)</code></strong> 而非 <code>PCl₅</code>？</em>因 <code>ROH + SOCl₂ ⟶ RCl + SO₂(g) + HCl(g)</code> 的两个无机副产物 <strong><code>SO₂</code> 与 <code>HCl</code> 全是气体（both are gases）</strong>，自动逸出反应体系留下纯 <code>RCl</code>；而 <code>PCl₅</code> 生成液态 <code>POCl₃(l)</code> 混溶难分离！", "start": 109.672, "end": 147.774}, {"speaker": "teacher", "role": "concept", "stepTag": "🔥 脱水成烯 · 两套标准条件与不能脱水的醇", "boardId": "b3_3", "displayHtml": "进入<strong>第 3 张板书</strong>看醇消去水分子变烯烃的 <strong><code>dehydration</code></strong>！两套标准条件：① <strong><code>excess conc. H₂SO₄, 180 °C</code></strong>；② 醇蒸气通过强热的 <strong><code>heated Al₂O₃</code>（或 <code>porous pot</code>）</strong>，排水集气停火前必先撤导气管防 <strong><code>sucking back</code></strong>！注意 1 碳 <code>methanol</code> 与相邻碳无 H 的 <code>(CH₃)₃CCH₂OH</code> 绝不能脱水！", "start": 148.394, "end": 183.788}, {"speaker": "teacher", "role": "trap", "stepTag": "⚠️ 压轴大坑 · Butan-2-ol 脱水拆顺反共出 3 种烯烃", "boardId": "b3_3", "displayHtml": "紧盯中间框图的王牌计数大坑：<strong><code>butan-2-ol</code>（或 <code>pentan-2-ol</code>）脱水生成几种异构烯烃？答案是 <code>3</code> 种，绝非 2 种！</strong>向左脱 <code>C-1</code> 的 H 得末端双键 <code>but-1-ene</code>（无顺反，1 种）；向右脱 <code>C-3</code> 的 H 得内部双键 <code>CH₃CH=CHCH₃</code>，必拆成 <strong><code>cis-but-2-ene</code></strong> 与 <strong><code>trans-but-2-ene</code></strong>，合计 <code>1 + 2 = 3</code> 种！", "start": 184.128, "end": 227.592}], "quickChecks": [{"q": "能否使用固体五氯化磷 PCl₅(s) 来检验一瓶白葡萄酒水溶液（aqueous white wine）中是否含有乙醇（ethanol）？", "options": ["A. 可以，若冒出白色烟雾（white smoke）即证明含乙醇", "B. 可以，只有乙醇能与 PCl₅(s) 反应放出 HCl 白雾", "C. 不可以，因为白葡萄酒中的水（H₂O）也会与 PCl₅(s) 剧烈反应产生 HCl 白雾（steamy fumes）", "D. 不可以，因为乙醇与 PCl₅(s) 在室温下完全不反应"], "ans": 2, "exp": "PCl₅(s) 检验 —OH 要求待测样品必须无水干燥（dry / anhydrous）！白葡萄酒水溶液中含有大量 H₂O，水本身就会与 PCl₅(s) 剧烈反应产生 steamy fumes of HCl(g)，无法判断是否有乙醇。"}, {"q": "将 pentan-2-ol 蒸气通过强热的氧化铝（heated Al₂O₃）发生脱水反应（dehydration），最多可生成多少种烯烃异构体（包含立体异构体）？", "options": ["A. 1 种", "B. 2 种", "C. 3 种（pent-1-ene, cis-pent-2-ene, trans-pent-2-ene）", "D. 4 种"], "ans": 2, "exp": "脱去 C-1 的 H 生成末端烯烃 pent-1-ene（无顺反异构，1 种）；脱去 C-3 的 H 生成内部烯烃 pent-2-ene（CH₃CH=CHCH₂CH₃），其双键两碳各自连有两个不同基团，存在 cis-pent-2-ene 与 trans-pent-2-ene 一对顺反异构体，合计 1 + 2 = 3 种！"}], "duration": 228.04, "audioFile": "audio/03_31.5A_醇与钠反应_卤代试剂与脱水成烯.mp3", "fullStart": 447.99, "fullEnd": 676.03}, {"id": "ep4", "epNum": "第 4 讲", "code": "31.5 (下)", "fileSlug": "04_31.5B_伯仲叔醇可控氧化与回流蒸馏装置", "titleZh": "伯、仲、叔醇的可控氧化、回流 vs 蒸馏装置与 [O] 配平特训", "titleEn": "Controlled Oxidation of 1°, 2° & 3° Alcohols, Reflux vs Distillation & [O] Equations", "goal": "吃透 1° / 2° / 3° 醇在酸化重铬酸钾（orange to green）与酸化高锰酸钾下的氧化差异，掌握 Heating under reflux 与 Distillation 装置红线及 ethanal 低沸点无氢键 3 分论述，锁死 1° 醇变酸必写 + 2[O] 与 + H₂O 配平铁律。", "keyTerms": [{"en": "acidified K₂Cr₂O₇(aq)", "zh": "酸化重铬酸钾（橙变绿，可控）"}, {"en": "distillation", "zh": "蒸馏（及时蒸出低沸点 aldehyde）"}, {"en": "heating under reflux", "zh": "回流加热（彻底氧化至 carboxylic acid）"}, {"en": "intermolecular hydrogen bonds", "zh": "分子间氢键（醛无氢键故沸点最低）"}, {"en": "anti-bumping granules", "zh": "防暴沸颗粒（平稳沸腾）"}, {"en": "breathalyzer & souring of wine", "zh": "呼气酒精测试仪与酒变酸"}], "boards": [{"id": "b4_1", "tag": "板书 1 · 三级醇氧化图谱 (31.5D-1)", "title": "1° / 2° / 3° Alcohols 的氧化命运与 K₂Cr₂O₇ vs KMnO₄ 抉择红线", "html": "\n                <div class=\"b-quote\">\n                  <div class=\"b-quote-en\"><strong>两大强氧化剂抉择</strong>：① <strong><code>Acidified K₂Cr₂O₇(aq)</code></strong>（<code>Cr₂O₇²⁻/H⁺</code>）：反应后 <strong><code>from orange to green</code></strong>，温和可控，<strong>制备 <code>aldehyde</code> 唯一首选</strong>！② <strong><code>Acidified KMnO₄(aq)</code></strong>（<code>MnO₄⁻/H⁺</code>）：<code>from purple to colourless</code>，氧化性极猛，遇 <code>1° alcohol</code> <strong>直接轰到底变 <code>carboxylic acid</code>，严禁用于制备 <code>aldehyde</code></strong>！</div>\n                </div>\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>醇的级别与代表物</th>\n                      <th>试剂与装置控制（配 <code>Cr₂O₇²⁻(aq)/H⁺(aq)</code>）</th>\n                      <th>有机产物与现象</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong><code>1° alcohol</code>（部分氧化）</strong><br><code>ethanol</code></td>\n                      <td><strong><code>Excess alcohol</code></strong> + <strong><code>Distillation</code></strong>（边反应边蒸出）</td>\n                      <td><strong><code>Aldehyde</code></strong> (<code>ethanal, b.p. 20.2 °C</code>)；<code>orange to green</code></td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>1° alcohol</code>（完全氧化）</strong><br><code>ethanol</code></td>\n                      <td><strong><code>Excess Cr₂O₇²⁻/H⁺</code></strong> + <strong><code>Heating under reflux</code></strong></td>\n                      <td><strong><code>Carboxylic acid</code></strong> (<code>ethanoic acid, b.p. 118 °C</code>)；<code>orange to green</code></td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>2° alcohol</code></strong> (<code>propan-2-ol</code>)</td>\n                      <td><code>Cr₂O₇²⁻/H⁺</code> + <code>Heating under reflux</code></td>\n                      <td><strong><code>Ketone</code></strong> (<code>propanone</code>，无法再氧化！)；<code>orange to green</code></td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>3° alcohol</code></strong> (<code>(CH₃)₃COH</code>)</td>\n                      <td><code>Cr₂O₇²⁻/H⁺</code>，共热</td>\n                      <td><strong>❌ <code>No reaction</code></strong>（溶液 <strong><code>remains orange</code></strong>；因 <code>C—OH</code> 碳上<strong>无直接相连的 H</strong>！）</td>\n                    </tr>\n                  </tbody>\n                </table>\n                ", "start": 0.25, "end": 70.446}, {"id": "b4_2", "tag": "板书 2 · 回流 vs 蒸馏双装置 (31.5D-2)", "title": "Heating under Reflux vs Distillation 装置红线与氢键沸点 3M 满分模板", "html": "<svg class=\"board-svg\" viewBox=\"0 0 780 235\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"回流加热 Heating under reflux 与蒸馏 Distillation pacity=\"0.75\"/>\n  <!-- Anti-bumping granules -->\n  <circle cx=\"80\" cy=\"191\" r=\"2\" fill=\"#475569\"/>\n  <circle cx=\"87\" cy=\"192\" r=\"2\" fill=\"#475569\"/>\n  <circle cx=\"93\" cy=\"190\" r=\"2\" fill=\"#475569\"/>\n  <text x=\"86\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"800\" fill=\"#ea580c\">▲ Heat (持续加热)</text>\n\n  <!-- Left panel notes -->\n  <rect x=\"206\" y=\"50\" width=\"162\" height=\"160\" rx=\"8\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"216\" y=\"70\" font-size=\"11.5\" font-weight=\"800\" fill=\"#0f172a\">试剂与控制要点：</text>\n  <text x=\"216\" y=\"89\" font-size=\"11\" font-weight=\"700\" fill=\"#0369a1\">• Excess Cr₂O₇²⁻(aq)/H⁺(aq)</text>\n  <text x=\"216\" y=\"107\" font-size=\"11\" fill=\"#334155\">• 蒸气冷凝流回烧瓶彻底氧化</text>\n  <text x=\"216\" y=\"125\" font-size=\"11\" fill=\"#334155\">• 烧瓶底加防暴沸颗粒</text>\n  <text x=\"224\" y=\"140\" font-size=\"10.5\" font-weight=\"700\" fill=\"#475569\">(anti-bumping granules)</text>\n  <text x=\"216\" y=\"160\" font-size=\"11\" font-weight=\"800\" fill=\"#059669\">• 现象：orange ➔ green</text>\n  <text x=\"216\" y=\"179\" font-size=\"11\" font-weight=\"800\" fill=\"#be123c\">• 产物：ethanoic acid</text>\n  <text x=\"224\" y=\"195\" font-size=\"10.5\" fill=\"#64748b\">(b.p. 118 °C，强氢键)</text>\n\n  <!-- Right Panel: Distillation -->\n  <rect x=\"398\" y=\"12\" width=\"368\" height=\"211\" rx=\"10\" fill=\"#ffffff\" stroke=\"#5eead4\" stroke-width=\"1.5\"/>\n  <rect x=\"398\" y=\"12\" width=\"368\" height=\"28\" rx=\"10\" fill=\"#ccfbf1\"/>\n  <text x=\"582\" y=\"31\" text-anchor=\"middle\" font-size=\"12.8\" font-weight=\"800\" fill=\"#0f766e\">② Distillation（边反应边蒸馏 ➔ Aldehyde）</text>\n\n  <!-- Thermometer at side-arm level -->\n  <line x1=\"452\" y1=\"48\" x2=\"452\" y2=\"96\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n  <circle cx=\"452\" cy=\"98\" r=\"3.5\" fill=\"#dc2626\"/>\n  <text x=\"516\" y=\"57\" font-size=\"10.2\" font-weight=\"800\" fill=\"#dc2626\">◀ Thermometer bulb at side-arm</text>\n  <!-- Still head vertical neck -->\n  <line x1=\"446\" y1=\"68\" x2=\"446\" y2=\"152\" stroke=\"#334155\" stroke-width=\"1.8\"/>\n  <line x1=\"458\" y1=\"68\" x2=\"458\" y2=\"152\" stroke=\"#334155\" stroke-width=\"1.8\"/>\n  <line x1=\"445\" y1=\"68\" x2=\"459\" y2=\"68\" stroke=\"#334155\" stroke-width=\"2.2\"/>\n  <!-- Reaction flask -->\n  <circle cx=\"452\" cy=\"174\" r=\"23\" fill=\"#ffedd5\" stroke=\"#334155\" stroke-width=\"1.8\"/>\n  <circle cx=\"448\" cy=\"190\" r=\"2\" fill=\"#475569\"/>\n  <circle cx=\"456\" cy=\"190\" r=\"2\" fill=\"#475569\"/>\n  <text x=\"452\" y=\"214\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"800\" fill=\"#ea580c\">▲ Heat (&gt;20.2 °C, &lt;78 °C)</text>\n\n  <!-- Tilted side-arm & condenser -->\n  <line x1=\"458\" y1=\"96\" x2=\"562\" y2=\"148\" stroke=\"#334155\" stroke-width=\"3\"/>\n  <polygon points=\"480,100 544,132 536,146 472,114\" fill=\"#dbeafe\" stroke=\"#0284c7\" stroke-width=\"1.3\"/>\n  <text x=\"488\" y=\"95\" font-size=\"9.8\" font-weight=\"700\" fill=\"#0369a1\">Water out ↑</text>\n  <text x=\"516\" y=\"159\" font-size=\"9.8\" font-weight=\"700\" fill=\"#0369a1\">↑ Water in</text>\n\n  <!-- Receiver in ice-water bath -->\n  <rect x=\"552\" y=\"162\" width=\"44\" height=\"34\" rx=\"5\" fill=\"#dbeafe\" stroke=\"#3b82f6\" stroke-width=\"1.4\"/>\n  <rect x=\"563\" y=\"148\" width=\"22\" height=\"40\" rx=\"4\" fill=\"#ffffff\" stroke=\"#334155\" stroke-width=\"1.5\"/>\n  <text x=\"574\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1d4ed8\">Ice-water bath</text>\n\n  <!-- Right panel notes -->\n  <rect x=\"608\" y=\"64\" width=\"146\" height=\"146\" rx=\"8\" fill=\"#f0fdfa\" stroke=\"#99f6e4\"/>\n  <text x=\"616\" y=\"83\" font-size=\"11\" font-weight=\"800\" fill=\"#0f766e\">为何蒸出 Ethanal？</text>\n  <text x=\"616\" y=\"101\" font-size=\"10.6\" font-weight=\"700\" fill=\"#0f172a\">• Excess 1° alcohol</text>\n  <text x=\"616\" y=\"119\" font-size=\"10.6\" fill=\"#334155\">• CH₃CHO 无 —OH 基团</text>\n  <text x=\"616\" y=\"136\" font-size=\"10.5\" font-weight=\"700\" fill=\"#be123c\">• 无分子间氢键！</text>\n  <text x=\"616\" y=\"153\" font-size=\"10.5\" fill=\"#334155\">• 仅弱 van der Waals'</text>\n  <text x=\"616\" y=\"171\" font-size=\"10.6\" font-weight=\"800\" fill=\"#0369a1\">• b.p. 最低 (20.2 °C)</text>\n  <text x=\"616\" y=\"189\" font-size=\"10.5\" font-weight=\"700\" fill=\"#059669\">• 一生成即蒸离防再氧化</text>\n</svg>\n                <div class=\"b-note\" style=\"margin-top:8px;\">📝 <strong>HKEAA 3M 满分链条</strong>：[1M] <code>Ethanal</code> 无 <code>—OH</code>，仅靠弱 <strong><code>van der Waals' forces</code></strong>（不能形成 <strong><code>intermolecular hydrogen bonds</code></strong>），而 <code>ethanol (78 °C)</code> 与 <code>ethanoic acid (118 °C)</code> 均具强分子间氢键 ➔ [1M] 故 <code>ethanal (20.2 °C)</code> <strong><code>boiling point</code> 最低</strong> ➔ [1M] 在 <code>distillation</code> 中一生成即刻气化蒸离氧化液（distils off immediately），防止进一步氧化！</div>\n                ", "start": 71.066, "end": 149.1}, {"id": "b4_3", "tag": "板书 3 · [O] 配平与生活应用 (31.5D-3)", "title": "[O] 氧化方程式防漏特训（必写 2[O] 与 + H₂O！）及 Breathalyzer / 酒变酸", "html": "\n                <div class=\"b-scheme\">\n<pre>【为什么 1° Alcohol 完全氧化成酸必须写 + 2[O] 与 + H₂O ？（两步相加原子守恒！）】\n  Step 1 (拔 2H 造水) : CH₃CH₂OH(l) +  [O] ─────▶ CH₃CHO(g)    + H₂O(l)    [1° 醇 ➔ 醛：别漏 + H₂O！]\n  Step 2 (插 1O 成酸) : CH₃CHO(g)   +  [O] ─────▶ CH₃COOH(aq)\n ──────────────────────────────────────────────────────────────────────────\n  总方程式 (完全氧化!) : CH₃CH₂OH(l) + 2[O] ─────▶ CH₃COOH(aq)  + H₂O(l)    [核对：左 6H,3O = 右 6H,3O！]\n  仲醇氧化成酮        : CH₃CH(OH)CH₃(l) + [O] ──▶ CH₃COCH₃(aq) + H₂O(l)    [2° 醇 ➔ 酮：耗 1[O] 生 H₂O！]</pre>\n                </div>\n                <div class=\"board-grid-2\">\n                  <div class=\"b-box b-amber\">\n                    <div class=\"b-box-title\">① 化学式 <code>Breathalyzer</code>（呼气酒精测试仪）</div>\n                    <p class=\"b-tip-text\">检测管硅胶浸有橙色 <strong><code>acidified K₂Cr₂O₇</code></strong>；酒驾司机呼出的 <code>ethanol</code> 蒸气将其还原，颜色 <strong><code>turns from orange to green</code></strong>。</p>\n                  </div>\n                  <div class=\"b-box b-teal\">\n                    <div class=\"b-box-title\">② <code>Souring of wine</code>（葡萄酒敞口变酸）</div>\n                    <p class=\"b-tip-text\">酒暴露于空气（<code>air</code>）中，空气里的 <strong><code>microbes / bacteria</code>（微生物/细菌）</strong>催化氧气 <code>O₂</code> 将 <code>ethanol</code> 氧化为带酸味的 <strong><code>ethanoic acid</code></strong>。</p>\n                  </div>\n                </div>\n                ", "start": 149.72, "end": 226.198}], "turns": [{"speaker": "teacher", "role": "concept", "stepTag": "🎯 氧化双雄 · 重铬酸钾橙变绿 vs 高锰酸钾禁制醛", "boardId": "b4_1", "displayHtml": "欢迎来到第 4 讲，攻克全章头号高频点——<strong><code>oxidation of alcohols</code></strong>！看<strong>第 1 张板书</strong>顶部：橙色 <strong><code>acidified K₂Cr₂O₇(aq)</code></strong> 反应后 <strong><code>from orange to green</code></strong>，温和可控，是制 <code>aldehyde</code> 的唯一首选；而紫色 <strong><code>acidified KMnO₄(aq)</code></strong> 氧化性极猛，遇 <code>1° alcohol</code> 直接轰到底变 <code>carboxylic acid</code>，<strong>严禁用于制醛</strong>！", "start": 0.25, "end": 35.714}, {"speaker": "teacher", "role": "concept", "stepTag": "🧭 三级命运 · 1° 两段跳、2° 止步酮、3° 拒不氧化", "boardId": "b4_1", "displayHtml": "再看表格对比三级醇：<strong><code>1° alcohol</code></strong> 走两段跳——用 <strong><code>excess alcohol + distillation</code></strong> 停在 <code>aldehyde</code>，用 <strong><code>excess Cr₂O₇²⁻/H⁺ + heating under reflux</code></strong> 冲顶得 <code>carboxylic acid</code>；<strong><code>2° alcohol</code></strong> 回流得 <strong><code>ketone</code></strong>（<code>orange to green</code>）即封顶；唯独 <strong><code>3° alcohol</code></strong> 连 <code>—OH</code> 的碳上无 H，不反应且 <strong><code>remains orange</code></strong>！", "start": 36.054, "end": 70.446}, {"speaker": "teacher", "role": "example", "stepTag": "🔬 装置图解 · 回流敞口下进上出 vs 蒸馏支管口控温", "boardId": "b4_2", "displayHtml": "切换到<strong>第 2 张板书</strong>双装置图！左图 <strong><code>heating under reflux</code></strong> 死守三条安全线：① 冷凝管<strong>顶端严禁加塞（Top OPEN 防气压爆炸）</strong>；② 冷却水<strong>下进上出</strong>灌满水夹套；③ 烧瓶底加 <strong><code>anti-bumping granules</code></strong>。右图 <strong><code>distillation</code></strong> 温度计水银球对齐<strong>支管口（side-arm level）</strong>，接收瓶浸 <code>ice-water bath</code> 收集 <code>ethanal</code>！", "start": 71.066, "end": 112.896}, {"speaker": "teacher", "role": "trap", "stepTag": "📝 氢键论述 · 3 分答满为何蒸馏能分离出 Ethanal", "boardId": "b4_2", "displayHtml": "背熟底部 <strong>3 分分子间作用力模板</strong>：[1M] <code>Ethanal (CH₃CHO)</code> 无 <code>—OH</code>，仅靠弱 <strong><code>van der Waals' forces</code></strong>（无 <strong><code>intermolecular hydrogen bonds</code></strong>），而 <code>ethanol (78 °C)</code> 与 <code>ethanoic acid (118 °C)</code> 具强氢键；[1M] 故 <code>ethanal</code> <strong><code>boiling point</code> 最低（<code>20.2 °C</code>）</strong>；[1M] 蒸馏时一生成即刻蒸离氧化液防再氧化！", "start": 113.236, "end": 149.1}, {"speaker": "teacher", "role": "trap", "stepTag": "⚠️ 配平重灾 · 伯醇变酸必写 + 2[O] 与 + H₂O！", "boardId": "b4_3", "displayHtml": "切到<strong>第 3 张板书</strong>消灭头号配平重灾区！千万别把乙醇变乙酸错写成 <em><code>CH₃CH₂OH + [O] ⟶ CH₃COOH</code></em>（氢原子根本不守恒，直接判 0 分！）。看两步相加：第 1 颗 <code>[O]</code> 拔 2H 造 <code>H₂O</code> 得乙醛，第 2 颗 <code>[O]</code> 插氧变乙酸——完全氧化<strong>左边必写 <code>+ 2[O]</code>，右边必写 <code>+ H₂O</code></strong>，写完必核对原子总数！", "start": 149.72, "end": 192.35}, {"speaker": "teacher", "role": "summary", "stepTag": "🌍 生活化学 · Breathalyzer 查酒驾与葡萄酒敞口变酸", "boardId": "b4_3", "displayHtml": "收下底部两大生活考点：① 查酒驾的化学式 <strong><code>breathalyzer</code></strong> 内含橙色 <code>acidified K₂Cr₂O₇</code>，遇呼出的 <code>ethanol</code> 蒸气即 <strong><code>turns from orange to green</code></strong>；② 红酒敞口变酸（<strong><code>souring of wine</code></strong>）是空气中的 <strong><code>microbes / bacteria</code></strong> 催化空气中 <code>O₂</code> 将 <code>ethanol</code> 氧化为 <strong><code>ethanoic acid</code></strong>！", "start": 192.69, "end": 226.198}], "quickChecks": [{"q": "将 propan-1-ol 完全氧化为 propanoic acid 的正确化学方程式（以 [O] 代表来自氧化剂的氧）是哪一条？", "options": ["A. CH₃CH₂CH₂OH + [O] ⟶ CH₃CH₂COOH", "B. CH₃CH₂CH₂OH + [O] ⟶ CH₃CH₂COOH + H₂", "C. CH₃CH₂CH₂OH + 2[O] ⟶ CH₃CH₂COOH + H₂O", "D. CH₃CH₂CH₂OH + 3[O] ⟶ CH₃CH₂COOH + 2H₂O"], "ans": 2, "exp": "伯醇完全氧化为羧酸经历两步：第一步拔 2H 与 1 个 [O] 生成醛和 H₂O，第二步醛再加 1 个 [O] 生成羧酸。总方程式必须配 2[O] 且右边写出副产物 + H₂O（左 8H, 3O = 右 8H, 3O）。"}, {"q": "为什么实验室制备 ethanal 时，不能用酸化高锰酸钾溶液（acidified KMnO₄(aq)）代替酸化重铬酸钾溶液，即使采用蒸馏（distillation）装置也不行？", "options": ["A. 酸化 KMnO₄(aq) 完全不能与乙醇发生反应", "B. 酸化 KMnO₄(aq) 氧化性极强（very strong oxidizing agent），会将乙醇迅速直接氧化到底生成乙酸（ethanoic acid），无法停留在醛阶段", "C. 酸化 KMnO₄(aq) 只会将乙醇脱水变成乙烯", "D. 酸化 KMnO₄(aq) 没有颜色变化"], "ans": 1, "exp": "Acidified KMnO₄(aq) 是氧化性极猛烈的强氧化剂，遇到伯醇（1° alcohol）会迅速一路氧化到底生成羧酸（carboxylic acid），无法通过控制条件停留在 aldehyde 阶段；制备醛只能选用较温和可控的 acidified K₂Cr₂O₇(aq)。"}], "duration": 226.65, "audioFile": "audio/04_31.5B_伯仲叔醇可控氧化与回流蒸馏装置.mp3", "fullStart": 677.53, "fullEnd": 904.18}, {"id": "ep5", "epNum": "第 5 讲", "code": "31.6 – 31.7", "fileSlug": "05_31.6-31.7_醛酮选择性还原与羧酸四大反应", "titleZh": "醛酮鉴别、NaBH₄ vs LiAlH₄ 选择性还原与羧酸四大反应", "titleEn": "Aldehydes & Ketones, Selective Reduction (NaBH₄ vs LiAlH₄) & Reactions of Carboxylic Acids", "goal": "掌握用温热酸化重铬酸钾鉴别醛酮，练熟温和 NaBH₄(aq) 与分两步书写的 1. LiAlH₄, dry ether / 2. H⁺(aq) 多官能团选择性还原手术，拿下羧酸的 NaHCO₃ 专属鉴别、可逆酯化（⇌）及经酰氯两步制酰胺路线。", "keyTerms": [{"en": "NaBH₄(aq)", "zh": "硼氢化钠水溶液（温和，仅还原醛/酮）"}, {"en": "1. LiAlH₄, dry ether / 2. H⁺(aq)", "zh": "氢化铝锂（极恐水，必分两步写！）"}, {"en": "NaHCO₃(aq)", "zh": "碳酸氢钠溶液（专属检 —COOH 冒 CO₂）"}, {"en": "esterification (⇌)", "zh": "酯化反应（可逆！浓硫酸催化+脱水）"}, {"en": "acyl chloride (RCOCl)", "zh": "酰氯（活泼中间体，遇 NH₃ 制酰胺）"}, {"en": "ammonium carboxylate", "zh": "羧酸铵盐（酸直接加氨的室温陷阱）"}], "boards": [{"id": "b5_1", "tag": "板书 1 · 醛酮鉴别与选择性还原 (31.6)", "title": "Aldehyde vs Ketone 鉴别及还原双雄 NaBH₄(aq) vs LiAlH₄ 选择性矩阵", "html": "\n                <div class=\"b-quote\">\n                  <div class=\"b-quote-en\"><strong>HKDSE 鉴别 Aldehyde 与 Ketone 首选</strong>：与 <strong><code>acidified K₂Cr₂O₇(aq)</code></strong> 共热（warm）—— <code>Aldehyde</code> 被氧化为酸，溶液 <strong><code>turns from orange to green</code></strong>；<code>Ketone</code> 不反应，<strong><code>remains orange</code></strong>！</div>\n                </div>\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>还原试剂（必背书写格式！）</th>\n                      <th>耐水性</th>\n                      <th><code>Aldehyde / Ketone</code></th>\n                      <th><code>—COOH / —COOR'</code></th>\n                      <th>非极性 <code>C=C</code></th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong>① 温和绵羊：<code>NaBH₄(aq)</code></strong></td>\n                      <td>可在水中进行</td>\n                      <td><strong>✅ 还原为 <code>1° / 2° 醇</code></strong></td>\n                      <td><strong>❌ 不反应！</strong></td>\n                      <td><strong>❌ 不反应！</strong></td>\n                    </tr>\n                    <tr>\n                      <td><strong>② 恐水霸王龙（必标 1, 2 分步！）：</strong><br><code>1. LiAlH₄, dry ether</code> &nbsp; <code>2. H⁺(aq)</code></td>\n                      <td><strong>极恐水！</strong>混写一步直接 0 分！</td>\n                      <td><strong>✅ 还原为 <code>1° / 2° 醇</code></strong></td>\n                      <td><strong>✅ 全部还原成醇！</strong></td>\n                      <td><strong>❌ 绝不碰 <code>C=C</code>！</strong><br><em>(C=C 只认 H₂/Pt)</em></td>\n                    </tr>\n                  </tbody>\n                </table>\n                <div class=\"b-note\" style=\"margin-top:7px;\">🔬 <strong>双官能团秒杀例</strong>：<code>OHC—CH₂—COOCH₃</code> 加 <code>NaBH₄(aq)</code> 得 <code>HOCH₂CH₂COOCH₃</code>（留酯基）；加 <code>1. LiAlH₄, dry ether / 2. H⁺(aq)</code> 酯键亦断，得 <code>HOCH₂CH₂CH₂OH + CH₃OH</code>！</div>\n                ", "start": 0.25, "end": 80.702}, {"id": "b5_2", "tag": "板书 2 · 羧酸鉴别与可逆酯化 (31.7A–B)", "title": "Carboxylic Acids 专属鉴别 NaHCO₃(aq) 与可逆 Esterification（⇌）全考点", "html": "\n                <div class=\"board-grid-2\">\n                  <div class=\"b-box b-blue\">\n                    <div class=\"b-box-title\">① 弱酸性与专属鉴别（禁选 <code>Na</code> 或 <code>PCl₅</code> 区分醇酸！）</div>\n                    <div class=\"b-eq\">RCOOH(aq) + NaHCO<sub>3</sub>(aq) &nbsp;⟶&nbsp; RCOO<sup>−</sup>Na<sup>+</sup>(aq) + H<sub>2</sub>O(l) + CO<sub>2</sub>(g)↑</div>\n                    <ul class=\"b-points\">\n                      <li>无水 <code>alcohol</code> 与 <code>carboxylic acid</code> 遇 <code>Na(s)</code> 均冒 <code>H₂</code>，遇 <code>PCl₅(s)</code> 均冒 <code>steamy fumes</code>！</li>\n                      <li><strong>唯一一招区分</strong>：加 <strong><code>NaHCO₃(aq)</code></strong>（或 <code>Na₂CO₃(aq)</code>），仅 <code>—COOH</code> 冒 <strong><code>colourless gas bubbles</code> (<code>effervescence</code>)</strong>！</li>\n                    </ul>\n                  </div>\n                  <div class=\"b-box b-amber\">\n                    <div class=\"b-box-title\">② 可逆 <code>Esterification</code>（必画 <code>⇌</code> 及 <code>+ H₂O</code>！）</div>\n                    <div class=\"b-eq\">CH<sub>3</sub>CH<sub>2</sub>COOH + CH<sub>3</sub>OH &nbsp;⇌&nbsp; CH<sub>3</sub>CH<sub>2</sub>COOCH<sub>3</sub> + H<sub>2</sub>O &nbsp;<em>(conc. H₂SO₄, reflux)</em></div>\n                    <ul class=\"b-points\">\n                      <li><strong><code>Conc. H₂SO₄</code> 双重角色 [2M]</strong>：① <strong><code>catalyst</code></strong> 加速反应；② <strong><code>dehydrating agent</code></strong> 吸水使平衡右移提高产率！</li>\n                      <li><strong>倒入 <code>Na₂CO₃(aq)</code> 三现象</strong>：<code>sweet fruity smell</code> + 浮出 <code>insoluble colourless oily layer</code> + <code>gas bubbles</code>（中和残酸并降低酯溶解度）。</li>\n                    </ul>\n                  </div>\n                </div>\n                ", "start": 81.322, "end": 156.56}, {"id": "b5_3", "tag": "板书 3 · 强还原与两步制酰胺 (31.7C–D)", "title": "RCOOH + 4[H] 强还原与转化为 Unsubstituted Amide 黄金两步法", "html": "\n                <div class=\"b-scheme\">\n<pre>【1. 羧酸强力还原退回 1° 醇 —— 必耗 4[H] 且生成 + H₂O！（严禁用 NaBH₄！）】\n   R — COOH   +   4[H]   ──( 1. LiAlH₄, dry ether / 2. H⁺(aq) )──▶   R — CH₂OH   +   H₂O\n\n【2. 羧酸转化为未取代酰胺 Unsubstituted Amide (RCONH₂) —— 黄金两步法 vs 室温死胡同！】\n   ✅ 教材高产率两步路线：\n      R — COOH  ──( Step 1: SOCl₂ or PCl₅ )──▶  R — COCl  ──( Step 2: excess NH₃ )──▶  R — CONH₂\n                                            (acyl chloride 极活泼酰氯，如 ethanoyl chloride CH₃COCl)\n\n   ❌ 考场头号合成陷阱（室温直接加氨水）：\n      R — COOH  +  NH₃(aq)  ──(room temp.)──▶  R — COO⁻NH₄⁺(aq)  (只发生酸碱中和生成离子盐 ammonium carboxylate！)</pre>\n                </div>\n                ", "start": 157.18, "end": 239.556}], "turns": [{"speaker": "teacher", "role": "concept", "stepTag": "🎯 醛酮对决 · 重铬酸钾鉴别与还原两兄弟", "boardId": "b5_1", "displayHtml": "欢迎来到第 5 讲！区分 <code>aldehyde</code> 与 <code>ketone</code> 直接共热 <strong><code>acidified K₂Cr₂O₇(aq)</code></strong>：醛变酸使溶液 <strong><code>orange to green</code></strong>，酮不反应 <strong><code>remains orange</code></strong>！加 <code>2[H]</code> 退回醇叫 <strong><code>reduction</code></strong>：温和的 <strong><code>NaBH₄(aq)</code></strong> 可在水中只还原醛酮；狂暴的 <strong><code>LiAlH₄</code></strong> 极恐水，通杀醛、酮、酸、酯！", "start": 0.25, "end": 35.1}, {"speaker": "teacher", "role": "trap", "stepTag": "🔬 外科手术 · 多官能团选择性还原与混写零分线", "boardId": "b5_1", "displayHtml": "牢记阅卷零分线：用 <code>LiAlH₄</code> 必须标序号分两步写 <strong><code>1. LiAlH₄, dry ether</code></strong>、<strong><code>2. H⁺(aq)</code></strong>，混写一行直接判 0 分！看双官能团 <code>OHC—CH₂—COOCH₃</code>：加 <code>NaBH₄(aq)</code> 只还原醛基留酯基；加两步 <code>LiAlH₄</code> 则醛与酯全变醇！注意两兄弟都<strong>绝不碰非极性 <code>C=C</code></strong>（双键只认 <code>H₂/Pt</code>）！", "start": 35.44, "end": 80.702}, {"speaker": "teacher", "role": "trap", "stepTag": "⚠️ 羧酸鉴别 · 千万别用 Na 或 PCl₅ 区分无水醇酸！", "boardId": "b5_2", "displayHtml": "切到<strong>第 2 张板书</strong>左框看弱酸 <strong><code>carboxylic acids</code></strong>！高频陷阱：区分无水 <code>propan-1-ol</code> 与 <code>propanoic acid</code> <strong>严禁选 <code>Na(s)</code> 或 <code>PCl₅(s)</code></strong>，因 <code>—COOH</code> 也含 <code>—OH</code>，两者都会冒 <code>H₂</code> 或 <code>steamy fumes</code>！唯一专属绝招是加 <strong><code>NaHCO₃(aq)</code></strong>，仅酸冒 <strong><code>colourless gas bubbles (CO₂)</code></strong>！", "start": 81.322, "end": 121.296}, {"speaker": "teacher", "role": "concept", "stepTag": "🌸 可逆酯化 · 浓硫酸双角色与倒入碳酸钠三现象", "boardId": "b5_2", "displayHtml": "看右框 <strong><code>esterification</code></strong>：箭头必画可逆号 <strong><code>⇌</code></strong> 且写 <code>+ H₂O</code>（丙酸加甲醇得 <code>methyl propanoate</code>）。<code>conc. H₂SO₄</code> 具双重角色：① <strong><code>catalyst</code></strong> 加速；② <strong><code>dehydrating agent</code></strong> 吸水使平衡右移增产！倒入 <code>Na₂CO₃(aq)</code> 见三现象：<code>sweet fruity smell</code>、浮出 <code>colourless oily layer</code> 及 <code>gas bubbles</code>！", "start": 121.636, "end": 156.56}, {"speaker": "teacher", "role": "concept", "stepTag": "⚡ 强力倒车 · 羧酸加 4[H] 强还原退回伯醇", "boardId": "b5_3", "displayHtml": "进入<strong>第 3 张板书</strong>上半部分：将 <code>R—COOH</code> 还原回 <code>1° alcohol</code> 绝不能用 <code>NaBH₄(aq)</code>，只能用分两步写的 <strong><code>1. LiAlH₄, dry ether / 2. H⁺(aq)</code></strong>！配平注意脱去 1 颗氧成水并补 2 颗氢到碳上，左边<strong>必写 <code>+ 4[H]</code>，右边必写 <code>+ H₂O</code></strong>（<code>RCOOH + 4[H] ⟶ RCH₂OH + H₂O</code>）！", "start": 157.18, "end": 197.284}, {"speaker": "teacher", "role": "trap", "stepTag": "🏆 黄金两步 · 经酰氯 SOCl₂ ➔ RCOCl ➔ NH₃ 制酰胺", "boardId": "b5_3", "displayHtml": "再看下半部分合成压轴陷阱：把 <code>RCOOH</code> 转化为 <strong><code>unsubstituted amide (RCONH₂)</code></strong>，<strong>严禁室温直接加 <code>NH₃(aq)</code></strong>（只发生中和生成离子盐 <strong><code>ammonium carboxylate, RCOO⁻NH₄⁺</code></strong>）！必走黄金两步法：<strong>Step 1</strong> 加 <strong><code>SOCl₂</code></strong> 得活泼酰氯 <strong><code>RCOCl</code></strong>，<strong>Step 2</strong> 加过量 <strong><code>NH₃</code></strong> 即得酰胺！", "start": 197.624, "end": 239.556}], "quickChecks": [{"q": "化合物 K 的结构为 OHC—CH₂—CH₂—COOCH₃。当 K 与足量 NaBH₄(aq) 完全反应时，所得有机产物的结构简式是什么？", "options": ["A. HOCH₂CH₂CH₂CH₂OH 与 CH₃OH", "B. HOCH₂CH₂CH₂COOCH₃", "C. HOOCCH₂CH₂COOCH₃", "D. OHCCH₂CH₂CH₂OH"], "ans": 1, "exp": "NaBH₄(aq) 是温和的选择性还原剂，只能还原分子左端的醛基（aldehyde, —CHO）为伯醇羟基（—CH₂OH），而绝不能还原右端的酯基（ester, —COOCH₃），故产物为 HOCH₂CH₂CH₂COOCH₃（若换用两步 LiAlH₄ 则得 A）。"}, {"q": "在实验室中将丁酸（butanoic acid, CH₃CH₂CH₂COOH）高效转化为丁酰胺（butanamide, CH₃CH₂CH₂CONH₂），正确的试剂与步骤是什么？", "options": ["A. 在室温下直接加入过量稀氨水 NH₃(aq)", "B. 加入 NaNO₂ 与稀盐酸", "C. 第一步加入 SOCl₂（生成 CH₃CH₂CH₂COCl），第二步加入过量 NH₃", "D. 第一步加入 NaOH(aq)，第二步加入 NH₄Cl"], "ans": 2, "exp": "室温下将羧酸直接与 NH₃(aq) 混合只发生酸碱中和生成离子盐 CH₃CH₂CH₂COO⁻NH₄⁺！正确两步法：Step 1 加 SOCl₂（或 PCl₅）转化为活泼酰氯 butanoyl chloride (CH₃CH₂CH₂COCl)，Step 2 加 NH₃ 即生成 butanamide。"}], "duration": 240.01, "audioFile": "audio/05_31.6-31.7_醛酮选择性还原与羧酸四大反应.mp3", "fullStart": 905.68, "fullEnd": 1145.68}, {"id": "ep6", "epNum": "第 6 讲", "code": "31.8 – 31.9", "fileSlug": "06_31.8-31.9_酯与酰胺酸碱水解及鉴别总表", "titleZh": "酯与未取代酰胺的酸碱水解铁律及全章官能团定性鉴别总表", "titleEn": "Acid & Alkaline Hydrolysis of Esters and Unsubstituted Amides & Master Chemical Tests", "goal": "看懂酯 C—O 断键 SVG 图，彻底区分酯的可逆酸水解（⇌）与不可逆碱水解皂化（⟶ RCOO⁻Na⁺ + R'OH，牢记醇遇 NaOH 绝不变盐！），锁死酰胺水解“酸无氨、碱无酸”铁律与湿润红石蕊试纸检验，通关全章定性鉴别矩阵。", "keyTerms": [{"en": "acid hydrolysis", "zh": "酸性水解（酯可逆 ⇌；酰胺不可逆 ⟶）"}, {"en": "saponification", "zh": "皂化反应（酯的不可逆碱性水解 ⟶）"}, {"en": "carboxylate salt (RCOO⁻Na⁺)", "zh": "羧酸盐（碱水解产物，酸化再生酸）"}, {"en": "unsubstituted amide (RCONH₂)", "zh": "未取代酰胺（酸生 NH₄⁺，碱放 NH₃）"}, {"en": "moist red litmus paper", "zh": "湿润红色石蕊试纸（遇 NH₃ 变蓝）"}, {"en": "qualitative chemical tests", "zh": "有机官能团定性鉴别测试"}], "boards": [{"id": "b6_1", "tag": "板书 1 · 酯的酸碱水解 (31.8)", "title": "Esters 酸碱水解对决：可逆性、产率高低与“醇见 NaOH 不变盐”红线", "html": "<svg class=\"board-svg\" viewBox=\"0 0 780 225\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"酯的 C—O 单键断键与酸碱水解对比图\">\n  <rect x=\"0\" y=\"0\" width=\"780\" height=\"225\" rx=\"12\" fill=\"#fffbeb\" stroke=\"#fcd34d\" stroke-width=\"1.5\"/>\n  <text x=\"390\" y=\"24\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#92400e\">酯（Ester）水解断键靶点：沿羰基碳与单键氧之间 R—C(=O)  |  O—R' 精准剪开！</text>\n\n  <!-- Top Ester Cleavage Visual -->\n  <rect x=\"170\" y=\"34\" width=\"210\" height=\"44\" rx=\"8\" fill=\"#fef2f2\" stroke=\"#fca5a5\" stroke-width=\"1.5\"/>\n  <text x=\"275\" y=\"54\" text-anchor=\"middle\" font-family=\"SF Mono, Menlo, monospace\" font-size=\"13.5\" font-weight=\"800\" fill=\"#b91c1c\">CH₃ — C(=O)</text>\n  <text x=\"275\" y=\"71\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#dc2626\">酰基侧（酸中补 —OH；碱中变 —O⁻Na⁺）</text>\n\n  <line x1=\"390\" y1=\"30\" x2=\"390\" y2=\"83\" stroke=\"#dc2626\" stroke-width=\"2.6\" stroke-dasharray=\"5,3\"/>\n  <rect x=\"364\" y=\"46\" width=\"52\" height=\"18\" rx=\"4\" fill=\"#dc2626\"/>\n  <text x=\"390\" y=\"59\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"800\" fill=\"#ffffff\">C—O 断键</text>\n\n  <rect x=\"400\" y=\"34\" width=\"210\" height=\"44\" rx=\"8\" fill=\"#ecfdf5\" stroke=\"#6ee7b7\" stroke-width=\"1.5\"/>\n  <text x=\"505\" y=\"54\" text-anchor=\"middle\" font-family=\"SF Mono, Menlo, monospace\" font-size=\"13.5\" font-weight=\"800\" fill=\"#047857\">— O — CH₂CH₃</text>\n  <text x=\"505\" y=\"71\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#059669\">烷氧基侧（酸碱中一律补 —H 变中性醇！）</text>\n\n  <!-- Left Bottom Card: Acid Hydrolysis -->\n  <rect x=\"16\" y=\"89\" width=\"366\" height=\"124\" rx=\"10\" fill=\"#ffffff\" stroke=\"#fde68a\" stroke-width=\"1.6\"/>\n  <rect x=\"16\" y=\"89\" width=\"366\" height=\"27\" rx=\"10\" fill=\"#fef3c7\"/>\n  <text x=\"199\" y=\"107\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"800\" fill=\"#b45309\">① Acid Hydrolysis（酸性水解 · 可逆反应 ⇌）</text>\n  <text x=\"28\" y=\"132\" font-size=\"11.3\" font-weight=\"700\" fill=\"#475569\">条件：dilute H₂SO₄(aq) / HCl(aq) [仅作 catalyst], heat under reflux</text>\n  <text x=\"28\" y=\"155\" font-family=\"SF Mono, Menlo, monospace\" font-size=\"12.2\" font-weight=\"800\" fill=\"#0f172a\">CH₃COOCH₂CH₃ + H₂O  ⇌  CH₃COOH + CH₃CH₂OH</text>\n  <text x=\"28\" y=\"178\" font-size=\"11.3\" font-weight=\"700\" fill=\"#b45309\">• 必须画可逆号 ⇌ ！反应不完全（incomplete），醇产率偏低</text>\n  <text x=\"28\" y=\"198\" font-size=\"11.3\" fill=\"#334155\">• 直接得到游离态 carboxylic acid + alcohol（与未反应酯共存）</text>\n\n  <!-- Right Bottom Card: Alkaline Hydrolysis (Saponification) -->\n  <rect x=\"398\" y=\"89\" width=\"366\" height=\"124\" rx=\"10\" fill=\"#ffffff\" stroke=\"#6ee7b7\" stroke-width=\"1.8\"/>\n  <rect x=\"398\" y=\"89\" width=\"366\" height=\"27\" rx=\"10\" fill=\"#d1fae5\"/>\n  <text x=\"581\" y=\"107\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"800\" fill=\"#065f46\">② Alkaline Hydrolysis / Saponification（不可逆 ⟶）</text>\n  <text x=\"410\" y=\"132\" font-size=\"11.3\" font-weight=\"700\" fill=\"#475569\">条件：NaOH(aq) / KOH(aq) [作 reactant 消耗], heat under reflux</text>\n  <text x=\"410\" y=\"155\" font-family=\"SF Mono, Menlo, monospace\" font-size=\"12.2\" font-weight=\"800\" fill=\"#0f172a\">CH₃COOCH₂CH₃ + NaOH ⟶ CH₃COO⁻Na⁺ + CH₃CH₂OH</text>\n  <text x=\"410\" y=\"178\" font-size=\"11.3\" font-weight=\"800\" fill=\"#047857\">• 单向到底（goes to completion，高产率）！生成 carboxylate salt</text>\n  <text x=\"410\" y=\"198\" font-size=\"11.3\" font-weight=\"700\" fill=\"#be123c\">• 回流后须补加 excess dilute HCl(aq) 酸化，方能再生游离 RCOOH！</text>\n</svg>\n                <div class=\"b-note\" style=\"margin-top:8px;\">🚨 <strong>HKEAA 双重零分红线</strong>：① 碱性水解直接产物错写成游离酸 <em><code>CH₃COOH</code></em> ➔ <strong>0 分</strong>（碱液中必为 <strong><code>CH₃COO⁻Na⁺</code></strong>）；② 把醇也错写成盐 <em><code>CH₃CH₂O⁻Na⁺</code></em> ➔ <strong>0 分</strong>（<strong>醇绝不与 <code>NaOH(aq)</code> 反应</strong>，永远保持中性 <code>R'OH</code>！）。</div>\n                ", "start": 0.25, "end": 90.452}, {"id": "b6_2", "tag": "板书 2 · 酰胺水解铁律 (31.9)", "title": "Unsubstituted Amides 酸碱不可逆水解：“酸中无氨气，碱中无游离酸”！", "html": "\n                <div class=\"b-scheme\">\n<pre>【剪刀沿 C(=O)—NH₂ 剪开 —— 因必有一方成盐，酸水解与碱水解 100% 全是不可逆单向箭头 ⟶ ！】\n  ① Acid hydrolysis (excess dilute HCl / H₂SO₄, heat under reflux) —— 酸中无氨气！\n     CH₃CONH₂ + H₂O + H⁺(aq) ─────▶ CH₃COOH(aq)  +  NH₄⁺(aq)   [指定 HCl 则写 + NH₄Cl(aq)，无气体逸出！]\n\n  ② Alkaline hydrolysis (excess NaOH(aq), heat under reflux) —— 碱中无游离酸！（★ 检验 —CONH₂ 标准测试！）\n     CH₃CONH₂ + OH⁻(aq)      ─────▶ CH₃COO⁻(aq)  +  NH₃(g)↑    [放 pungent gas，使 MOIST red litmus paper 变蓝！]\n\n  ★ 双官能团实战：H₂NCOCH₂CH₂COOCH₂CH₃ + 2OH⁻(aq) ──(reflux)──▶ ⁻OOCCH₂CH₂COO⁻(aq) + CH₃CH₂OH(aq) + NH₃(g)↑</pre>\n                </div>\n                <div class=\"b-note\">💡 <strong>高阶秒杀</strong>：如何用 <code>NaOH(aq)</code> 区分共价固体 <code>CH₃CONH₂</code> 与离子盐 <code>CH₃COO⁻NH₄⁺</code>？<strong>室温不加热加冷 <code>NaOH(aq)</code></strong>：离子盐 <code>CH₃COO⁻NH₄⁺</code> <strong>室温即刻放出 <code>NH₃(g)</code></strong>；而共价 <code>CH₃CONH₂</code> 室温无气体，<strong>必须加热煮沸（boil / reflux）</strong>才断 <code>C—N</code> 键放 <code>NH₃</code>！</div>\n                ", "start": 91.072, "end": 180.92}, {"id": "b6_3", "tag": "板书 3 · 全章鉴别破案总表", "title": "HKDSE 全章官能团 Qualitative Chemical Tests 速查总表与三瓶液体破案法", "html": "\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>目标基团 / 鉴别对</th>\n                      <th>首选试剂与条件</th>\n                      <th>HKEAA 标准英文现象（Observable Change）</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong><code>Alkene (C=C)</code></strong></td>\n                      <td><code>Br₂ (in organic solvent)</code>, in the dark</td>\n                      <td><code>Orange / brown</code> solution <strong><code>decolorizes</code> rapidly</strong></td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>Haloalkane (R—X)</code></strong></td>\n                      <td>① <code>NaOH, reflux</code> ② <strong><code>excess dil. HNO₃</code></strong> ③ <code>AgNO₃</code></td>\n                      <td><code>AgCl</code> <strong><code>white</code></strong> / <code>AgBr</code> <strong><code>creamy</code></strong> / <code>AgI</code> <strong><code>yellow ppt</code></strong></td>\n                    </tr>\n                    <tr>\n                      <td><strong>无水 <code>Alcohol (—OH)</code></strong></td>\n                      <td>Solid <strong><code>PCl₅(s)</code></strong>, r.t. (must be <code>dry</code>!)</td>\n                      <td><strong><code>Steamy fumes</code> / <code>white misty fumes</code></strong> evolved</td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>Aldehyde</code> vs <code>Ketone</code></strong><br><em>(或 1°/2° vs 3° 醇)</em></td>\n                      <td><strong><code>Acidified K₂Cr₂O₇(aq)</code></strong>, warm / heat</td>\n                      <td><code>Aldehyde</code> (1°/2° 醇): <strong><code>orange to green</code></strong>；<code>Ketone</code> (3° 醇): <strong><code>remains orange</code></strong></td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>Carboxylic acid</code></strong></td>\n                      <td><strong><code>NaHCO₃(aq)</code></strong> or <code>Na₂CO₃(aq)</code>, r.t.</td>\n                      <td><strong><code>Colourless gas bubbles</code> (<code>effervescence</code>)</strong></td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>Amide (—CONH₂)</code></strong></td>\n                      <td><strong><code>NaOH(aq)</code>, boil / heat</strong></td>\n                      <td><code>Pungent gas</code> turns <strong><code>moist red litmus paper</code> blue</strong></td>\n                    </tr>\n                  </tbody>\n                </table>\n                <div class=\"b-note\" style=\"margin-top:7px;\">🧭 <strong>三瓶无水液体（<code>CH₃COOH</code>、<code>CH₃CH₂OH</code>、<code>CH₃COOCH₂CH₃</code>）两步淘汰法</strong>：Step 1 各加 <code>NaHCO₃(aq)</code> 揪出唯一冒泡的乙酸；Step 2 剩余两瓶温热 <code>acidified K₂Cr₂O₇(aq)</code>（或加 <code>PCl₅(s)</code>），变绿（冒白雾）为乙醇，无变化为乙酸乙酯！</div>\n                ", "start": 181.54, "end": 253.152}], "turns": [{"speaker": "teacher", "role": "concept", "stepTag": "✂️ 酯键剪切 · 可逆酸水解 vs 不可逆碱水解皂化", "boardId": "b6_1", "displayHtml": "欢迎来到收官第 6 讲！看<strong>第 1 张板书</strong>沿酯基 <code>C—O</code> 单键剪开：左卡 <strong><code>acid hydrolysis</code></strong> 用稀酸作催化剂回流，属可逆反应（必画 <strong><code>⇌</code></strong>），反应不完全且产率偏低；右卡 <strong><code>alkaline hydrolysis (saponification)</code></strong> 用 <code>NaOH(aq)</code> 回流，酸成盐使逆反应断根，<strong>单向到底（<code>⟶</code>）</strong>，醇产率极高！", "start": 0.25, "end": 46.208}, {"speaker": "teacher", "role": "trap", "stepTag": "🚨 两条红线 · 酸化再生游离酸与“醇见 NaOH 绝不变盐”", "boardId": "b6_1", "displayHtml": "死守底部两条零分红线：① 酯在 <code>NaOH(aq)</code> 回流直接得离子态 <strong><code>carboxylate salt (RCOO⁻Na⁺)</code></strong>，须补加 <strong><code>excess dilute HCl(aq)</code></strong> 酸化方能再生游离酸；② <strong>中性 <code>alcohol</code> 绝不与 <code>NaOH(aq)</code> 反应</strong>，严禁写成醇钠盐！默念：<strong>“碱中无游离酸，醇见 <code>NaOH</code> 绝不变盐！”</strong>", "start": 46.548, "end": 90.452}, {"speaker": "teacher", "role": "concept", "stepTag": "⚖️ 酰胺铁律 · 酸中无氨气（NH₄⁺），碱中无游离酸（NH₃↑）", "boardId": "b6_2", "displayHtml": "切到<strong>第 2 张板书</strong>攻克 <strong><code>unsubstituted amides (RCONH₂)</code></strong> 水解！因酸碱中必有一方彻底成盐，酸水解与碱水解<strong>全是单向不可逆（<code>⟶</code>）</strong>！背熟铁律：<strong>酸水解得 <code>RCOOH + NH₄⁺</code>（无气体！）；碱水解得 <code>RCOO⁻ + NH₃(g)</code>（冒刺激性氨气使 <code>moist red litmus paper</code> 变蓝！）</strong>。", "start": 91.072, "end": 136.226}, {"speaker": "teacher", "role": "trap", "stepTag": "💡 高阶辨析 · 室温冷 NaOH 区分酰胺与铵盐及双官能团水解", "boardId": "b6_2", "displayHtml": "盯紧两大高分细节：① 写石蕊试纸验氨气<strong>漏写 <code>moist</code>（湿润）直接扣分</strong>！② 用 <code>NaOH(aq)</code> 区分固态共价 <code>CH₃CONH₂</code> 与离子盐 <code>CH₃COO⁻NH₄⁺</code> 时，秘诀是<strong>室温不加热加冷 <code>NaOH(aq)</code></strong>——铵盐室温即刻放 <code>NH₃</code>，而共价酰胺室温无气体，必须<strong>持续煮沸（<code>boil</code>）</strong>才断 <code>C—N</code> 键放氨气！", "start": 136.566, "end": 180.92}, {"speaker": "teacher", "role": "summary", "stepTag": "🗺️ 破案总表 · 七大官能团定性鉴别测试一网打尽", "boardId": "b6_3", "displayHtml": "进入<strong>第 3 张板书</strong>复盘全章定性鉴别总表：抓 <code>C=C</code> 用暗处 <code>Br₂</code> 看迅速褪色；抓 <code>R—X</code> 走 <code>NaOH</code> 回流、<strong><code>excess dilute HNO₃</code></strong>、<code>AgNO₃</code> 看三色沉淀；抓无水 <code>—OH</code> 用 <code>PCl₅(s)</code> 看 <code>steamy fumes</code>；分醛酮用温热 <code>acidified K₂Cr₂O₇(aq)</code> 看橙变绿；抓 <code>—COOH</code> 用 <code>NaHCO₃(aq)</code>；抓 <code>—CONH₂</code> 煮沸 <code>NaOH(aq)</code>！", "start": 181.54, "end": 215.78}, {"speaker": "teacher", "role": "summary", "stepTag": "🏁 通关收束 · 三瓶液体两步淘汰法与 Unit 32/33 预告", "boardId": "b6_3", "displayHtml": "最后掌握鉴别三瓶无水液体（乙酸、乙醇、乙酸乙酯）的<strong>两步淘汰法</strong>：<strong>Step 1</strong> 各加 <code>NaHCO₃(aq)</code> 挑出唯一冒泡的乙酸（另两瓶写明 <code>no observable change</code>）；<strong>Step 2</strong> 剩余两份温热 <code>acidified K₂Cr₂O₇(aq)</code>，变绿为乙醇，无变化为乙酸乙酯！恭喜通关 Unit 31，下一站 Unit 32 合成见！", "start": 216.12, "end": 253.152}], "quickChecks": [{"q": "将丙酸乙酯（ethyl propanoate, CH₃CH₂COOCH₂CH₃）与过量 NaOH(aq) 回流加热直至碱性水解完全，反应混合液中存在的两种含碳产物是什么？", "options": ["A. propanoic acid 与 ethanol", "B. sodium propanoate (CH₃CH₂COO⁻Na⁺) 与 ethanol (CH₃CH₂OH)", "C. sodium propanoate 与 sodium ethoxide (CH₃CH₂O⁻Na⁺)", "D. ethanoic acid 与 propan-1-ol"], "ans": 1, "exp": "牢记口诀“碱中无游离酸，醇见 NaOH 绝不变盐”！丙酸乙酯沿 C—O 断键后，丙酸部分在过量 NaOH(aq) 中完全中和为羧酸盐 sodium propanoate (CH₃CH₂COO⁻Na⁺)，而中性的乙醇不与 NaOH 反应，仍为 ethanol (CH₃CH₂OH)。"}, {"q": "只用一种试剂即可在室温（无需加热）下快速区分固态乙酰胺（ethanamide, CH₃CONH₂）与固态乙酸铵（ammonium ethanoate, CH₃COO⁻NH₄⁺），正确的操作与现象是什么？", "options": ["A. 在室温下分别加入冷的 NaOH(aq)：CH₃COO⁻NH₄⁺ 立即放出使湿润红石蕊试纸变蓝的刺激性氨气，而 CH₃CONH₂ 室温无气体放出", "B. 分别加入稀盐酸 HCl(aq)：两者均放出大量氨气", "C. 分别加入酸化 K₂Cr₂O₇(aq)：CH₃CONH₂ 使溶液由橙变绿", "D. 分别加入 AgNO₃(aq)：CH₃COO⁻NH₄⁺ 生成黄色沉淀"], "ans": 0, "exp": "CH₃COO⁻NH₄⁺ 是含 NH₄⁺ 的离子盐，室温下遇 OH⁻ 即发生离子反应 NH₄⁺ + OH⁻ ⟶ NH₃(g) + H₂O 立即放出氨气；而共价化合物 CH₃CONH₂ 在室温下与冷 NaOH(aq) 不放气体，必须持续煮沸回流才能打断 C—N 共价键放出 NH₃。"}], "duration": 253.6, "audioFile": "audio/06_31.8-31.9_酯与酰胺酸碱水解及鉴别总表.mp3", "fullStart": 1147.18, "fullEnd": 1400.78}]};
