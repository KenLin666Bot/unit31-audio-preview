  <script>
    window.COURSE_DATA = {"totalDuration": 2193.08, "mergedAudioFile": "audio/00_Unit31_各官能团的典型反应_完整连听版.mp3", "episodes": [{"id": "ep1", "epNum": "第 1 讲", "code": "31.1 – 31.3", "fileSlug": "01_31.1-31.3_烷烃回顾与马氏规则加成", "titleZh": "烷烃取代回顾与不对称烯烃加成（马氏规则）", "titleEn": "Revisiting Alkanes & Addition of HX to Unsymmetrical Alkenes (Markovnikov's Rule)", "goal": "串起 Topic 7 的烷烃取代与对称加成，掌握不对称烯烃（unsymmetrical alkene）加卤化氢时的马氏规则（Markovnikov's rule），精准避开“数错氢原子”与“戊-2-烯无偏向”两大考场陷阱。", "keyTerms": [{"en": "free radical substitution", "zh": "自由基取代反应"}, {"en": "unsymmetrical alkene", "zh": "不对称烯烃"}, {"en": "Markovnikov's rule", "zh": "马氏规则（氢多加氢）"}, {"en": "major product / minor product", "zh": "主产物 / 副产物"}, {"en": "position isomers", "zh": "位置异构体"}], "boards": [{"id": "b1_1", "tag": "板书 1 · 温故知新 (31.1–31.2)", "title": "烷烃自由基取代 vs 对称烯烃加成反应", "html": "\n                <div class=\"board-grid-2\">\n                  <div class=\"b-box b-amber\">\n                    <div class=\"b-box-title\">① 烷烃 Alkanes（饱和烃 Saturated，单键稳定）</div>\n                    <div class=\"b-eq\">CH<sub>3</sub>CH<sub>3</sub>(g) + Br<sub>2</sub>(l) <span class=\"chem-arr\"><span class=\"c-top\">UV light (or heat)</span><span class=\"a-line\">⟶</span></span> CH<sub>3</sub>CH<sub>2</sub>Br(l) + HBr(g)</div>\n                    <ul class=\"b-points\">\n                      <li>反应类型：<strong>自由基取代反应（free radical substitution）</strong></li>\n                      <li>课本规范三阶段：<code>Initiation</code>（链引发）→ <code>Propagation</code>（链增长）→ <code>Termination</code>（链终止）</li>\n                      <li>⚠️ 箭头条件严守精工课本写 <code>UV light</code> 或 <code>heat</code>（不写大学符号 hν），现象为橙棕色<strong>缓慢褪色</strong>并冒白雾。</li>\n                    </ul>\n                  </div>\n                  <div class=\"b-box b-blue\">\n                    <div class=\"b-box-title\">② 烯烃 Alkenes（含不饱和 C=C 双键）</div>\n                    <div class=\"b-eq\">CH<sub>2</sub>=CH<sub>2</sub>(g) + H<sub>2</sub>(g) <span class=\"chem-arr\"><span class=\"c-top\">Pt (or Pd / Ni, heat)</span><span class=\"a-line\">⟶</span></span> CH<sub>3</sub>CH<sub>3</sub>(g)</div>\n                    <div class=\"b-eq\">CH<sub>2</sub>=CH<sub>2</sub>(g) + Br<sub>2</sub> <span class=\"chem-arr\"><span class=\"c-top\">in organic solvent</span><span class=\"a-line\">⟶</span></span> CH<sub>2</sub>BrCH<sub>2</sub>Br</div>\n                    <ul class=\"b-points\">\n                      <li>催化氢化（<strong>catalytic hydrogenation</strong>）：<code>Pt</code>/<code>Pd</code> 室温即可，用 <code>Ni</code> 则需注明 <code>heat</code>。</li>\n                      <li>溴加成（<strong>halogenation</strong>）：室温避光<strong>瞬间褪色</strong>（orange/reddish-brown to colourless）。</li>\n                    </ul>\n                  </div>\n                </div>\n                ", "start": 0.25, "end": 114.741}, {"id": "b1_2", "tag": "板书 2 · 核心定律 (31.3)", "title": "不对称烯烃 + HX 加成：马氏规则（Markovnikov's Rule）", "html": "\n                <div class=\"b-quote\">\n                  <div class=\"b-quote-en\">\"When a molecule HX adds to an unsymmetrical alkene, the hydrogen atom H attaches <strong>mainly</strong> to the carbon atom of the carbon-carbon double bond that already carries a <strong>greater number of hydrogen atoms</strong>.\"</div>\n                  <div class=\"b-quote-zh\">💡 中文口诀：<strong>“氢多加氢、富者越富”</strong> —— H 优先去原本带 H 较多的双键碳，卤素 X 去带 H 较少的双键碳！</div>\n                </div>\n                <div class=\"b-scheme\">\n<pre>丙烯 Propene（不对称烯烃） + 溴化氢 Hydrogen bromide (HBr)，室温无需催化剂：\n\n   CH₃ — C²H ＝ C¹H₂  +  H—Br  ─┬─► CH₃—CHBr—CH₃    2-bromopropane（2-溴丙烷） ★ MAJOR PRODUCT 主产物\n        (1个H) (2个H)          │    （H 加去含 2 个 H 的 C1，Br 加去含 1 个 H 的 C2）\n                               └─► CH₃—CH₂—CH₂Br   1-bromopropane（1-溴丙烷） ☆ minor product 副产物</pre>\n                </div>\n                <div class=\"b-note\">📌 <strong>配平与条件细节</strong>：加成反应原子 100% 进产物（无无机小分子副产物），室温（room temperature）直接发生，<strong>切勿</strong>多此一举写 <code>UV light</code>！</div>\n                ", "start": 115.391, "end": 225.566}, {"id": "b1_3", "tag": "板书 3 · DSE 考官双陷阱", "title": "陷阱 ① 只数双键碳直接相连的 H  |  陷阱 ② 戊-2-烯马氏无偏向", "html": "\n                <div class=\"board-grid-2\">\n                  <div class=\"b-box b-rose\">\n                    <div class=\"b-box-title\">⚠️ 陷阱 ①：甲基丙烯 Methylpropene + HCl</div>\n                    <div class=\"b-scheme-sm\">\n<pre>  (CH₃)₂C² ＝ C¹H₂  +  HCl\n  (0个H!)   (2个H)\n     │\n     ├──► (CH₃)₃C—Cl       ★ 主产物 Major:\n     │                     2-chloro-2-methylpropane\n     └──► (CH₃)₂CH—CH₂Cl   ☆ 副产物 Minor:\n                           1-chloro-2-methylpropane</pre>\n                    </div>\n                    <p class=\"b-tip-text\">左边 C2 连着两个 <code>-CH₃</code>（那 6 个 H 连在甲基碳上，<strong>不算</strong>！直接连在 C2 上的 H 是 <strong>0 个</strong>！），所以 H 加去右边 <code>=CH₂</code>！</p>\n                  </div>\n                  <div class=\"b-box b-teal\">\n                    <div class=\"b-box-title\">⚠️ 陷阱 ②：丁-2-烯 vs 戊-2-烯（加 HBr 对比）</div>\n                    <table class=\"b-mini-table\">\n                      <thead><tr><th>烯烃结构</th><th>双键碳 H 数</th><th>产物结果</th></tr></thead>\n                      <tbody>\n                        <tr>\n                          <td><code>CH₃CH=CHCH₃</code><br>丁-2-烯（<strong>对称</strong>）</td>\n                          <td>C2: 1H<br>C3: 1H</td>\n                          <td><strong>唯一产物</strong>：<br><code>2-bromobutane</code></td>\n                        </tr>\n                        <tr>\n                          <td><code>CH₃CH₂CH=CHCH₃</code><br>戊-2-烯（<strong>不对称</strong>）</td>\n                          <td>C2: <strong>1H</strong><br>C3: <strong>1H</strong></td>\n                          <td><strong>无单一主产物！</strong>生成约等量的 <code>2-bromopentane</code> 与 <code>3-bromopentane</code></td>\n                        </tr>\n                      </tbody>\n                    </table>\n                  </div>\n                </div>\n                ", "start": 226.216, "end": 402.238}], "turns": [{"speaker": "teacher", "boardId": "b1_1", "displayHtml": "哈喽，欢迎来到《Mastering Chemistry》Book 3B 最核心的一章——<strong>Unit 31：Typical reactions of selected functional groups，各官能团的典型反应</strong>！小琳，在正式打开新地图之前，如果把有机化学比作地铁网络，你知道 Unit 31 扮演什么角色吗？", "start": 0.25, "end": 20.059}, {"speaker": "student", "boardId": "b1_1", "displayHtml": "陈老师好！我在前面 Unit 29 和 Unit 30 刚认全了醇、醛、酮、羧酸、酯、酰胺这些官能团（functional groups）的名字和异构体，Unit 31 应该就是教它们怎么互相变身、怎么换乘的吧？", "start": 20.419, "end": 38.253}, {"speaker": "teacher", "boardId": "b1_1", "displayHtml": "一点没错！掌握了这一章，后面 Unit 32 的多步有机合成（multi-step synthesis）和结构推断题就全通了。咱们先看屏幕上的<strong>第 1 张板书</strong>，花半分钟把 Topic 7 学过的两类老朋友热个身：左边是只含单键的饱和烃——<strong>烷烃（alkanes）</strong>。它平时很懒惰，只有遇到氯气或溴，在什么条件下才会发生反应？", "start": 38.613, "end": 63.815}, {"speaker": "student", "boardId": "b1_1", "displayHtml": "这个我记得！箭头上面必须按精工课本标准写 <code>UV light</code>（紫外光）或者 <code>heat</code>（加热），发生<strong>自由基取代反应（free radical substitution）</strong>，还要经历 <code>Initiation</code> 链引发、<code>Propagation</code> 链增长、<code>Termination</code> 链终止三个阶段！", "start": 64.175, "end": 82.463}, {"speaker": "teacher", "boardId": "b1_1", "displayHtml": "非常扎实！再看板书右边，<strong>烯烃（alkenes）</strong>因为有一根不饱和的碳碳双键（carbon-carbon double bond, <code>C=C</code>），性格就活泼多了，最爱发生<strong>加成反应（addition reactions）</strong>：把双键打开，左右两个双键碳一人分一个原子。比如加氢气叫<strong>催化氢化（catalytic hydrogenation）</strong>，用铂 <code>Pt</code> 或钯 <code>Pd</code> 在室温就能反应，如果用镍 <code>Ni</code> 催化剂就要加上 <code>heat</code>；加有机溶剂里的溴 <code>Br₂</code>，室温避光就能让橙棕色瞬间褪为无色。", "start": 82.823, "end": 114.741}, {"speaker": "student", "boardId": "b1_2", "displayHtml": "老师，以前我们用乙烯（ethene, <code>CH₂=CH₂</code>）加氢气或者加溴，两边都是对称的，怎么加都只有一种产物。但如果烯烃两边不对称，加进来的又是像溴化氢（<code>HBr</code>）这样一头氢、一头溴的分子，岂不是有两种排法了？", "start": 115.391, "end": 133.428}, {"speaker": "teacher", "boardId": "b1_2", "displayHtml": "你一下子就问到 31.3 节的核心了！请看<strong>第 2 张板书</strong>：像丙烯（propene, <code>CH₃—CH=CH₂</code>）这样，双键两端的碳连着不同基团的烯烃，英文叫 <strong>unsymmetrical alkene，不对称烯烃</strong>。当它和卤化氢（hydrogen halide, <code>HX</code>，比如 <code>HCl</code> 或 <code>HBr</code>）在室温下加成时，确实会同时生成两种互为<strong>位置异构体（position isomers）</strong>的卤代烷——但它们俩的产量可不是五五开，而是一多一少！多的叫 <strong>major product（主产物）</strong>，少的叫 <strong>minor product（副产物）</strong>。", "start": 133.788, "end": 168.052}, {"speaker": "student", "boardId": "b1_2", "displayHtml": "那怎么判断谁是 major product（主产物）呢？", "start": 168.412, "end": 171.771}, {"speaker": "teacher", "boardId": "b1_2", "displayHtml": "靠的就是板书顶上这条鼎鼎大名的<strong>马氏规则（Markovnikov's rule）</strong>！我们先听一遍课本的标准英文表述，考试写解释题可以直接拿分：<em>When a molecule HX adds to an unsymmetrical alkene, the hydrogen atom H attaches mainly to the carbon atom of the carbon-carbon double bond that already carries a greater number of hydrogen atoms.</em> 用四个字总结就是——<strong>“氢多加氢”</strong>！你看丙烯 <code>CH₃—CH=CH₂</code>：右边 1 号双键碳 <code>=CH₂</code> 原本带着 2 个氢，左边 2 号双键碳 <code>-CH=</code> 只带 1 个氢。<code>HBr</code> 上车时，<code>H</code> 喜欢往氢朋友更多的 1 号碳上挤，<code>Br</code> 就去 2 号碳，所以主产物（major product）是中间挂溴的 <strong>2-溴丙烷（2-bromopropane）</strong>，而末端挂溴的 1-溴丙烷（1-bromopropane）只是副产物（minor product）！", "start": 172.131, "end": 225.566}, {"speaker": "student", "boardId": "b1_3", "displayHtml": "“氢多加氢”好记！不过陈老师，我看<strong>第 3 张板书</strong>左边那个甲基丙烯（methylpropene, <code>(CH₃)₂C=CH₂</code>），左边双键碳上挂着两个甲基 <code>-CH₃</code>，二三得六，足足有 6 个氢原子；右边 <code>=CH₂</code> 才 2 个氢！那加 <code>HCl</code> 的时候，氢是不是应该加去左边啊？", "start": 226.216, "end": 244.25}, {"speaker": "teacher", "boardId": "b1_3", "displayHtml": "哈哈，停！你刚刚踩中的就是 DSE 选择题最喜欢挖的<strong>头号陷阱</strong>！一定要拿红笔画重点：马氏规则只数<strong>直接连在碳碳双键那两个碳原子身上的氢</strong>！你看甲基丙烯左边的 2 号双键碳，它四只手抓着两个碳和一根双键，<strong>直接连在它身上的氢原子是 0 个</strong>！那 6 个氢是连在隔壁甲基碳上的“邻居”，根本不算数！相反，右边 1 号双键碳 <code>=CH₂</code> 直接连着 2 个氢。2 比 0 多，所以 <code>H</code> 照样加去右边 1 号碳，<code>Cl</code> 加到中间 2 号碳，主产物是 <strong>2-氯-2-甲基丙烷（2-chloro-2-methylpropane）</strong>！", "start": 244.61, "end": 288.054}, {"speaker": "student", "boardId": "b1_3", "displayHtml": "哇，好险！只看双键碳“亲生的”氢，不看甲基邻居的氢！那老师，板书右边那个戊-2-烯（pent-2-ene, <code>CH₃CH₂CH=CHCH₃</code>）好奇怪，它左右一边是乙基、一边是甲基，肯定是不对称烯烃；可它两个双键碳上各自都只连着 1 个氢，1 比 1 打平手了怎么办？", "start": 288.414, "end": 309.606}, {"speaker": "teacher", "boardId": "b1_3", "displayHtml": "太敏锐了！这就是<strong>第二个考官陷阱</strong>：戊-2-烯（pent-2-ene）确实是不对称烯烃，所以加 <code>HBr</code> 会生成两种不同的位置异构体——<code>2-bromopentane</code> 和 <code>3-bromopentane</code>；但因为两个双键碳各带 1 个氢，马氏规则没有偏向，结果就是生成<strong>产量相近的等量混合物，没有单一主产物</strong>！顺便对比它上面的丁-2-烯（but-2-ene, <code>CH₃CH=CHCH₃</code>）：丁-2-烯左右完全对称，不管 <code>Br</code> 加在 2 号位还是 3 号位，翻过来名字都叫 <code>2-bromobutane</code>，所以只有<strong>唯一一种</strong>结构产物！", "start": 309.966, "end": 350.16}, {"speaker": "student", "boardId": "b1_3", "displayHtml": "全理清了！还有一点老师，马氏规则句子里写的是 <code>attaches mainly</code>（主要连接），是不是说明如果题目问“丙烯加 <code>HBr</code> 一共生成几种有机产物”，副产物也得算进去，答 2 种？", "start": 350.52, "end": 365.531}, {"speaker": "teacher", "boardId": "b1_3", "displayHtml": "满分觉悟！<code>Major product</code> 只是占大多数，绝不是 100% 唯一产物。而且留个小心眼：像丁-1-烯（but-1-ene）加 <code>HBr</code> 生成的主产物 <code>2-bromobutane</code>，2 号碳是个连了四个不同基团的手性碳（chiral carbon），如果题目特意问“考虑立体异构体（stereoisomers）共有几种产物”，还得把那一对对映异构体拆成 2 个算！好啦，现在我们手里已经拿到卤代烷（haloalkanes）了，下一讲我们就看怎么把卤代烷变成醇，顺便揭秘必考的卤素离子检验三步曲！", "start": 365.891, "end": 402.238}], "quickChecks": [{"q": "根据马氏规则（Markovnikov's rule），甲基丙烯 (CH₃)₂C=CH₂ 与 HBr 在室温下加成的主产物（major product）是什么？", "options": ["A. 1-溴-2-甲基丙烷（1-bromo-2-methylpropane）", "B. 2-溴-2-甲基丙烷（2-bromo-2-methylpropane）", "C. 2-溴丁烷（2-bromobutane）"], "ans": 1, "exp": "只数直接连在 C=C 双键碳上的 H：(CH₃)₂C= 带 0 个 H，=CH₂ 带 2 个 H；按“氢多加氢”，H 加去 =CH₂，Br 加去中间碳，得 (CH₃)₃CBr（2-bromo-2-methylpropane）。"}, {"q": "下列哪个烯烃与 HBr 反应会生成两种产量相近的位置异构溴代烷（无明显单一主产物）？", "options": ["A. 丙烯 propene (CH₃CH=CH₂)", "B. 丁-2-烯 but-2-ene (CH₃CH=CHCH₃)", "C. 戊-2-烯 pent-2-ene (CH₃CH₂CH=CHCH₃)"], "ans": 2, "exp": "戊-2-烯（pent-2-ene）既是不对称烯烃，同时 C2 和 C3 双键碳各带 1 个 H，马氏规则无偏向，生成约等量的 2-bromopentane 和 3-bromopentane。丁-2-烯对称，只给唯一产物。"}], "duration": 402.69, "audioFile": "audio/01_31.1-31.3_烷烃回顾与马氏规则加成.mp3", "fullStart": 0.0, "fullEnd": 402.69}, {"id": "ep2", "epNum": "第 2 讲", "code": "31.4", "fileSlug": "02_31.4_卤代烷碱性水解与卤素离子检验", "titleZh": "卤代烷的取代反应：碱性水解与卤素离子检验", "titleEn": "Substitution Reactions of Haloalkanes: Alkaline Hydrolysis & Testing for Halide Ions", "goal": "掌握卤代烷（haloalkanes）经碱性水解（alkaline hydrolysis）转化为醇的化学与离子方程式，背熟“先过量稀硝酸酸化、再加硝酸银”验卤三步曲，并从键焓（bond enthalpy）角度理解水解快慢顺序 R—I > R—Br > R—Cl。", "keyTerms": [{"en": "alkaline hydrolysis", "zh": "碱性水解（取代反应）"}, {"en": "heating under reflux", "zh": "回流加热"}, {"en": "excess dilute nitric acid", "zh": "过量稀硝酸（酸化除 OH⁻）"}, {"en": "white / creamy / yellow precipitate", "zh": "白 / 乳黄 / 黄色卤化银沉淀"}, {"en": "bond enthalpy", "zh": "键焓（决定断键快慢）"}], "boards": [{"id": "b2_1", "tag": "板书 1 · 取代与回流 (31.4)", "title": "卤代烷的碱性水解（Alkaline Hydrolysis）及回流加热原因", "html": "\n                <div class=\"b-box b-blue\">\n                  <div class=\"b-box-title\">标准化学方程式 vs 离子方程式（注意消去旁观离子 Na⁺！）</div>\n                  <div class=\"b-eq\"><strong>化学方程式：</strong>CH<sub>3</sub>CH<sub>2</sub>Br(l) + NaOH(aq) <span class=\"chem-arr\"><span class=\"c-top\">heat under reflux</span><span class=\"a-line\">⟶</span></span> CH<sub>3</sub>CH<sub>2</sub>OH(aq) + NaBr(aq)</div>\n                  <div class=\"b-eq\"><strong>离子方程式：</strong>R—X + OH<sup>−</sup>(aq) <span class=\"chem-arr\"><span class=\"c-top\">heat under reflux</span><span class=\"a-line\">⟶</span></span> R—OH + X<sup>−</sup>(aq)</div>\n                </div>\n                <div class=\"board-grid-2\" style=\"margin-top:10px;\">\n                  <div class=\"b-box b-amber\">\n                    <div class=\"b-box-title\">🔥 为什么要 Heating（加热）？[1M]</div>\n                    <p class=\"b-tip-text\">卤代烷与水不相溶（immiscible），室温下取代反应很慢，加热能<strong>加快缓慢的取代反应速率（speed up the slow reaction）</strong>。</p>\n                  </div>\n                  <div class=\"b-box b-teal\">\n                    <div class=\"b-box-title\">❄️ 为什么要 Under Reflux（回流）？[1M]</div>\n                    <p class=\"b-tip-text\">卤代烷沸点低、易挥发（volatile），垂直回流冷凝管将蒸气冷凝流回烧瓶，<strong>防止易挥发反应物/产物散失（prevent loss of volatile substances）</strong>。</p>\n                  </div>\n                </div>\n                ", "start": 0.25, "end": 128.511}, {"id": "b2_2", "tag": "板书 2 · 必考实验三步曲", "title": "检验卤代烷释放出的卤素离子（Testing for Halide Ions Released）", "html": "\n                <div class=\"b-scheme\">\n<pre>纯卤代烷 R—X 是共价分子（无自由 X⁻ 离子！） ──► 直接加 AgNO₃(aq) 无沉淀！必须按三步走：\n\n  Step 1 [水解断键]：R—X + NaOH(aq) ──(heat under reflux)──► R—OH + X⁻(aq)   (随后冷却 cool)\n                         │\n  Step 2 [酸化清场]：★ 加入过量稀硝酸 Acidify with EXCESS dilute HNO₃(aq)！\n                         │  目的：中和剩余未反应的 OH⁻ (H⁺ + OH⁻ ⟶ H₂O)，防止 OH⁻ 与 Ag⁺ 生成\n                         │        棕黑色 Ag₂O 沉淀掩盖卤化银颜色！（严禁用 dilute HCl 或 H₂SO₄！）\n                         ▼\n  Step 3 [滴银观色]：加入硝酸银溶液 Add AgNO₃(aq)：Ag⁺(aq) + X⁻(aq) ⟶ AgX(s)↓\n                    · Cl⁻ ➔ AgCl(s) 白色沉淀 (white precipitate)\n                    · Br⁻ ➔ AgBr(s) 乳黄色沉淀 (creamy / pale yellow precipitate)\n                    · I⁻  ➔ AgI(s)  黄色沉淀 (yellow precipitate)</pre>\n                </div>\n                ", "start": 129.161, "end": 253.137}, {"id": "b2_3", "tag": "板书 3 · 速率与微观机理", "title": "三类卤代烷水解快慢对比：为什么键焓（Bond Enthalpy）打败了键极性？", "html": "\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>卤代烷（与乙醇 + AgNO₃(aq) 水浴温热）</th>\n                      <th>沉淀出现现象</th>\n                      <th>相对水解速率</th>\n                      <th>C—X 键长与键焓（Bond Enthalpy）解释</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td>碘代烷 <code>1-iodobutane (R—I)</code></td>\n                      <td>最先出现<strong>黄色沉淀</strong> <code>AgI</code></td>\n                      <td><strong>最快 Fastest 🚀</strong></td>\n                      <td>I 原子半径最大 → <code>C—I</code> 键最长、<strong>键焓最弱（lowest bond enthalpy）</strong>，最易断裂！</td>\n                    </tr>\n                    <tr>\n                      <td>溴代烷 <code>1-bromobutane (R—Br)</code></td>\n                      <td>次之出现<strong>乳黄色沉淀</strong> <code>AgBr</code></td>\n                      <td><strong>中等 Moderate</strong></td>\n                      <td><code>C—Br</code> 键焓介于 <code>C—I</code> 与 <code>C—Cl</code> 之间。</td>\n                    </tr>\n                    <tr>\n                      <td>氯代烷 <code>1-chlorobutane (R—Cl)</code></td>\n                      <td>最慢出现<strong>白色沉淀</strong> <code>AgCl</code></td>\n                      <td><strong>最慢 Slowest 🐢</strong></td>\n                      <td><code>C—Cl</code> 键最短、<strong>键焓最强（highest bond enthalpy）</strong>，最难打断！</td>\n                    </tr>\n                  </tbody>\n                </table>\n                <div class=\"b-note\" style=\"margin-top:10px;\">⚠️ <strong>防坑铁律</strong>：切勿被“氯电负性最高、C—Cl 极性最强”迷惑！断键难易由<strong>键焓（bond enthalpy）强弱主导</strong>，绝不能答分子间范德华力（van der Waals' forces）！</div>\n                ", "start": 253.787, "end": 352.515}], "turns": [{"speaker": "teacher", "boardId": "b2_1", "displayHtml": "欢迎回到第 2 讲！上一讲我们用烯烃加成拿到了卤代烷（haloalkanes, <code>R—X</code>）。在有机合成里，卤代烷可是连接“烃类世界”和“含氧世界”的黄金跳板！请看<strong>第 1 张板书</strong>：当我们把溴乙烷（bromoethane, <code>CH₃CH₂Br</code>）和氢氧化钠水溶液（<code>NaOH(aq)</code>）放在一起<strong>回流加热（heat under reflux）</strong>，会发生什么变化？", "start": 0.25, "end": 22.661}, {"speaker": "student", "boardId": "b2_1", "displayHtml": "我看方程式里，溶液中的氢氧根离子（hydroxide ion, <code>OH⁻</code>）上去把溴原子（<code>-Br</code>）顶替了下来，变成了乙醇（ethanol, <code>CH₃CH₂OH</code>），掉下来的溴变成了水里的溴离子（<code>Br⁻</code>）！这算取代反应（substitution reaction）对吧？", "start": 23.021, "end": 39.901}, {"speaker": "teacher", "boardId": "b2_1", "displayHtml": "完全正确！在精工课本里，这个取代反应还有一个专门的名字，叫<strong>碱性水解（alkaline hydrolysis）</strong>。这里有个写方程式的细节要盯紧：如果题目让你写<strong>化学方程式（chemical equation）</strong>，左边写 <code>NaOH(aq)</code>，右边写 <code>NaBr(aq)</code>；但如果题目要求写<strong>离子方程式（ionic equation）</strong>，钠离子 <code>Na⁺</code> 前后都没变，属于旁观离子（spectator ion），必须消掉，写成：<code>R—X + OH⁻(aq) ⟶ R—OH + X⁻(aq)</code>，两边各带 1 个负电荷，电荷与原子完全守恒！", "start": 40.261, "end": 76.85}, {"speaker": "student", "boardId": "b2_1", "displayHtml": "记住了，看清题目问的是 chemical equation 还是 ionic equation！不过老师，为什么反应条件非要写 <code>heat under reflux</code>（回流加热），室温下在烧杯里搅一搅不行吗？", "start": 77.21, "end": 90.772}, {"speaker": "teacher", "boardId": "b2_1", "displayHtml": "这正是 DSE 实验简答题常考的 2 分题！答题时我们要把 <code>heat</code> 和 <code>under reflux</code> 拆成两半各拿 1 分：第一，卤代烷不溶于水，分成上下两层，室温下碳卤共价键断裂得很慢，所以要 <strong>heating（加热）来加快缓慢的取代反应速率</strong>；第二，短链卤代烷沸点低、非常容易挥发（volatile），敞口一烧全跑光了！在烧瓶顶上竖着装一根冷凝管进行 <strong>reflux（回流）</strong>，就能把挥发上去的蒸气冷凝变回液滴流回烧瓶里，防止反应物和产物散失。", "start": 91.132, "end": 128.511}, {"speaker": "student", "boardId": "b2_2", "displayHtml": "原来如此！那老师，如果我想检验某瓶未知卤代烷里装的到底是氯、溴还是碘，能不能直接往纯卤代烷液体里滴硝酸银溶液（<code>AgNO₃(aq)</code>）看沉淀颜色呀？", "start": 129.161, "end": 143.893}, {"speaker": "teacher", "boardId": "b2_2", "displayHtml": "好问题！请看<strong>第 2 张板书</strong>：纯卤代烷属于<strong>共价化合物（covalent compound）</strong>，卤素原子被共价键死死拴在碳链上，液体里根本没有自由移动的卤素离子 <code>X⁻</code>，直接滴硝酸银什么沉淀都不会有！所以第一步，必须先和 <code>NaOH(aq)</code> 回流加热把 <code>X⁻</code> 离子拆下来。那你猜猜，回流冷却之后，能不能立刻往烧瓶里滴 <code>AgNO₃(aq)</code>？", "start": 144.253, "end": 170.541}, {"speaker": "student", "boardId": "b2_2", "displayHtml": "咦……刚刚回流的时候加了很多氢氧化钠，溶液里肯定还剩下一大堆氢氧根离子 <code>OH⁻</code>！银离子 <code>Ag⁺</code> 撞上 <code>OH⁻</code> 会不会自己先沉淀了？", "start": 170.901, "end": 183.211}, {"speaker": "teacher", "boardId": "b2_2", "displayHtml": "漂亮！一针见血！如果不先清场，残留的 <code>OH⁻</code> 会抢先跟 <code>Ag⁺</code> 生成棕黑色的氧化银沉淀（<code>Ag₂O</code>），把原本卤化银的颜色遮得严严实实！所以<strong>第二步是生死攸关的拿分点</strong>：必须先加入<strong>过量稀硝酸（excess dilute nitric acid, <code>HNO₃(aq)</code>）</strong>把剩余的 <code>OH⁻</code> 彻底中和掉！小琳，要是实验桌上刚好有稀盐酸（<code>dilute HCl</code>），我顺手拿稀盐酸去酸化行不行？", "start": 183.571, "end": 213.284}, {"speaker": "student", "boardId": "b2_2", "displayHtml": "哈哈，绝对不行！稀盐酸自己就带着一大堆氯离子 <code>Cl⁻</code>，倒进去再滴硝酸银，不管原来是什么卤代烷，全都会冒出白色的氯化银沉淀，成假警报了！", "start": 213.644, "end": 225.806}, {"speaker": "teacher", "boardId": "b2_2", "displayHtml": "太清醒了！稀硫酸也不行，因为硫酸银微溶也会干扰。所以酸化<strong>只能认准 <code>excess dilute HNO₃(aq)</code>（过量稀硝酸）</strong>！酸化完进入第三步，滴加硝酸银溶液（<code>AgNO₃(aq)</code>），三种沉淀颜色英文一定要背准：氯化银 <code>AgCl</code> 是 <strong>white precipitate（白色沉淀）</strong>，溴化银 <code>AgBr</code> 是 <strong>creamy precipitate（乳黄色沉淀）</strong>，碘化银 <code>AgI</code> 是 <strong>yellow precipitate（黄色沉淀）</strong>。", "start": 226.166, "end": 253.137}, {"speaker": "student", "boardId": "b2_3", "displayHtml": "白、乳黄、黄，三个颜色层层加深！那陈老师，<strong>第 3 张板书</strong>比较氯丁烷、溴丁烷和碘丁烷的水解快慢，氯原子的电负性（electronegativity）最高，把碳拉得最带正电，难道不是氯代烷 <code>R—Cl</code> 水解最快吗？", "start": 253.787, "end": 271.371}, {"speaker": "teacher", "boardId": "b2_3", "displayHtml": "几乎所有初学的同学都会这么猜，但实验结果恰恰相反！如果我们把等量的 1-氯丁烷、1-溴丁烷、1-碘丁烷分别溶在乙醇和硝酸银水溶液里放在温水浴计时——这里加乙醇作助溶剂是为了让油和水互溶公平比赛——你会亲眼看到：<strong>黄色的碘化银最先变浑浊，乳黄色的溴化银第二，白色的氯化银最慢</strong>！也就是说，水解速率是：<strong>碘代烷最快，溴代烷居中，氯代烷最慢（<code>R—I > R—Br > R—Cl</code>）</strong>！", "start": 271.731, "end": 304.142}, {"speaker": "student", "boardId": "b2_3", "displayHtml": "哇，真的是反过来的！为什么极性更强的 <code>C—Cl</code> 键反而最慢呢？", "start": 304.502, "end": 309.886}, {"speaker": "teacher", "boardId": "b2_3", "displayHtml": "因为取代反应最费劲的一步是要<strong>硬生生扯断那根碳卤共价键（<code>C—X</code> bond）</strong>！决定断键难易的主角不是键极性，而是<strong>键焓（bond enthalpy，也就是键能强弱）</strong>。碘原子个头最大，<code>C—I</code> 键长最长、<strong>键焓最弱（lowest bond enthalpy）</strong>，轻轻一碰就断了；而 <code>C—Cl</code> 键又短又结实、键焓最高，最难打断。考试还要防一个大坑：千万别把原因写成范德华力（van der Waals' forces）——分子间作用力只管沸点高低，管不了分子内部共价键的断裂！下一讲，我们就正式走进今天生成的主角——“百变瑞士军刀”醇（alcohols）的世界！", "start": 310.246, "end": 352.515}], "quickChecks": [{"q": "将溴乙烷与 NaOH(aq) 回流加热并冷却后，检验 Br⁻ 离子的正确操作与现象是什么？", "options": ["A. 直接加 AgNO₃(aq)，产生乳黄色沉淀", "B. 先加过量稀盐酸 dilute HCl(aq)，再加 AgNO₃(aq)，产生乳黄色沉淀", "C. 先加过量稀硝酸 excess dilute HNO₃(aq)，再加 AgNO₃(aq)，产生乳黄色沉淀（creamy precipitate）"], "ans": 2, "exp": "必须先用过量稀硝酸（excess dilute HNO₃）中和剩余的 OH⁻（防棕黑色 Ag₂O 干扰），且绝不能用自带 Cl⁻ 的稀盐酸；AgBr 为乳黄色沉淀（creamy precipitate）。"}, {"q": "为什么 1-碘丁烷（1-iodobutane）的水解速率快于 1-氯丁烷（1-chlorobutane）？", "options": ["A. C—I 共价键的键焓最低（lowest bond enthalpy），最容易断裂", "B. C—I 键的极性比 C—Cl 键更强", "C. 1-碘丁烷分子间的范德华力（van der Waals' forces）更强"], "ans": 0, "exp": "卤代烷水解快慢由 C—X 共价键键焓（bond enthalpy）强弱决定：C—I 键最长、键焓最弱，最易断裂释放 I⁻。"}], "duration": 352.96, "audioFile": "audio/02_31.4_卤代烷碱性水解与卤素离子检验.mp3", "fullStart": 404.19, "fullEnd": 757.15}, {"id": "ep3", "epNum": "第 3 讲", "code": "31.5 (上)", "fileSlug": "03_31.5A_醇与钠反应_卤代与脱水成烯", "titleZh": "醇的反应（上）：与钠反应、四大卤代试剂与脱水成烯", "titleEn": "Reactions of Alcohols (Part A): Reaction with Sodium, Substitution to Haloalkanes & Dehydration", "goal": "掌握醇（alcohols）与金属钠反应的现象与配平，对比 HX、PX₃、PCl₅（冒白雾检验 -OH）与 SOCl₂（高纯度合成氯代烷）四大卤代试剂，并攻克仲醇脱水成烯时的顺反异构（cis-trans isomerism）计数陷阱。", "keyTerms": [{"en": "sodium alkoxide (R—O⁻Na⁺)", "zh": "醇钠（如乙醇钠）"}, {"en": "phosphorus pentachloride (PCl₅)", "zh": "五氯化磷（检 -OH 产白雾）"}, {"en": "steamy fumes / white misty fumes", "zh": "白雾（HCl(g) 标准现象词）"}, {"en": "thionyl chloride (SOCl₂)", "zh": "氯化亚砜（气态副产物易提纯）"}, {"en": "dehydration", "zh": "脱水反应（消去反应）"}], "boards": [{"id": "b3_1", "tag": "板书 1 · 醇与活泼金属 (31.5)", "title": "无水醇与金属钠（Sodium, Na）的反应及现象对比", "html": "\n                <div class=\"b-box b-blue\">\n                  <div class=\"b-box-title\">标准配平方程式（注意系数 2 : 2 ⟶ 2 : 1！）</div>\n                  <div class=\"b-eq\">2CH<sub>3</sub>CH<sub>2</sub>OH(l) + 2Na(s) <span class=\"chem-arr\"><span class=\"c-top\">room temp.</span><span class=\"a-line\">⟶</span></span> 2CH<sub>3</sub>CH<sub>2</sub>O<sup>−</sup>Na<sup>+</sup>(alc) + H<sub>2</sub>(g)</div>\n                  <ul class=\"b-points\">\n                    <li>产物名称：<code>CH₃CH₂O⁻Na⁺</code> 叫 <strong>乙醇钠（sodium ethoxide）</strong>，统称<strong>醇钠（sodium alkoxide）</strong>。</li>\n                    <li>实验现象（Observations）：钠密度大于乙醇，<strong>沉在液底（sinks to the bottom）</strong>并缓慢溶解，平稳放出<strong>无色气泡（colourless gas bubbles / effervescence）</strong>，收集气体遇明火有爆鸣声（'pop' sound）。</li>\n                    <li>⚠️ <strong>干燥红线</strong>：待测液体必须是<strong>无水干燥的（dry / anhydrous）</strong>，因为水 <code>H₂O</code> 遇钠也会剧烈放出 <code>H₂(g)</code>！</li>\n                  </ul>\n                </div>\n                ", "start": 0.25, "end": 84.873}, {"id": "b3_2", "tag": "板书 2 · 羟基变卤素四大武器库", "title": "醇转化为卤代烷（R—OH ⟶ R—X）四类核心试剂与考点对照", "html": "\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>试剂与条件</th>\n                      <th>精工课本标准方程式</th>\n                      <th>DSE 必考亮点与易错点</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong>① 卤化氢 <code>HX</code></strong><br>· 叔醇 + <code>conc. HCl</code> (室温摇晃)<br>· <code>NaBr + conc. H₂SO₄</code>, reflux<br>· <code>red P + I₂</code>, reflux</td>\n                      <td><code>(CH₃)₃COH + HCl ⟶ (CH₃)₃CCl + H₂O</code></td>\n                      <td>★ <strong>室温快检叔醇（3° alcohol）</strong>：水溶性甲基丙-2-醇与浓盐酸摇晃几分钟<strong>迅速变浑浊分层（turns cloudy）</strong>；伯醇室温无变化！<br>（制 R—I 不可用 NaI + 浓硫酸！）</td>\n                    </tr>\n                    <tr>\n                      <td><strong>② 三卤化磷 <code>PCl₃</code></strong><br>（回流加热 reflux）</td>\n                      <td><code>3ROH + PCl₃ ⟶ 3RCl + H₃PO₃</code></td>\n                      <td>注意配平系数 <strong>3 : 1 ⟶ 3 : 1</strong>，副产物是亚磷酸 <code>H₃PO₃</code>。</td>\n                    </tr>\n                    <tr>\n                      <td><strong>③ 五氯化磷 <code>PCl₅(s)</code></strong><br>（室温 r.t.，<strong>须无水！</strong>）</td>\n                      <td><code>ROH + PCl₅ ⟶ RCl + POCl₃ + HCl(g)</code></td>\n                      <td>★ <strong>检验 <code>-OH</code> 王牌测试</strong>：冒出氯化氢<strong>白雾（steamy fumes / white misty fumes）</strong>！（严禁写 white smoke！）</td>\n                    </tr>\n                    <tr>\n                      <td><strong>④ 氯化亚砜 <code>SOCl₂(l)</code></strong><br>（thionyl chloride）</td>\n                      <td><code>ROH + SOCl₂ ⟶ RCl + SO₂(g) + HCl(g)</code></td>\n                      <td>★ <strong>最佳合成提纯法</strong>：<code>SO₂(g)</code> 与 <code>HCl(g)</code> <strong>全是气体自动逸出</strong>，留下高纯度 <code>RCl</code>！（须在通风橱操作）</td>\n                    </tr>\n                  </tbody>\n                </table>\n                ", "start": 85.523, "end": 263.626}, {"id": "b3_3", "tag": "板书 3 · 催化脱水与顺反陷阱", "title": "醇的脱水成烯（Dehydration）及丁-2-醇“一醇出三烯”考官陷阱", "html": "\n                <div class=\"b-box b-amber\" style=\"margin-bottom:10px;\">\n                  <div class=\"b-box-title\">两种标准实验室脱水条件（背熟任选其一，消去一分子 H₂O！）</div>\n                  <div class=\"b-eq\">CH<sub>3</sub>CH<sub>2</sub>OH(l) <span class=\"chem-arr\"><span class=\"c-top\">excess conc. H<sub>2</sub>SO<sub>4</sub>, 180 °C</span><span class=\"a-line\">⟶</span><span class=\"c-bot\">(or heated Al<sub>2</sub>O<sub>3</sub> / porous pot, 300 °C)</span></span> CH<sub>2</sub>=CH<sub>2</sub>(g) + H<sub>2</sub>O(l)</div>\n                </div>\n                <div class=\"b-scheme\">\n<pre>★ 压轴高频陷阱：丁-2-醇 Butan-2-ol (CH₃—C²H(OH)—C³H₂—CH₃) 脱水最多生成几种烯烃？\n\n  ├─ 往左脱 C1 上的 H ──► CH₂=CHCH₂CH₃           ① 丁-1-烯 but-1-ene（=CH₂ 连两个相同 H，无顺反异构）\n  │\n  └─ 往右脱 C3 上的 H ──► CH₃CH=CHCH₃  ───┬───►  ② 顺-丁-2-烯 cis-but-2-ene\n                          （内部双键！）  └───►  ③ 反-丁-2-烯 trans-but-2-ene  👉 合计共 3 种烯烃！</pre>\n                </div>\n                <div class=\"b-note\">🚫 <strong>不能脱水的醇</strong>：甲醇 <code>CH₃OH</code>（仅 1 个碳）及 <code>(CH₃)₃C—CH₂OH</code>（相邻碳上 0 个 H，无 H 可脱！）。</div>\n                ", "start": 264.276, "end": 389.472}], "turns": [{"speaker": "teacher", "boardId": "b3_1", "displayHtml": "欢迎来到第 3 讲！从这一讲开始，我们正式解锁有机地铁网里最繁忙的换乘中心——<strong>醇（alcohols, <code>R—OH</code>）</strong>。因为它身上的羟基（hydroxyl group, <code>-OH</code>）既能断氢、又能整个替换成卤素、还能脱掉水变回烯烃，甚至还能氧化变醛和酸！由于内容超丰富，我们把醇拆成上下两讲。先看<strong>第 1 张板书</strong>：把一小块金属钠（sodium, <code>Na</code>）丢进无水乙醇（anhydrous ethanol）里，会看到什么现象？", "start": 0.25, "end": 33.048}, {"speaker": "student", "boardId": "b3_1", "displayHtml": "钠跟水反应的时候是浮在水面上四处乱窜，那丢进乙醇里也是浮着的吗？", "start": 33.408, "end": 39.302}, {"speaker": "teacher", "boardId": "b3_1", "displayHtml": "恰恰相反！乙醇密度比水小，钠的密度比乙醇大，所以钠块会<strong>沉在液底（sinks to the bottom）</strong>，反应比跟水温和得多，一边慢慢溶解，一边平稳冒出<strong>无色气泡（colourless gas bubbles）</strong>——也就是氢气 <code>H₂</code>！看方程式配平：因为 1 个氢气分子 <code>H₂</code> 需要 2 个氢原子，所以左边必须配 <code>2</code> 个乙醇加 <code>2</code> 个钠，右边生成 <code>2</code> 个<strong>乙醇钠（sodium ethoxide, <code>CH₃CH₂O⁻Na⁺</code>）</strong>和 <code>1</code> 个 <code>H₂(g)</code>。注意了，如果我想用金属钠检验某瓶液体含不含醇羟基，前提条件是什么？", "start": 39.662, "end": 73.74}, {"speaker": "student", "boardId": "b3_1", "displayHtml": "待测液体必须是<strong>无水干燥的（dry / anhydrous）</strong>！要不然里面哪怕掺了一点水，水跟钠也会冒氢气，根本分不清是谁在反应！", "start": 74.1, "end": 84.873}, {"speaker": "teacher", "boardId": "b3_2", "displayHtml": "太棒了！这个“必须无水”的铁律，同样适用于我们接下来要看的羟基变卤素反应。请看<strong>第 2 张板书</strong>：上一讲我们用 <code>NaOH(aq)</code> 把卤代烷变成了醇；反过来，想把醇的 <code>-OH</code> 换回卤素变成卤代烷（<code>R—X</code>），课本一共给了<strong>四大类试剂</strong>！第一类是卤化氢 <code>HX</code>：这里藏着一个室温鉴别<strong>叔醇（tertiary alcohol，即 3° 醇）</strong>的妙招——把水溶性的甲基丙-2-醇（methylpropan-2-ol, <code>(CH₃)₃COH</code>）跟浓盐酸（<code>conc. HCl</code>）在室温下摇晃，短短几分钟内原本清澈的溶液就会<strong>迅速变浑浊（turns cloudy）</strong>，浮出不溶于水的氯代烷油层；而伯醇如丁-1-醇在室温下根本不动弹！", "start": 85.523, "end": 128.764}, {"speaker": "student", "boardId": "b3_2", "displayHtml": "哇，连加热都不用就能把叔醇抓出来！那如果要做溴代烷和碘代烷，为什么表格里写的是 <code>NaBr + conc. H₂SO₄</code> 和红磷加碘（<code>red P + I₂</code>）呢？", "start": 129.124, "end": 141.672}, {"speaker": "teacher", "boardId": "b3_2", "displayHtml": "因为溴化氢和碘化氢不稳定，通常在烧瓶里现做现用（<em>in situ</em>）：溴化钠加浓硫酸现场生成 <code>HBr</code>；但做碘代烷时千万不能用碘化钠加浓硫酸，因为浓硫酸氧化性太强，会把碘离子氧化成紫黑色的碘单质，所以改用红磷和碘现场生成三碘化磷来反应。", "start": 142.032, "end": 162.619}, {"speaker": "student", "boardId": "b3_2", "displayHtml": "明白了！那再往下看 ② <code>PCl₃</code>、③ <code>PCl₅</code> 和 ④ <code>SOCl₂</code>，这三个都能把醇变成氯代烷 <code>R—Cl</code>，考试最爱考哪两个呀？", "start": 162.979, "end": 171.893}, {"speaker": "teacher", "boardId": "b3_2", "displayHtml": "最爱考 ③ 和 ④ 的黄金分工！先看 ③ <strong>五氯化磷固体（solid phosphorus pentachloride, <code>PCl₅(s)</code>）</strong>：它是实验室<strong>检验无水液体里含不含 <code>-OH</code> 基团的王牌测试</strong>！室温下一加进去，立刻生成氯代烷 <code>RCl</code>、液态磷酰氯 <code>POCl₃</code> 和氯化氢气体 <code>HCl(g)</code>——千万背准这三样产物，别跟 <code>PCl₃</code> 生成的亚磷酸 <code>H₃PO₃</code> 搞混！冒出来的 <code>HCl</code> 气体遇到空气里的水汽形成酸雾，英文标准现象必须写 <strong>steamy fumes</strong> 或 <strong>white misty fumes（白雾）</strong>！小琳，能写成 <em>white smoke</em> 吗？", "start": 172.253, "end": 209.719}, {"speaker": "student", "boardId": "b3_2", "displayHtml": "不能！<em>Smoke</em>（烟）是固体小颗粒，而氯化氢吸水变成的是小液滴，必须叫 <strong>steamy fumes（白雾）</strong>！而且跟钠一样，如果待测液里有水，水跟 <code>PCl₅</code> 也会冒白雾，所以也必须无水干燥！那 ④ <strong>氯化亚砜（thionyl chloride, <code>SOCl₂</code>）</strong>又厉害在哪里呢？", "start": 210.079, "end": 233.021}, {"speaker": "teacher", "boardId": "b3_2", "displayHtml": "你看 <code>SOCl₂</code> 的方程式右边：<code>ROH + SOCl₂ ⟶ RCl + SO₂(g) + HCl(g)</code>！它的两个无机副产物——二氧化硫 <code>SO₂</code> 和氯化氢 <code>HCl</code>——<strong>全都是气体（gases）</strong>，反应时自己就咕嘟咕嘟跑出烧瓶了，烧瓶里只留下纯度很高的氯代烷 <code>RCl</code>，省去了分离液态杂质 <code>POCl₃</code> 的大麻烦！当然，因为 <code>SO₂</code> 和 <code>HCl</code> 有毒有刺激性，实验必须在通风橱（fume cupboard）里做。", "start": 233.381, "end": 263.626}, {"speaker": "student", "boardId": "b3_3", "displayHtml": "一个负责检验（<code>PCl₅</code> 看白雾），一个负责提纯合成（<code>SOCl₂</code> 副产物全跑光），一下子就记牢了！接下来看<strong>第 3 张板书</strong>的<strong>脱水反应（dehydration）</strong>，就是从醇分子相邻的两个碳上脱掉一个 <code>-OH</code> 和一个 <code>-H</code> 变回烯烃吧？", "start": 264.276, "end": 282.639}, {"speaker": "teacher", "boardId": "b3_3", "displayHtml": "对极了！实验室有两套标准脱水条件，背熟任选一套都能得分：第一套是加<strong>过量浓硫酸加热到 180 摄氏度（<code>excess conc. H₂SO₄, 180 °C</code>）</strong>；第二套是让醇蒸气通过<strong>加热的氧化铝或碎素瓷片催化剂（<code>heated Al₂O₃</code> 或 <code>heated porous pot</code>，约 300 °C）</strong>。注意像甲醇 <code>CH₃OH</code> 只有 1 个碳，或者 <code>(CH₃)₃C—CH₂OH</code> 隔壁碳上连满了甲基、1 个氢都没有，这两种醇是没法脱水成烯的！", "start": 282.999, "end": 316.503}, {"speaker": "student", "boardId": "b3_3", "displayHtml": "那像板书下面画的<strong>丁-2-醇（butan-2-ol）</strong>，2 号碳上的 <code>-OH</code> 可以跟左边 1 号碳脱氢变成丁-1-烯（but-1-ene），也可以跟右边 3 号碳脱氢变成丁-2-烯（but-2-ene）——咦？我数出来明明是 2 种，为什么板书标题写着“生成 3 种烯烃”？！", "start": 316.863, "end": 339.361}, {"speaker": "teacher", "boardId": "b3_3", "displayHtml": "哈哈，赶紧调动你在 Unit 30 学过的火眼金睛！仔细瞧瞧往右脱出来的<strong>丁-2-烯（<code>CH₃CH=CHCH₃</code>）</strong>：双键不能自由旋转，而且左右两个双键碳上各自都连着两个不同的基团（一个 <code>-H</code> 和一个 <code>-CH₃</code>）！这意味着什么？它存在<strong>顺反异构（cis-trans isomerism）</strong>！必须拆成<strong>顺-丁-2-烯（cis-but-2-ene）</strong>和<strong>反-丁-2-烯（trans-but-2-ene）</strong>两种立体异构体，再加上丁-1-烯，<code>1 + 2 = 3</code> 种！以后只要遇到仲醇脱水出内部双键，一定要多问自己一句“有没有顺反异构”，瞬间甩开一半考生！下一讲，我们继续攻克醇的重头戏——氧化反应与回流、蒸馏装置！", "start": 339.721, "end": 389.472}], "quickChecks": [{"q": "为什么实验室由醇制备纯净氯代烷时，选用氯化亚砜（SOCl₂）往往比五氯化磷（PCl₅）更方便提纯？", "options": ["A. SOCl₂ 可以在水溶液中直接与醇反应", "B. SOCl₂ 反应的两种无机副产物 SO₂(g) 和 HCl(g) 均为气体，会自动逸出反应体系", "C. PCl₅ 在室温下完全不与醇反应"], "ans": 1, "exp": "ROH + SOCl₂ ⟶ RCl + SO₂(g) + HCl(g)，两种无机副产物全以气体形式逸出，省去了分离液态 POCl₃ 的步骤。"}, {"q": "丁-2-醇（butan-2-ol）通过加热的 Al₂O₃ 催化脱水时，最多可生成多少种烯烃异构体（包括顺反异构体）？", "options": ["A. 2 种（but-1-ene 与 but-2-ene）", "B. 3 种（but-1-ene、cis-but-2-ene 与 trans-but-2-ene）", "C. 4 种"], "ans": 1, "exp": "丁-1-ene 无顺反异构（1 种），而丁-2-ene 双键两端碳各连 -H 和 -CH₃，存在 cis 与 trans 两种顺反异构体，共 3 种！"}], "duration": 389.92, "audioFile": "audio/03_31.5A_醇与钠反应_卤代与脱水成烯.mp3", "fullStart": 758.65, "fullEnd": 1148.57}, {"id": "ep4", "epNum": "第 4 讲", "code": "31.5 (下)", "fileSlug": "04_31.5B_伯仲叔醇的可控氧化与回流蒸馏", "titleZh": "醇的反应（下）：伯、仲、叔醇的可控氧化与回流/蒸馏装置", "titleEn": "Reactions of Alcohols (Part B): Oxidation of 1°, 2° & 3° Alcohols and Reflux vs Distillation", "goal": "吃透伯醇（1°）、仲醇（2°）、叔醇（3°）在酸化重铬酸钾下的氧化规律，从分子间氢键（hydrogen bonding）与沸点角度解释为什么蒸馏停在醛、回流得羧酸，掌握三大装置安全红线与 [O] 方程式配平。", "keyTerms": [{"en": "acidified potassium dichromate solution", "zh": "酸化重铬酸钾溶液（橙变绿）"}, {"en": "primary / secondary / tertiary alcohol", "zh": "伯醇(1°) / 仲醇(2°) / 叔醇(3°)"}, {"en": "distillation vs heating under reflux", "zh": "蒸馏（得醛）vs 回流加热（得酸）"}, {"en": "intermolecular hydrogen bonds", "zh": "分子间氢键（决定沸点高低）"}, {"en": "anti-bumping granules", "zh": "防暴沸颗粒"}], "boards": [{"id": "b4_1", "tag": "板书 1 · 三级醇氧化总览 (31.5)", "title": "伯醇(1°)、仲醇(2°)与叔醇(3°)与酸化重铬酸钾 Cr₂O₇²⁻(aq)/H⁺(aq) 的反应", "html": "\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>醇的级别与特征</th>\n                      <th>试剂、用量与装置</th>\n                      <th>有机产物</th>\n                      <th>溶液颜色变化与底层原因</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong>伯醇 <code>1° alcohol</code></strong><br>（含 <code>-CH₂OH</code>，如乙醇）</td>\n                      <td><strong>过量醇</strong> + <code>Cr₂O₇²⁻/H⁺</code> + <strong>蒸馏 <code>distillation</code></strong></td>\n                      <td><strong>醛 Aldehyde</strong><br>（如乙醛 <code>CH₃CHO</code>）</td>\n                      <td><strong>橙色变绿色（from orange to green）</strong><br><code>Cr₂O₇²⁻</code> (橙) ⟶ <code>Cr³⁺</code> (绿)</td>\n                    </tr>\n                    <tr>\n                      <td><strong>伯醇 <code>1° alcohol</code></strong><br>（完全氧化路线）</td>\n                      <td><strong>过量 <code>Cr₂O₇²⁻/H⁺</code></strong> + <strong>回流加热 <code>reflux</code></strong></td>\n                      <td><strong>羧酸 Carboxylic acid</strong><br>（如乙酸 <code>CH₃COOH</code>）</td>\n                      <td><strong>橙色变绿色（from orange to green）</strong><br>（注：若用强氧化剂 <code>MnO₄⁻/H⁺</code> 紫变无色，只能直达羧酸，<strong>不可制醛！</strong>）</td>\n                    </tr>\n                    <tr>\n                      <td><strong>仲醇 <code>2° alcohol</code></strong><br>（含 <code>-CH(OH)-</code>，如丙-2-醇）</td>\n                      <td><code>Cr₂O₇²⁻/H⁺</code> + <strong>回流加热 <code>reflux</code></strong></td>\n                      <td><strong>酮 Ketone</strong><br>（如丙酮 <code>CH₃COCH₃</code>）</td>\n                      <td><strong>橙色变绿色（from orange to green）</strong><br>酮羰基碳无 H，不能继续氧化！</td>\n                    </tr>\n                    <tr>\n                      <td><strong>叔醇 <code>3° alcohol</code></strong><br>（含 <code>&gt;C(OH)-</code>，如甲基丙-2-醇）</td>\n                      <td><code>Cr₂O₇²⁻/H⁺</code>，共热</td>\n                      <td><strong>不反应 No reaction！</strong></td>\n                      <td><strong>保持橙色（remains orange）</strong>：连 <code>-OH</code> 的碳上<strong>没有直接相连的 H 原子</strong>！</td>\n                    </tr>\n                  </tbody>\n                </table>\n                ", "start": 0.25, "end": 103.249}, {"id": "b4_2", "tag": "板书 2 · 装置图与氢键原理", "title": "回流（Reflux）vs 蒸馏（Distillation）装置红线与分子间作用力满分答法", "html": "\n    <svg viewBox=\"0 0 820 335\" class=\"board-svg\" role=\"img\" aria-label=\"Heating under Reflux versus Distillation Comparison\">\n      <rect x=\"6\" y=\"6\" width=\"808\" height=\"323\" rx=\"12\" fill=\"#fff7ed\" stroke=\"#fed7aa\"/>\n      <text x=\"22\" y=\"31\" font-size=\"14.5\" font-weight=\"700\" fill=\"#9a3412\">精工课本王牌实验装置对比：回流加热 Heating under Reflux vs 蒸馏 Distillation</text>\n\n      <!-- LEFT: Heating under Reflux -->\n      <rect x=\"20\" y=\"46\" width=\"382\" height=\"270\" rx=\"10\" fill=\"#ffffff\" stroke=\"#ea580c\" stroke-width=\"2\"/>\n      <text x=\"211\" y=\"69\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#c2410c\">① Heating under Reflux 回流加热 → 完全氧化得羧酸 Acid</text>\n      <text x=\"156\" y=\"93\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#dc2626\">★ Top MUST be open! 顶部严禁加塞（防增压爆炸）</text>\n      <rect x=\"137\" y=\"103\" width=\"38\" height=\"102\" rx=\"6\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.8\"/>\n      <rect x=\"149\" y=\"97\" width=\"14\" height=\"118\" fill=\"#ffffff\" stroke=\"#334155\" stroke-width=\"1.8\"/>\n      <line x1=\"175\" y1=\"192\" x2=\"207\" y2=\"192\" stroke=\"#0284c7\" stroke-width=\"2.5\"/>\n      <text x=\"255\" y=\"196\" font-size=\"11\" font-weight=\"700\" fill=\"#0369a1\">← Water in 下口进冷水</text>\n      <line x1=\"175\" y1=\"118\" x2=\"207\" y2=\"118\" stroke=\"#0284c7\" stroke-width=\"2.5\"/>\n      <text x=\"258\" y=\"122\" font-size=\"11\" fill=\"#0369a1\">→ Water out 上口出水</text>\n      <circle cx=\"156\" cy=\"244\" r=\"30\" fill=\"#fed7aa\" stroke=\"#334155\" stroke-width=\"2.2\"/>\n      <circle cx=\"148\" cy=\"261\" r=\"3\" fill=\"#7c2d12\"/><circle cx=\"164\" cy=\"263\" r=\"3\" fill=\"#7c2d12\"/>\n      <text x=\"156\" y=\"290\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#dc2626\">🔥 Heat + anti-bumping granules 防暴沸颗粒</text>\n      <text x=\"211\" y=\"308\" text-anchor=\"middle\" font-size=\"10.8\" fill=\"#334155\">过量 Cr₂O₇²⁻/H⁺：蒸气冷凝流回瓶底充分氧化成 RCOOH</text>\n\n      <!-- RIGHT: Distillation -->\n      <rect x=\"418\" y=\"46\" width=\"382\" height=\"270\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0284c7\" stroke-width=\"2\"/>\n      <text x=\"609\" y=\"69\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#0369a1\">② Distillation 边反应边蒸馏 → 控制氧化停在醛 Aldehyde！</text>\n      <rect x=\"482\" y=\"98\" width=\"8\" height=\"70\" fill=\"#e2e8f0\" stroke=\"#475569\"/>\n      <circle cx=\"486\" cy=\"168\" r=\"5\" fill=\"#dc2626\"/>\n      <rect x=\"476\" y=\"148\" width=\"20\" height=\"58\" fill=\"#ffffff\" stroke=\"#334155\" stroke-width=\"1.8\"/>\n      <circle cx=\"486\" cy=\"234\" r=\"29\" fill=\"#fde68a\" stroke=\"#334155\" stroke-width=\"2.2\"/>\n      <text x=\"486\" y=\"279\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#dc2626\">🔥 Heat (过量伯醇 + 酸化重铬酸钾)</text>\n      <g transform=\"translate(496, 165) rotate(24)\">\n        <rect x=\"18\" y=\"-12\" width=\"126\" height=\"25\" rx=\"5\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.6\"/>\n        <rect x=\"0\" y=\"-4\" width=\"164\" height=\"10\" fill=\"#ffffff\" stroke=\"#334155\" stroke-width=\"1.6\"/>\n      </g>\n      <rect x=\"656\" y=\"220\" width=\"40\" height=\"50\" rx=\"8\" fill=\"#dcfce7\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n      <text x=\"676\" y=\"249\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#15803d\">Aldehyde</text>\n      <text x=\"609\" y=\"295\" text-anchor=\"middle\" font-size=\"10.8\" font-weight=\"600\" fill=\"#0369a1\">醛无 -OH、无分子间氢键，沸点最低（乙醛仅 20.2 °C）</text>\n      <text x=\"609\" y=\"310\" text-anchor=\"middle\" font-size=\"10.8\" fill=\"#334155\">一生成立刻气化蒸出，脱离氧化剂避免进一步氧化！</text>\n    </svg>\n    ", "start": 103.899, "end": 239.586}, {"id": "b4_3", "tag": "板书 3 · [O] 配平特训与生活化学", "title": "氧化方程式原子守恒配平（切勿漏写 2[O] 与 + H₂O！）及生活应用", "html": "\n                <div class=\"b-box b-blue\" style=\"margin-bottom:10px;\">\n                  <div class=\"b-box-title\">用 [O] 代表来自氧化剂的氧原子 —— 三大必背标准方程式</div>\n                  <div class=\"b-eq\">① 伯醇制醛（1步脱2H）：CH<sub>3</sub>CH<sub>2</sub>OH(l) + <strong>[O]</strong> <span class=\"chem-arr\"><span class=\"c-top\">Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup>/H<sup>+</sup>, distillation</span><span class=\"a-line\">⟶</span></span> CH<sub>3</sub>CHO(g) + <strong>H<sub>2</sub>O(l)</strong></div>\n                  <div class=\"b-eq\">② 伯醇制酸（脱氢+插氧）：CH<sub>3</sub>CH<sub>2</sub>OH(l) + <strong>2[O]</strong> <span class=\"chem-arr\"><span class=\"c-top\">excess Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup>/H<sup>+</sup>, reflux</span><span class=\"a-line\">⟶</span></span> CH<sub>3</sub>COOH(aq) + <strong>H<sub>2</sub>O(l)</strong></div>\n                  <div class=\"b-eq\">③ 仲醇制酮（1步脱2H）：CH<sub>3</sub>CH(OH)CH<sub>3</sub>(l) + <strong>[O]</strong> <span class=\"chem-arr\"><span class=\"c-top\">Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup>/H<sup>+</sup>, reflux</span><span class=\"a-line\">⟶</span></span> CH<sub>3</sub>COCH<sub>3</sub>(aq) + <strong>H<sub>2</sub>O(l)</strong></div>\n                </div>\n                <div class=\"board-grid-2\">\n                  <div class=\"b-box b-amber\">\n                    <div class=\"b-box-title\">🚓 呼气酒精测试仪 Breathalyzer</div>\n                    <p class=\"b-tip-text\">硅胶浸有橙色酸化重铬酸钾晶体，司机呼出的乙醇将其还原，晶体<strong>由橙变绿（orange to green）</strong>。</p>\n                  </div>\n                  <div class=\"b-box b-rose\">\n                    <div class=\"b-box-title\">🍷 葡萄酒敞口变酸 Souring of Wine</div>\n                    <p class=\"b-tip-text\">空气中的<strong>微生物/细菌（microbes/bacteria）</strong>催化氧气（aerial oxidation）将乙醇氧化为酸味的乙酸。</p>\n                  </div>\n                </div>\n                ", "start": 240.236, "end": 344.002}], "turns": [{"speaker": "teacher", "boardId": "b4_1", "displayHtml": "欢迎来到第 4 讲！这一讲我们要攻克整个 Unit 31 考频最高、也是实验题最爱出大题的王牌考点——<strong>醇的氧化反应（oxidation of alcohols）</strong>。请先看<strong>第 1 张板书</strong>：实验室氧化醇最核心的试剂叫<strong>酸化重铬酸钾溶液（acidified potassium dichromate solution, <code>Cr₂O₇²⁻(aq)/H⁺(aq)</code>）</strong>。小琳，只要它成功把别人氧化了，溶液颜色会发生什么标志性变化？", "start": 0.25, "end": 26.745}, {"speaker": "student", "boardId": "b4_1", "displayHtml": "橙色的重铬酸根离子 <code>Cr₂O₇²⁻</code> 会被还原成绿色的三价铬离子 <code>Cr³⁺</code>，所以溶液会<strong>由橙色变为绿色（from orange to green）</strong>！那如果用更猛的酸化高锰酸钾溶液（acidified potassium permanganate, <code>MnO₄⁻/H⁺</code>）呢？", "start": 27.105, "end": 41.427}, {"speaker": "teacher", "boardId": "b4_1", "displayHtml": "酸化高锰酸钾反应时是<strong>由紫色变为无色（from purple to colourless）</strong>，但它的脾气太暴躁了——只要碰到伯醇，不管你怎么控制，它都会一口气直接氧化到底变成羧酸，<strong>绝对不能用来制备醛</strong>！所以需要精准控场的时候，我们一律首选温和可控的酸化重铬酸钾。你看表格里的三级醇：<strong>伯醇（primary alcohol, 1° 醇）</strong>走两步，先变醛（aldehyde）再变羧酸（carboxylic acid）；<strong>仲醇（secondary alcohol, 2° 醇）</strong>如丙-2-醇，回流加热氧化生成酮（ketone），酮就到头了，不能再继续氧化；唯独<strong>叔醇（tertiary alcohol, 3° 醇）</strong>，放进去加热一点动静都没有，溶液保持橙色！知道为什么叔醇这么铁石心肠吗？", "start": 41.787, "end": 89.601}, {"speaker": "student", "boardId": "b4_1", "displayHtml": "因为醇氧化的第一步是要从羟基 <code>-OH</code> 和连着羟基的那个碳原子上各拔掉 1 个氢原子凑成水，而叔醇连着 <code>-OH</code> 的那个碳被三个碳基团包得死死的，<strong>上面连 1 个氢原子都没有</strong>！", "start": 89.961, "end": 103.249}, {"speaker": "teacher", "boardId": "b4_2", "displayHtml": "一语中的！现在把目光移到<strong>第 2 张板书</strong>的精工原版装置对比图——这就像煎鸡蛋一样：想把伯醇（比如乙醇 ethanol，沸点 78 °C）做成全熟的<strong>乙酸（ethanoic acid，沸点 118 °C）</strong>，我们就用<strong>左边这套回流加热装置（heating under reflux）</strong>，加上<strong>过量的酸化重铬酸钾</strong>，蒸气一往上跑就被垂直冷凝管摁回锅里死磕到底；但如果我们只想停在半熟的“溏心蛋”——<strong>乙醛（ethanal，沸点只有 20.2 °C）</strong>，就必须换用<strong>右边这套边反应边蒸馏装置（distillation）</strong>，并且让<strong>乙醇过量</strong>！", "start": 103.899, "end": 142.431}, {"speaker": "student", "boardId": "b4_2", "displayHtml": "老师，如果考官在长题里问：<em>Explain in terms of intermolecular forces why distillation allows ethanal to be isolated before further oxidation</em>（从分子间作用力角度解释为什么蒸馏能把乙醛提前分离出来），我只答“因为乙醛沸点最低”能拿满分吗？", "start": 142.791, "end": 160.972}, {"speaker": "teacher", "boardId": "b4_2", "displayHtml": "只答沸点低会直接丢掉最关键的结构分！必须把分子间作用力点透：<strong>乙醛（ethanal）分子里没有 <code>-OH</code> 基团，分子间只有微弱的范德华力（weak van der Waals' forces），不能形成分子间氢键（cannot form intermolecular hydrogen bonds）；而乙醇和乙酸分子间都有强大的分子间氢键</strong>！因此乙醛沸点最低，只要把加热温度控制在高于乙醛沸点、低于乙醇沸点，乙醛刚一生成就会立刻气化蒸出反应体系，脱离氧化剂逃进冰水浴接收瓶里！", "start": 161.332, "end": 194.181}, {"speaker": "student", "boardId": "b4_2", "displayHtml": "太清晰了！我还在图上看到了三个红色警示标：① 左边回流冷凝管<strong>顶部绝对不能塞塞子（NEVER stopper the top）</strong>；② 冷凝水必须<strong>下口进、上口出（water in at the bottom, water out at the top）</strong>；③ 烧瓶底要放几粒<strong>防暴沸颗粒（anti-bumping granules）</strong>！", "start": 194.541, "end": 215.952}, {"speaker": "teacher", "boardId": "b4_2", "displayHtml": "对！这三个实验细节几乎年年轮流考：顶部一旦加塞变成密闭系统，受热气压飙升会炸裂仪器（pressure build-up / explosion）；下口进水是为了抵抗重力让整个冷凝管水夹套充满冷水（completely filled with cold water），冷凝效率最高；防暴沸颗粒则是防止液体局部过热暴沸喷溅。", "start": 216.312, "end": 239.586}, {"speaker": "student", "boardId": "b4_3", "displayHtml": "陈老师，我看<strong>第 3 张板书</strong>写氧化方程式的时候，用方括号 <code>[O]</code> 代表来自氧化剂的氧原子。但我有个地方以前老写错：乙醇 <code>CH₃CH₂OH</code> 变成乙酸 <code>CH₃COOH</code>，看上去不就是多了 1 个氧吗？为什么方程式左边非要写 <code>2[O]</code>，右边还要加 <code>H₂O</code> 呢？", "start": 240.236, "end": 259.094}, {"speaker": "teacher", "boardId": "b4_3", "displayHtml": "你问出了十个同学有五个会丢分的配平盲区！来，我们对着板书数氢原子：左边的乙醇 <code>CH₃CH₂OH</code> 一共有 <code>3 + 2 + 1 = 6</code> 个氢原子；而右边的乙酸 <code>CH₃COOH</code> 只有 <code>3 + 1 = 4</code> 个氢原子！少掉的那 2 个氢去哪儿了？第一个 <code>[O]</code> 把那 2 个氢抓走生成了 <code>1</code> 分子水 <code>H₂O</code>（这时候乙醇先变成了乙醛 <code>CH₃CHO</code>）；紧接着第二个 <code>[O]</code> 再插进乙醛里变成乙酸 <code>CH₃COOH</code>！所以两步合起来，左边必须消耗 <strong><code>2[O]</code></strong>，右边必须写上 <strong><code>+ H₂O</code></strong>！以后写完随手数一眼左右氢原子和氧原子总数，永远一分不丢！", "start": 259.454, "end": 298.794}, {"speaker": "student", "boardId": "b4_3", "displayHtml": "原来第一个 <code>[O]</code> 负责拔氢造水，第二个 <code>[O]</code> 负责插氧成酸！这样拆成两步想，再也不可能漏掉 <code>2[O]</code> 和 <code>H₂O</code> 了！", "start": 299.154, "end": 308.714}, {"speaker": "teacher", "boardId": "b4_3", "displayHtml": "最后顺带看一眼板书底下的两个生活小常识：① 警察查酒驾的传统化学式<strong>呼气酒精测试仪（breathalyzer）</strong>，里面装的就是橙色的酸化重铬酸钾晶体，遇到呼出的乙醇蒸气就由橙变绿；② 红酒或啤酒开瓶放久了变酸（souring of wine），是因为空气里的<strong>微生物或细菌（microbes / bacteria）</strong>催化空气中的氧气，把乙醇缓慢氧化成了带酸味的乙酸。好啦，醇氧化生成的醛、酮和羧酸已经登场，下一讲我们就看看它们又有哪些看家本领！", "start": 309.074, "end": 344.002}], "quickChecks": [{"q": "将乙醇（沸点 78 °C）氧化制备乙醛（沸点 20.2 °C）时，为什么蒸馏装置能防止乙醛继续被氧化为乙酸？", "options": ["A. 乙醛分子间不能形成氢键（no intermolecular H-bonds），沸点远低于乙醇和乙酸，一生成即蒸出脱离氧化剂", "B. 乙醛分子质量最大，留在烧瓶底部不与氧化剂接触", "C. 酸化高锰酸钾溶液在蒸馏时失去氧化性"], "ans": 0, "exp": "乙醛无 -OH，分子间仅靠弱范德华力结合（无分子间氢键），沸点最低，在蒸馏装置中一生成便立即气化蒸出。"}, {"q": "下列哪一个是乙醇完全氧化生成乙酸的正确配平方程式？", "options": ["A. CH₃CH₂OH + [O] ⟶ CH₃COOH", "B. CH₃CH₂OH + 2[O] ⟶ CH₃COOH + H₂O", "C. CH₃CH₂OH + [O] ⟶ CH₃COOH + H₂"], "ans": 1, "exp": "核对原子守恒：左边 C₂H₆O + 2[O]（6H, 3O），右边 CH₃COOH + H₂O（6H, 3O），必须消耗 2[O] 并生成 1 分子 H₂O！"}], "duration": 344.45, "audioFile": "audio/04_31.5B_伯仲叔醇的可控氧化与回流蒸馏.mp3", "fullStart": 1150.07, "fullEnd": 1494.53}, {"id": "ep5", "epNum": "第 5 讲", "code": "31.6 – 31.7", "fileSlug": "05_31.6-31.7_醛酮还原与羧酸四大反应", "titleZh": "醛、酮的鉴别还原与羧酸的四大核心反应", "titleEn": "Reactions of Aldehydes, Ketones & Carboxylic Acids: Selective Reduction, Esterification & Amides", "goal": "掌握温热酸化重铬酸钾鉴别醛与酮，彻底分清温和还原剂 NaBH₄(aq) 与强还原剂 LiAlH₄（分两步无水操作）的选择性差异，背熟羧酸的 NaHCO₃ 冒泡鉴别、可逆酯化反应（⇌）及经酰氯两步制酰胺。", "keyTerms": [{"en": "sodium borohydride (NaBH₄)", "zh": "硼氢化钠（温和还原剂，只还原醛/酮）"}, {"en": "lithium aluminium hydride (LiAlH₄)", "zh": "氢化铝锂（强还原剂，需 dry ether）"}, {"en": "sodium hydrogencarbonate (NaHCO₃)", "zh": "碳酸氢钠（检验 -COOH 冒 CO₂）"}, {"en": "esterification (⇌)", "zh": "酯化反应（必须画可逆号 ⇌）"}, {"en": "acyl chloride (RCOCl)", "zh": "酰氯（羧酸制酰胺的高活性跳板）"}], "boards": [{"id": "b5_1", "tag": "板书 1 · 醛酮鉴别与还原两兄弟 (31.6)", "title": "醛酮鉴别  |  温和水性“小绵羊” NaBH₄(aq) vs 狂暴恐水“霸王龙” LiAlH₄", "html": "\n                <div class=\"b-box b-amber\" style=\"margin-bottom:10px;\">\n                  <div class=\"b-box-title\">🔍 鉴别醛（Aldehyde, RCHO）与酮（Ketone, RCOR'）的标准化学测试</div>\n                  <p class=\"b-tip-text\">与<strong>酸化重铬酸钾溶液（acidified K₂Cr₂O₇(aq)）共热（warm）</strong>：<strong>醛</strong>被氧化为羧酸（<code>RCHO + [O] ⟶ RCOOH</code>），溶液<strong>由橙色变绿色（from orange to green）</strong>；<strong>酮</strong>不反应，保持橙色！</p>\n                </div>\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>还原剂与必须遵守的标准写法</th>\n                      <th>醛 RCHO / 酮 RCOR'</th>\n                      <th>羧酸 -COOH / 酯 -COOR'</th>\n                      <th>碳碳双键 C=C</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong><code>NaBH₄(aq)</code></strong>（硼氢化钠水溶液，温和安全）</td>\n                      <td>✅ 还原为 1° / 2° 醇</td>\n                      <td>❌ <strong>不反应！</strong></td>\n                      <td>❌ 不反应（需 H₂/Pt）</td>\n                    </tr>\n                    <tr>\n                      <td><strong><code>1. LiAlH₄, dry ether</code></strong><br><strong><code>2. H⁺(aq)</code></strong>（⚠️ 严禁一步混写！遇水爆炸！）</td>\n                      <td>✅ 还原为 1° / 2° 醇</td>\n                      <td>✅ <strong>强力还原为醇！</strong><br><code>RCOOH + 4[H] ⟶ RCH₂OH + H₂O</code></td>\n                      <td>❌ 不反应（需 H₂/Pt）</td>\n                    </tr>\n                  </tbody>\n                </table>\n                <div class=\"b-note\" style=\"margin-top:8px;\">💡 <strong>双官能团秒杀例</strong>：<code>CH₃COCH₂COOH</code> 加 <code>NaBH₄(aq)</code> ➔ 只变酮得 <code>CH₃CH(OH)CH₂COOH</code>；加 <code>LiAlH₄</code> ➔ 两头全变得 <code>CH₃CH(OH)CH₂CH₂OH</code>！</div>\n                ", "start": 0.25, "end": 167.429}, {"id": "b5_2", "tag": "板书 2 · 羧酸弱酸性与王牌鉴别 (31.7)", "title": "为什么鉴别醇（R—OH）与羧酸（R—COOH）必须认准 NaHCO₃(aq) / Na₂CO₃(aq)？", "html": "\n                <div class=\"b-box b-blue\" style=\"margin-bottom:10px;\">\n                  <div class=\"b-box-title\">羧酸检验黄金方程式（产生无色气泡 CO₂，使石灰水变浑浊）</div>\n                  <div class=\"b-eq\">CH<sub>3</sub>COOH(aq) + NaHCO<sub>3</sub>(aq) <span class=\"chem-arr\"><span class=\"a-line\">⟶</span></span> CH<sub>3</sub>COO<sup>−</sup>Na<sup>+</sup>(aq) + H<sub>2</sub>O(l) + CO<sub>2</sub>(g)</div>\n                </div>\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr><th>候选鉴别试剂</th><th>无水丙-1-醇 (propan-1-ol)</th><th>无水丙酸 (propanoic acid)</th><th>能否鉴别？</th></tr>\n                  </thead>\n                  <tbody>\n                    <tr><td>金属钠 <code>Na(s)</code></td><td>冒无色气泡 <code>H₂(g)</code></td><td>冒无色气泡 <code>H₂(g)</code></td><td>❌ 不能（均含 -OH）</td></tr>\n                    <tr><td>五氯化磷 <code>PCl₅(s)</code></td><td>冒白雾 <code>steamy fumes</code></td><td>冒白雾 <code>steamy fumes</code></td><td>❌ 不能（均含 -OH）</td></tr>\n                    <tr><td><strong><code>NaHCO₃(aq)</code> / <code>Na₂CO₃(aq)</code></strong></td><td>无明显变化（中性！）</td><td><strong>冒无色气泡 <code>effervescence</code></strong></td><td>✅ <strong>一招锁定羧酸！</strong></td></tr>\n                  </tbody>\n                </table>\n                ", "start": 168.079, "end": 220.909}, {"id": "b5_3", "tag": "板书 3 · 酯化反应与两步制酰胺", "title": "可逆酯化反应（Esterification ⇌） & 经酰氯（Acyl Chloride）室温两步制酰胺", "html": "\n                <div class=\"b-box b-teal\" style=\"margin-bottom:10px;\">\n                  <div class=\"b-box-title\">① 酯化反应（MUST 画可逆号 ⇌ ！命名铁律：醇变 alkyl 在前，酸变 alkanoate 在后！）</div>\n                  <div class=\"b-eq\">CH<sub>3</sub>CH<sub>2</sub>COOH(l) + CH<sub>3</sub>OH(l) <span class=\"chem-arr\"><span class=\"c-top\">conc. H<sub>2</sub>SO<sub>4</sub></span><span class=\"a-line\">⇌</span><span class=\"c-bot\">heat under reflux</span></span> CH<sub>3</sub>CH<sub>2</sub>COOCH<sub>3</sub>(l) + H<sub>2</sub>O(l)</div>\n                  <ul class=\"b-points\">\n                    <li>产物命名：丙酸 + 甲醇 ➔ <strong>丙酸甲酯（methyl propanoate）</strong>（切勿写反成 propyl methanoate！）。</li>\n                    <li><strong>浓硫酸双重作用 [2M]</strong>：① 作<strong>催化剂（catalyst）</strong>加快反应；② 作<strong>吸水剂（dehydrating agent）</strong>除去水使可逆平衡右移，提高酯产率。</li>\n                    <li>倒入 <code>Na₂CO₃(aq)</code> 现象：<strong>甜美果香味（sweet fruity smell）</strong> + 水面浮出<strong>不溶无色油状层（insoluble oily layer）</strong> + 除酸冒泡。</li>\n                  </ul>\n                </div>\n                <div class=\"b-box b-rose\">\n                  <div class=\"b-box-title\">② 羧酸转化为未取代酰胺（Unsubstituted Amide, RCONH₂）—— 必须分两步走！</div>\n                  <div class=\"b-eq\">RCOOH <span class=\"chem-arr\"><span class=\"c-top\">Step 1: SOCl<sub>2</sub> (or PCl<sub>5</sub>)</span><span class=\"a-line\">⟶</span></span> RCOCl (酰氯 acyl chloride) <span class=\"chem-arr\"><span class=\"c-top\">Step 2: NH<sub>3</sub></span><span class=\"a-line\">⟶</span></span> RCONH<sub>2</sub> + HCl</div>\n                  <p class=\"b-tip-text\">⚠️ <strong>为什么不能直接把 <code>RCOOH + NH₃(aq)</code> 混合？</strong>室温直接混合只发生酸碱中和生成离子盐<strong>羧酸铵（<code>RCOO⁻NH₄⁺</code>）</strong>，得不到酰胺！</p>\n                </div>\n                ", "start": 221.559, "end": 345.138}], "turns": [{"speaker": "teacher", "boardId": "b5_1", "displayHtml": "欢迎来到第 5 讲！上一讲我们把伯醇和仲醇氧化成了<strong>醛（aldehydes, <code>RCHO</code>）</strong>、<strong>酮（ketones, <code>RCOR'</code>）</strong>和<strong>羧酸（carboxylic acids, <code>RCOOH</code>）</strong>。先看<strong>第 1 张板书</strong>：如果桌上有两瓶未知液体，一瓶是丙醛（propanal），一瓶是丙酮（propanone），在 HKDSE 标准考卷里，用什么试剂一步就能把它们区分开？", "start": 0.25, "end": 22.535}, {"speaker": "student", "boardId": "b5_1", "displayHtml": "用上一讲刚学的<strong>酸化重铬酸钾溶液（acidified potassium dichromate solution）共热</strong>！丙醛还能继续被氧化成丙酸，让溶液<strong>由橙色变绿色（from orange to green）</strong>；而丙酮已经氧化不动了，溶液保持橙色！", "start": 22.895, "end": 39.613}, {"speaker": "teacher", "boardId": "b5_1", "displayHtml": "稳准狠！那反过来，如果我们想把醛和酮倒车退回醇，这就是<strong>还原反应（reduction）</strong>，方程式里用方括号 <code>[H]</code> 代表来自还原剂的氢原子：醛加 <code>2[H]</code> 退回伯醇，酮加 <code>2[H]</code> 退回仲醇。请盯紧板书表格里的<strong>还原剂两兄弟</strong>——它们脾气天差地别！弟弟叫<strong>硼氢化钠水溶液（aqueous sodium borohydride, <code>NaBH₄(aq)</code>）</strong>，是个温和的“小绵羊”，不怕水，直接在烧杯水溶液里就能把醛和酮还原成醇；但它力气小，遇到顽固的羧酸（<code>-COOH</code>）和酯（<code>-COOR'</code>）完全推不动！", "start": 39.973, "end": 75.941}, {"speaker": "student", "boardId": "b5_1", "displayHtml": "那表格下面那位哥哥——<strong>氢化铝锂（lithium aluminium hydride, <code>LiAlH₄</code>）</strong>就是力大无穷的“霸王龙”了吧？我看它连羧酸和酯都能还原成醇！不过老师，为什么它的反应条件必须标上序号写成 <code>1. LiAlH₄, dry ether</code>，换行再写 <code>2. H⁺(aq)</code>，不能写在一块儿呢？", "start": 76.301, "end": 99.145}, {"speaker": "teacher", "boardId": "b5_1", "displayHtml": "这可是阅卷场的“生死红线”！因为氢化铝锂 <code>LiAlH₄</code> 极其恐水，一旦直接碰到水或酸就会剧烈反应甚至起火爆炸！所以<strong>第一步必须关在绝对干燥的无水乙醚（<code>dry ether</code>）</strong>里完成还原，等反应结束了，<strong>第二步再加稀酸（<code>H⁺(aq)</code>）</strong>把生成的醇释放出来。谁要是在考卷上不标 <code>1</code> 和 <code>2</code> 直接混写在一起，哪怕产物画对了，试剂分也会直接扣光！", "start": 99.505, "end": 126.189}, {"speaker": "student", "boardId": "b5_1", "displayHtml": "哇，我马上拿荧光笔圈起来！而且我看板书底下的双官能团例子超妙：如果一个分子一头是酮羰基、一头是羧基（比如 <code>CH₃COCH₂COOH</code>），加 <code>NaBH₄(aq)</code> 就只还原酮、保留羧基不变；加 <code>LiAlH₄</code> 就把两头全都还原成醇！顺便确认一下，它俩都不会碰碳碳双键 <code>C=C</code> 对吧？", "start": 126.549, "end": 148.815}, {"speaker": "teacher", "boardId": "b5_1", "displayHtml": "一百分！碳碳双键 <code>C=C</code> 只认催化加氢（<code>H₂ / Pt</code>），<code>NaBH₄</code> 和 <code>LiAlH₄</code> 都专门盯着含氧极性重键看，绝不碰 <code>C=C</code>！顺便记准羧酸被 <code>LiAlH₄</code> 还原成伯醇的配平：<code>RCOOH + 4[H] ⟶ RCH₂OH + H₂O</code>，消耗 <code>4</code> 个 <code>[H]</code> 并生成 <code>1</code> 分子水。", "start": 149.175, "end": 167.429}, {"speaker": "student", "boardId": "b5_2", "displayHtml": "好清晰！接下来看<strong>第 2 张板书</strong>的羧酸（carboxylic acids, <code>-COOH</code>）。陈老师，如果有两瓶没贴标签的无水液体，分别是丙-1-醇（propan-1-ol）和丙酸（propanoic acid），我能不能加固体 <code>PCl₅</code> 看谁冒白雾来区分它们呀？", "start": 168.079, "end": 183.445}, {"speaker": "teacher", "boardId": "b5_2", "displayHtml": "小心掉坑！你仔细看羧基 <code>-COOH</code> 的结构——它尾巴上是不是也挂着一个 <code>-OH</code>？所以不论是醇还是羧酸，遇到金属钠 <code>Na</code> 都会冒氢气气泡，遇到固体 <code>PCl₅</code> 都会冒氯化氢白雾，根本分不开！想一招把羧酸抓出来，必须利用它独有的<strong>弱酸性（weak acid）</strong>：加入<strong>碳酸氢钠溶液（<code>NaHCO₃(aq)</code>）或碳酸钠溶液（<code>Na₂CO₃(aq)</code>）</strong>！只有羧酸会反应放出<strong>无色二氧化碳气泡（colourless gas bubbles / effervescence）</strong>，而中性的醇、酯、醛、酮全都毫无动静！", "start": 183.805, "end": 220.909}, {"speaker": "student", "boardId": "b5_3", "displayHtml": "对哦！羧基里也藏着一个 <code>-OH</code>，只有小苏打 <code>NaHCO₃</code> 只认酸不认醇！再看<strong>第 3 张板书</strong>上半部分的<strong>酯化反应（esterification）</strong>：羧酸和醇在浓硫酸（<code>conc. H₂SO₄</code>）回流加热下生成酯和水——老师特意标了必须画<strong>可逆箭头 <code>⇌</code></strong>！", "start": 221.559, "end": 239.348}, {"speaker": "teacher", "boardId": "b5_3", "displayHtml": "没错！酯化反应是经典的可逆反应（reversible reaction），写成单向箭头直接扣分，右边的 <code>+ H₂O</code> 也千万别漏！这里有三个必背得分点：第一，<strong>浓硫酸有两个作用</strong>——既做<strong>催化剂（catalyst）</strong>加快反应速率，又做<strong>吸水剂（dehydrating agent）</strong>抽走生成的水，推动可逆平衡向右移动以提高酯的产率；第二，反应完把混合液倒进碳酸钠溶液里，不仅能中和残酸冒泡，还能闻到<strong>甜美果香味（sweet fruity smell）</strong>，并看到水面上浮出一层<strong>不溶于水的无色油状液体（insoluble colourless oily layer）</strong>；第三，命名别写反——丙酸（propanoic acid）加甲醇（methanol），来自醇的甲基 <code>methyl</code> 在前，来自酸的丙酸根 <code>propanoate</code> 在后，合起来叫 <strong>methyl propanoate（丙酸甲酯）</strong>！", "start": 239.708, "end": 290.161}, {"speaker": "student", "boardId": "b5_3", "displayHtml": "醇变 alkyl 在前，酸变 alkanoate 在后，记死啦！那板书下半部分把羧酸变成<strong>未取代酰胺（unsubstituted amide, <code>RCONH₂</code>）</strong>，既然羧酸是酸、氨水 <code>NH₃(aq)</code> 是碱，为什么不直接把羧酸和氨水混在一起一步做成酰胺呢？", "start": 290.521, "end": 307.721}, {"speaker": "teacher", "boardId": "b5_3", "displayHtml": "你正好点破了原因：正因为一个是酸、一个是碱，室温下一混合，它们直接发生最简单的酸碱中和，生成离子盐——<strong>羧酸铵（ammonium carboxylate, <code>RCOO⁻NH₄⁺</code>）</strong>就停住了！要想在室温下高效合成酰胺，必须走<strong>黄金两步法</strong>：第一步先加氯化亚砜 <code>SOCl₂</code> 或五氯化磷 <code>PCl₅</code>，把迟钝的 <code>-COOH</code> 变成超级活泼的<strong>酰氯（acyl chloride, <code>RCOCl</code>）</strong>；第二步再通入氨气或浓氨水 <code>NH₃</code>，瞬间就能生成未取代酰胺 <code>RCONH₂</code>！好啦，最后一讲第 6 讲，我们就用一把“酸碱剪刀”把酯和酰胺剪开，完成整个 Unit 31 的大满贯闭环！", "start": 308.081, "end": 345.138}], "quickChecks": [{"q": "化合物 OHC—CH₂—COOH（同时含醛基 -CHO 与羧基 -COOH）与 NaBH₄(aq) 完全反应后，有机产物是什么？", "options": ["A. HOCH₂—CH₂—COOH（只还原醛基，羧基不变）", "B. HOCH₂—CH₂—CH₂OH（醛基与羧基全部被还原）", "C. HOOC—CH₂—COOH"], "ans": 0, "exp": "NaBH₄(aq) 是温和还原剂，只能将醛基 -CHO 还原为 -CH₂OH，不能还原羧基 -COOH（若用 1. LiAlH₄, dry ether / 2. H⁺(aq) 则选 B）。"}, {"q": "一步鉴别无水丙-1-醇（propan-1-ol）与无水丙酸（propanoic acid）应选用下列哪种试剂？", "options": ["A. 固体五氯化磷 PCl₅(s)", "B. 金属钠 Na(s)", "C. 碳酸氢钠水溶液 NaHCO₃(aq)"], "ans": 2, "exp": "醇与羧酸均含 -OH，遇到 PCl₅(s) 和 Na(s) 都会反应；只有 NaHCO₃(aq) 仅与弱酸性的丙酸反应放出无色气泡 CO₂(g)。"}], "duration": 345.59, "audioFile": "audio/05_31.6-31.7_醛酮还原与羧酸四大反应.mp3", "fullStart": 1496.03, "fullEnd": 1841.61}, {"id": "ep6", "epNum": "第 6 讲", "code": "31.8 – 31.9", "fileSlug": "06_31.8-31.9_酯与未取代酰胺的酸碱水解", "titleZh": "酯与未取代酰胺的水解反应（酸碱介质产物铁律与全局贯通）", "titleEn": "Hydrolysis of Esters & Unsubstituted Amides: Acid vs Alkaline Rules & Unit 31 Synthesis Map", "goal": "吃透酯（esters）与未取代酰胺（unsubstituted amides）在酸性和碱性回流下的水解方程式与可逆性差异，死死锁住“酸中无氨气、碱中无游离酸、醇见 NaOH 不变盐”终极铁律，并贯通 Unit 31 全局转化网。", "keyTerms": [{"en": "acid hydrolysis (⇌ for ester)", "zh": "酸性水解（酯可逆，酰胺不可逆）"}, {"en": "alkaline hydrolysis / saponification", "zh": "碱性水解 / 皂化反应（不可逆 ⟶）"}, {"en": "carboxylate salt (RCOO⁻Na⁺)", "zh": "羧酸盐（碱水解直接产物）"}, {"en": "unsubstituted amide (RCONH₂)", "zh": "未取代酰胺（碱水解加热放 NH₃）"}, {"en": "moist red litmus paper turns blue", "zh": "湿润红色石蕊试纸变蓝（检 NH₃）"}], "boards": [{"id": "b6_1", "tag": "板书 1 · 酯的酸碱水解对比 (31.8)", "title": "酯的水解（Hydrolysis of Esters）：可逆酸水解（⇌） vs 不可逆皂化反应（⟶）", "html": "\n                <table class=\"b-mini-table\">\n                  <thead>\n                    <tr>\n                      <th>对比维度（以乙酸乙酯为例）</th>\n                      <th>酸性水解 Acid Hydrolysis</th>\n                      <th>碱性水解 / 皂化反应 Saponification</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td><strong>试剂与条件</strong></td>\n                      <td><code>dilute H₂SO₄(aq)</code> / <code>HCl(aq)</code>, <code>heat under reflux</code></td>\n                      <td><code>NaOH(aq)</code> / <code>KOH(aq)</code>, <code>heat under reflux</code></td>\n                    </tr>\n                    <tr>\n                      <td><strong>可逆性与产率</strong></td>\n                      <td><strong>可逆反应（必须画 <code>⇌</code>）</strong>，反应不完全，产率较低</td>\n                      <td><strong>不可逆反应（单向箭头 <code>⟶</code>）</strong>，进行到底，<strong>产率更高！</strong></td>\n                    </tr>\n                    <tr>\n                      <td><strong>标准方程式</strong></td>\n                      <td><code>CH₃COOCH₂CH₃ + H₂O ⇌ CH₃COOH + CH₃CH₂OH</code></td>\n                      <td><code>CH₃COOCH₂CH₃ + NaOH ⟶ <strong>CH₃COO⁻Na⁺</strong> + CH₃CH₂OH</code></td>\n                    </tr>\n                    <tr>\n                      <td><strong>如何拿回游离酸？</strong></td>\n                      <td>已直接生成游离酸（但混有未反应的酯）</td>\n                      <td>回流后加入<strong>过量稀盐酸 <code>excess dilute HCl(aq)</code></strong> 酸化：<br><code>CH₃COO⁻(aq) + H⁺(aq) ⟶ CH₃COOH(aq)</code></td>\n                    </tr>\n                  </tbody>\n                </table>\n                <div class=\"b-note\" style=\"margin-top:8px;\">🚫 <strong>天坑预警</strong>：乙醇 <code>CH₃CH₂OH</code> 显中性，<strong>绝不会</strong>与 <code>NaOH(aq)</code> 反应生成乙醇钠（只有金属钠 <code>Na(s)</code> 才能造乙醇钠）！</div>\n                ", "start": 0.25, "end": 141.659}, {"id": "b6_2", "tag": "板书 2 · 未取代酰胺的酸碱水解 (31.9)", "title": "未取代酰胺（RCONH₂）的水解：酸碱全不可逆（⟶）与氨气石蕊测试", "html": "\n                <div class=\"b-scheme\">\n<pre>把乙酰胺 Ethanamide (CH₃CO—NH₂) 的 C—N 键剪开（原胚：酸性的 CH₃COOH + 碱性的 NH₃）：\n\n  ┌─ ① 酸性水解 [dilute HCl(aq) 或 dilute H₂SO₄(aq), heat under reflux] —— 不可逆 ⟶ ！\n  │     CH₃CONH₂ + H₂O + H⁺(aq) ⟶ CH₃COOH(aq) + NH₄⁺(aq)   （用稀盐酸则写 + NH₄Cl(aq)）\n  │     👉 现象：无气体放出！（碱性的 NH₃ 在酸汤里立即质子化变成铵离子 NH₄⁺ 锁在溶液中！）\n  │\n  └─ ② 碱性水解 [NaOH(aq) 或 KOH(aq), heat under reflux] —— 不可逆 ⟶ ！\n        CH₃CONH₂ + OH⁻(aq) ⟶ CH₃COO⁻(aq) + NH₃(g)↑         （化学方程式写 CH₃COO⁻Na⁺ + NH₃(g)）\n        👉 现象：放出有刺激性气味的无色氨气 NH₃(g)，使湿润的红色石蕊试纸变蓝\n                 （turns moist red litmus paper blue）！</pre>\n                </div>\n                <div class=\"b-note\">🔍 <strong>鉴别细节</strong>：铵盐（如 <code>CH₃COO⁻NH₄⁺</code>）加 <code>NaOH(aq)</code> 在室温/微热即刻迅速放 <code>NH₃</code>；而共价的未取代酰胺必须持续<strong>煮沸/回流加热（boil / reflux）</strong>断 <code>C—N</code> 键才放 <code>NH₃</code>！</div>\n                ", "start": 142.309, "end": 244.868}, {"id": "b6_3", "tag": "板书 3 · 终极口诀与 Unit 31 大满贯地图", "title": "水解题锁分口诀：“酸中无氨气，碱中无游离酸，醇见 NaOH 不变盐”", "html": "\n<svg viewBox=\"0 0 820 315\" class=\"board-svg\" role=\"img\" aria-label=\"Unit 31 Complete Functional Group Interconversion Map\">\n  <defs>\n    <marker id=\"mArr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5.5\" markerHeight=\"5.5\" orient=\"auto\">\n      <path d=\"M0,1 L9,5 L0,9 z\" fill=\"#334155\"/>\n    </marker>\n  </defs>\n  <rect x=\"6\" y=\"6\" width=\"808\" height=\"303\" rx=\"12\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"22\" y=\"30\" font-size=\"14\" font-weight=\"700\" fill=\"#0f172a\">Unit 31 全景官能团转化地图（有机合成“地铁总枢纽”）</text>\n\n  <!-- Nodes -->\n  <rect x=\"24\" y=\"56\" width=\"112\" height=\"44\" rx=\"9\" fill=\"#fffbeb\" stroke=\"#d97706\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"75\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#92400e\">Alkane 烷烃</text>\n  <text x=\"80\" y=\"91\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#b45309\">R—H</text>\n\n  <rect x=\"24\" y=\"210\" width=\"112\" height=\"46\" rx=\"9\" fill=\"#eff6ff\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"230\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1d4ed8\">Alkene 烯烃</text>\n  <text x=\"80\" y=\"246\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2563eb\">C=C</text>\n\n  <rect x=\"195\" y=\"132\" width=\"126\" height=\"48\" rx=\"9\" fill=\"#fdf4ff\" stroke=\"#a21caf\" stroke-width=\"2\"/>\n  <text x=\"258\" y=\"153\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#86198f\">Haloalkane 卤代烷</text>\n  <text x=\"258\" y=\"169\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#a21caf\">R—X</text>\n\n  <rect x=\"378\" y=\"132\" width=\"128\" height=\"50\" rx=\"10\" fill=\"#ecfdf5\" stroke=\"#059669\" stroke-width=\"2.5\"/>\n  <text x=\"442\" y=\"153\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"800\" fill=\"#065f46\">★ Alcohol 醇</text>\n  <text x=\"442\" y=\"170\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#047857\">1° / 2° / 3° R—OH</text>\n\n  <rect x=\"558\" y=\"52\" width=\"132\" height=\"48\" rx=\"9\" fill=\"#fff7ed\" stroke=\"#ea580c\" stroke-width=\"2\"/>\n  <text x=\"624\" y=\"73\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#c2410c\">Aldehyde / Ketone</text>\n  <text x=\"624\" y=\"89\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ea580c\">RCHO / RCOR'</text>\n\n  <rect x=\"558\" y=\"198\" width=\"132\" height=\"50\" rx=\"9\" fill=\"#fff1f2\" stroke=\"#e11d48\" stroke-width=\"2\"/>\n  <text x=\"624\" y=\"219\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#be123c\">Carboxylic Acid</text>\n  <text x=\"624\" y=\"236\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#e11d48\">RCOOH (羧酸)</text>\n\n  <rect x=\"716\" y=\"130\" width=\"84\" height=\"46\" rx=\"8\" fill=\"#f0fdfa\" stroke=\"#0d9488\" stroke-width=\"2\"/>\n  <text x=\"758\" y=\"150\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#0f766e\">Ester 酯</text>\n  <text x=\"758\" y=\"165\" text-anchor=\"middle\" font-size=\"10\" fill=\"#0d9488\">RCOOR'</text>\n\n  <rect x=\"716\" y=\"232\" width=\"84\" height=\"46\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <text x=\"758\" y=\"252\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#3730a3\">Amide 酰胺</text>\n  <text x=\"758\" y=\"267\" text-anchor=\"middle\" font-size=\"10\" fill=\"#4f46e5\">RCONH₂</text>\n\n  <!-- Key Arrows & Labels -->\n  <line x1=\"80\" y1=\"210\" x2=\"80\" y2=\"104\" stroke=\"#334155\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"48\" y=\"160\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1d4ed8\">H₂ / Pt</text>\n\n  <line x1=\"136\" y1=\"80\" x2=\"225\" y2=\"130\" stroke=\"#334155\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"192\" y=\"96\" text-anchor=\"middle\" font-size=\"10\" fill=\"#92400e\">Cl₂/Br₂, UV light</text>\n\n  <line x1=\"136\" y1=\"224\" x2=\"225\" y2=\"182\" stroke=\"#334155\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"172\" y=\"196\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#2563eb\">+ HX (马氏)</text>\n\n  <path d=\"M378,175 Q260,255 139,240\" fill=\"none\" stroke=\"#059669\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"275\" y=\"246\" text-anchor=\"middle\" font-size=\"10\" fill=\"#065f46\">conc. H₂SO₄ 180°C / Al₂O₃, heat (脱水)</text>\n\n  <line x1=\"321\" y1=\"148\" x2=\"375\" y2=\"148\" stroke=\"#334155\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"349\" y=\"141\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#86198f\">NaOH, reflux</text>\n  <line x1=\"378\" y1=\"165\" x2=\"324\" y2=\"165\" stroke=\"#334155\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"349\" y=\"180\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#065f46\">PCl₅ / SOCl₂</text>\n\n  <line x1=\"472\" y1=\"132\" x2=\"555\" y2=\"82\" stroke=\"#ea580c\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"502\" y=\"96\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#c2410c\">Cr₂O₇²⁻/H⁺</text>\n  <line x1=\"558\" y1=\"94\" x2=\"486\" y2=\"136\" stroke=\"#2563eb\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"536\" y=\"128\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#1d4ed8\">NaBH₄ / LiAlH₄</text>\n\n  <line x1=\"624\" y1=\"100\" x2=\"624\" y2=\"194\" stroke=\"#be123c\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"658\" y=\"150\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#be123c\">(醛) Cr₂O₇²⁻/H⁺</text>\n\n  <line x1=\"482\" y1=\"182\" x2=\"555\" y2=\"215\" stroke=\"#be123c\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"515\" y=\"216\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#be123c\">1°醇回流 / LiAlH₄逆还原</text>\n\n  <line x1=\"690\" y1=\"205\" x2=\"735\" y2=\"178\" stroke=\"#0d9488\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"728\" y=\"198\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#0f766e\">⇌ +R'OH / 水解</text>\n\n  <line x1=\"690\" y1=\"236\" x2=\"714\" y2=\"250\" stroke=\"#4f46e5\" stroke-width=\"1.8\" marker-end=\"url(#mArr)\"/>\n  <text x=\"708\" y=\"289\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#3730a3\">1.SOCl₂ 2.NH₃ / 水解</text>\n</svg>\n", "start": 245.518, "end": 349.513}], "turns": [{"speaker": "teacher", "boardId": "b6_1", "displayHtml": "欢迎来到收官之战——第 6 讲！上一讲我们把羧酸拼成了酯（esters）和未取代酰胺（unsubstituted amides）；这一讲我们要拿起化学剪刀，通过<strong>水解反应（hydrolysis）</strong>把它们重新剪开！这可是考评局阅卷报告年年点名批评的重灾区，但今天只要记住一句口诀，你就能做到百分之百零失误！先看<strong>第 1 张板书</strong>：把乙酸乙酯（ethyl ethanoate, <code>CH₃COOCH₂CH₃</code>）放进稀硫酸里回流加热，和放进氢氧化钠溶液里回流加热，有什么本质区别？", "start": 0.25, "end": 33.571}, {"speaker": "student", "boardId": "b6_1", "displayHtml": "我看表格里，稀酸催化下的<strong>酸性水解（acid hydrolysis）</strong>正好是酯化反应的倒放，所以必须画<strong>可逆箭头 <code>⇌</code></strong>，反应不能进行到底；而用 <code>NaOH(aq)</code> 的<strong>碱性水解（alkaline hydrolysis）</strong>——也叫<strong>皂化反应（saponification）</strong>——画的是<strong>单向箭头 <code>⟶</code></strong>，产率更高！为什么碱性水解就能一竿子插到底呢？", "start": 33.931, "end": 57.982}, {"speaker": "teacher", "boardId": "b6_1", "displayHtml": "问到根子上了！在碱性水解里，<code>NaOH</code> 可不是催化剂，而是实打实的反应物：酯键一剪开，刚露头的乙酸立刻被 <code>OH⁻</code> 中和，变成了稳定的<strong>羧酸盐——乙酸钠（sodium ethanoate, <code>CH₃COO⁻Na⁺</code>）</strong>！乙酸根离子没法再跟乙醇倒回去合成酯，平衡被彻底锁死在右边，所以反应 100% 进行到底！小琳，这里有两个超级容易写错的坑：第一，在碱性水解方程式右边，能写游离的乙酸 <code>CH₃COOH</code> 吗？第二，拆出来的乙醇 <code>CH₃CH₂OH</code> 泡在过量的氢氧化钠里，会不会也变成乙醇钠 <code>CH₃CH₂O⁻Na⁺</code>？", "start": 58.342, "end": 94.706}, {"speaker": "student", "boardId": "b6_1", "displayHtml": "第一个肯定不能写游离酸，因为在烧碱汤里酸早就被中和成盐 <code>CH₃COO⁻Na⁺</code> 了！至于第二个……乙醇是中性的，第 3 讲刚学过只有活泼金属钠单质 <code>Na(s)</code> 才能把醇变成乙醇钠，氢氧化钠水溶液奈何不了醇羟基，所以乙醇一定保持 <code>CH₃CH₂OH</code> 原貌不变！", "start": 95.066, "end": 113.439}, {"speaker": "teacher", "boardId": "b6_1", "displayHtml": "给你的清醒鼓掌！如果题目接着问：皂化反应结束后，烧瓶里装的是羧酸钠盐，我怎么把纯净的游离羧酸 <code>RCOOH</code> 重新拿回来？只需要往冷却后的混合液里加入<strong>过量的稀盐酸或稀硫酸（<code>excess dilute HCl(aq)</code> / <code>H₂SO₄(aq)</code>）</strong>酸化——注意“过量 <code>excess</code>”这个词必不可少，因为要先中和掉剩下来的 <code>NaOH</code>，多余的氢离子 <code>H⁺</code> 才能把羧酸根重新变回游离羧酸！", "start": 113.799, "end": 141.659}, {"speaker": "student", "boardId": "b6_2", "displayHtml": "记住了，酸化必须加 excess！那再看<strong>第 2 张板书</strong>的<strong>未取代酰胺（unsubstituted amides, <code>RCONH₂</code>）</strong>水解：把中间的碳氮单键 <code>C—N</code> 剪开，原本拆出来的一边是酸性的羧酸 <code>RCOOH</code>，另一边是碱性的氨气 <code>NH₃</code>——哇，一边酸一边碱，岂不是不管泡在酸汤还是碱汤里，总有一边会被吃掉？", "start": 142.309, "end": 164.4}, {"speaker": "teacher", "boardId": "b6_2", "displayHtml": "你一下子就悟透了！正因如此，<strong>未取代酰胺不管是酸性水解还是碱性水解，全都是不可逆反应（一律写单向箭头 <code>⟶</code>）</strong>！你看：① 如果和过量稀盐酸回流（酸性水解），游离羧酸 <code>RCOOH</code> 安然无恙，但碱性的氨气一露头就被氢离子抓住变成了<strong>铵离子 <code>NH₄⁺</code>（氯化铵 <code>NH₄Cl</code>）</strong>留在水里，所以<strong>没有任何气体冒出来</strong>！② 如果和氢氧化钠溶液回流（碱性水解），酸性的羧酸变成<strong>羧酸根离子 <code>RCOO⁻</code></strong>，而碱性的氨气在碱汤里畅通无阻，直接变成有刺激性气味的无色气体 <strong><code>NH₃(g)</code></strong> 冒出来！考场上怎么检验冒出来的氨气？", "start": 164.76, "end": 205.935}, {"speaker": "student", "boardId": "b6_2", "displayHtml": "用一张<strong>湿润的红色石蕊试纸（moist red litmus paper）</strong>放在管口，试纸会<strong>由红变蓝（turns from red to blue）</strong>！千万不能漏掉“湿润 moist”这个词！顺便问一下老师，铵盐（比如乙酸铵 <code>CH₃COO⁻NH₄⁺</code>）加 <code>NaOH</code> 也会放氨气，怎么区分乙酰胺和乙酸铵呀？", "start": 206.295, "end": 225.99}, {"speaker": "teacher", "boardId": "b6_2", "displayHtml": "看反应条件快慢！乙酸铵本身就有现成的铵离子 <code>NH₄⁺</code>，室温下滴入 <code>NaOH(aq)</code> 立刻就能放出氨气；而乙酰胺是共价分子，必须跟 <code>NaOH(aq)</code> <strong>持续煮沸或回流加热（boiling / heating under reflux）</strong>扯断碳氮共价键，才会放出氨气。", "start": 226.351, "end": 244.868}, {"speaker": "student", "boardId": "b6_3", "displayHtml": "太酷了！现在看<strong>第 3 张板书</strong>标题那句十七字锁分真言：<strong>“酸中无氨气，碱中无游离酸，醇见 <code>NaOH</code> 不变盐！”</strong> 我来拿个双官能团大魔王练练手：假如一个分子左边是酰胺基 <code>H₂NCO-</code>，右边是甲酯基 <code>-COOCH₃</code>，如果跟过量 <code>NaOH(aq)</code> 回流，两刀剪开后：中间的二元酸全变羧酸根负离子 <code>-COO⁻</code>，右边的甲醇保持 <code>CH₃OH</code> 不变盐，左边的氨基变成氨气 <code>NH₃(g)</code> 飞走——一秒钟全写对了！", "start": 245.518, "end": 275.802}, {"speaker": "teacher", "boardId": "b6_3", "displayHtml": "无懈可击！而且今天学的酯键水解和酰胺键水解，直接就铺平了后面 Unit 33 的道路——动植物油脂加 <code>NaOH</code> 皂化做肥皂（soaps），还有矿泉水瓶聚酯（PET）和尼龙（nylon）为什么怕强酸强碱腐蚀，底层全都是今天这一刀水解！最后让我们看着第 3 张板书上的<strong>Unit 31 全景官能团转化地图</strong>做个收束：烷烃经紫外光取代或烯烃经马氏规则加成抵达卤代烷；卤代烷碱性水解推开“中心枢纽”醇的大门；醇往左能脱水回烯烃，往右经蒸馏得醛、回流得羧酸，又能被 <code>NaBH₄</code> 或 <code>LiAlH₄</code> 还原回来；羧酸再往外延伸出可逆的酯和两步合成的酰胺！", "start": 276.162, "end": 321.539}, {"speaker": "student", "boardId": "b6_3", "displayHtml": "哇，原本零散的十几个化学反应，现在在我脑子里彻底连成一张活的地铁网了！谢谢陈老师，这下明天上化学课讲 Unit 31 我心里超有底！", "start": 321.899, "end": 334.736}, {"speaker": "teacher", "boardId": "b6_3", "displayHtml": "为你点赞！预习完不妨点一下每讲下方的两道快问快答热个身，上课时重点留意老师演示的实验颜色变化和仪器细节。Unit 31 预习通关，我们课堂实战见！", "start": 335.096, "end": 349.513}], "quickChecks": [{"q": "将丙酸乙酯（CH₃CH₂COOCH₂CH₃）与过量 NaOH(aq) 回流加热直至完全反应，所得混合液中的有机产物是什么？", "options": ["A. 丙酸（CH₃CH₂COOH）与乙醇（CH₃CH₂OH）", "B. 丙酸钠（CH₃CH₂COO⁻Na⁺）与乙醇（CH₃CH₂OH）", "C. 丙酸钠（CH₃CH₂COO⁻Na⁺）与乙醇钠（CH₃CH₂O⁻Na⁺）"], "ans": 1, "exp": "牢记铁律“碱中无游离酸，醇见 NaOH 不变盐”：羧酸部分变成丙酸钠盐 CH₃CH₂COO⁻Na⁺，醇部分保持中性乙醇 CH₃CH₂OH！"}, {"q": "乙酰胺（CH₃CONH₂）与过量稀盐酸 dilute HCl(aq) 回流加热完全水解时，产物是什么？", "options": ["A. CH₃COOH + NH₄Cl(aq)（无气体放出，反应不可逆）", "B. CH₃COOH + NH₃(g)（放出刺激性氨气）", "C. CH₃COO⁻Na⁺ + NH₄Cl(aq)"], "ans": 0, "exp": "牢记“酸中无氨气”：在过量稀盐酸中，生成的碱性氨气立即质子化变成氯化铵 NH₄Cl(aq) 留           audio.play().catch(() => {});
        } else {
          playBtn.textContent = '▶ 开始听课';
        }
      }

      function seekAndPlay(targetSec) {
        if (audio.readyState >= 1) {
          audio.currentTime = targetSec;
          audio.play().catch(() => {});
        } else {
          audio.addEventListener('loadedmetadata', function onMeta() {
            audio.removeEventListener('loadedmetadata', onMeta);
            audio.currentTime = targetSec;
            audio.play().catch(() => {});
          });
          audio.load();
        }
      }

      function syncClassroomHighlight(t) {
        const ep = episodes[state.currentEpIdx];
        if (!ep) return;

        // Find active turn
        let foundIdx = -1;
        for (let i = 0; i < ep.turns.length; i++) {
          const turn = ep.turns[i];
          const nextStart = (i + 1 < ep.turns.length) ? ep.turns[i + 1].start : ep.duration + 1;
          if (t >= turn.start - 0.08 && t < nextStart) {
            foundIdx = i;
            break;
          }
        }

        if (foundIdx !== -1 && foundIdx !== activeTurnIdx) {
          activeTurnIdx = foundIdx;
          transcriptList.querySelectorAll('.turn-bubble').forEach((el, i) => {
            el.classList.toggle('active-turn', i === foundIdx);
          });
          const activeTurnEl = document.getElementById(`turn-${foundIdx}`);
          if (activeTurnEl && state.autoScroll) {
            activeTurnEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }

          const targetBoardId = ep.turns[foundIdx].boardId;
          if (targetBoardId && targetBoardId !== activeBoardId) {
            const prevBoard = activeBoardId;
            activeBoardId = targetBoardId;
            boardsContainer.querySelectorAll('.board-card').forEach(card => {
              card.classList.toggle('is-active-board', card.getAttribute('data-board-id') === targetBoardId);
            });
            if (prevBoard !== null && state.autoScroll) {
              const cardEl = document.getElementById(`card-${targetBoardId}`);
              if (cardEl) {
                const y = cardEl.getBoundingClientRect().top + window.scrollY - 82;
                window.scrollTo({ top: y, behavior: 'smooth' });
              }
            }
          }
        }
      }

      audio.addEventListener('timeupdate', () => {
        const t = audio.currentTime;
        if (!isDraggingSlider) {
          seekSlider.value = String(t);
        }
        curTimeEl.textContent = fmtTime(t);
        syncClassroomHighlight(t);
      });

      audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && isFinite(audio.duration)) {
          seekSlider.max = String(audio.duration);
          durTimeEl.textContent = fmtTime(audio.duration);
        }
        audio.playbackRate = state.speed;
      });

      audio.addEventListener('play', () => {
        playBtn.textContent = '⏸ 暂停';
      });

      audio.addEventListener('pause', () => {
        playBtn.textContent = '▶ 继续听课';
      });

      audio.addEventListener('ended', () => {
        const ep = episodes[state.currentEpIdx];
        state.doneEps[ep.id] = true;
        saveState();
        renderEpisodeStrip();
        if (state.autoPlayNext && state.currentEpIdx + 1 < episodes.length) {
          loadEpisode(state.currentEpIdx + 1, true);
        } else {
          playBtn.textContent = '↺ 重听本讲';
        }
      });

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().catch(() => {});
        } else {
          audio.pause();
        }
      });

      document.getElementById('rew-btn').addEventListener('click', () => {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      });

      document.getElementById('fwd-btn').addEventListener('click', () => {
        audio.currentTime = Math.min(audio.duration || 9999, audio.currentTime + 10);
      });

      document.getElementById('prev-ep-btn').addEventListener('click', () => {
        if (state.currentEpIdx > 0) loadEpisode(state.currentEpIdx - 1, !audio.paused);
      });

      document.getElementById('next-ep-btn').addEventListener('click', () => {
        if (state.currentEpIdx + 1 < episodes.length) loadEpisode(state.currentEpIdx + 1, !audio.paused);
      });

      seekSlider.addEventListener('input', () => {
        isDraggingSlider = true;
        curTimeEl.textContent = fmtTime(parseFloat(seekSlider.value));
      });

      seekSlider.addEventListener('change', () => {
        audio.currentTime = parseFloat(seekSlider.value);
        isDraggingSlider = false;
      });

      speedSelect.addEventListener('change', () => {
        state.speed = parseFloat(speedSelect.value);
        audio.playbackRate = state.speed;
        saveState();
      });

      autoScrollBtn.addEventListener('click', () => {
        state.autoScroll = !state.autoScroll;
        autoScrollBtn.classList.toggle('on', state.autoScroll);
        autoScrollBtn.textContent = state.autoScroll ? '🎯 自动跟随：开' : '🎯 自动跟随：关';
      });

      autoplayBtn.addEventListener('click', () => {
        state.autoPlayNext = !state.autoPlayNext;
        autoplayBtn.textContent = state.autoPlayNext ? '🔁 连播：开' : '🔁 连播：关';
      });

      document.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        if (e.code === 'Space') {
          e.preventDefault();
          playBtn.click();
        } else if (e.code === 'ArrowLeft') {
          audio.currentTime = Math.max(0, audio.currentTime - 5);
        } else if (e.code === 'ArrowRight') {
          audio.currentTime = Math.min(audio.duration || 9999, audio.currentTime + 5);
        }
      });

      loadEpisode(state.currentEpIdx, false);
    })();
  </script>
</body>
</html>
